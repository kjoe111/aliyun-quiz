<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<title>阿里云刷题题库</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#72767d;--line:#e8eaed;--accent:#111827;--good:#16794b;--bad:#c43d3d;--soft:#eef1f4}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(94px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(245,246,248,.94);backdrop-filter:blur(14px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px} .grow{flex:1}
.title{font-weight:750;font-size:18px} .small{font-size:12px;color:var(--muted)}
.progress{height:5px;background:#e1e4e8;border-radius:999px;overflow:hidden;margin-top:9px} .progress>i{display:block;height:100%;background:var(--accent);width:0}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px 14px 2px;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px} .chip.active{background:#111827;color:#fff;border-color:#111827}
.card{margin:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:13px} .badge{font-size:12px;background:var(--soft);padding:5px 8px;border-radius:8px;color:#555}
.q{font-size:18px;line-height:1.7;font-weight:650;white-space:pre-wrap}
.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin-top:10px;font-size:16px;line-height:1.5;color:var(--text)}
.option .letter{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid #cfd4da;display:grid;place-items:center;font-size:13px;font-weight:700}
.option.selected{border-color:#707780;background:#f4f6f8} .option.selected .letter{background:#111827;color:#fff;border-color:#111827}
.option.good{border-color:#8cc9aa;background:#edf8f2} .option.bad{border-color:#e3a1a1;background:#fff1f1}
.option.good .letter{background:var(--good);color:#fff;border-color:var(--good)} .option.bad .letter{background:var(--bad);color:#fff;border-color:var(--bad)}
.answerbox{margin-top:16px;border-top:1px solid var(--line);padding-top:15px;line-height:1.7;display:none} .answerbox.show{display:block}
.answerline{font-weight:750} .exp{color:#4f555c;font-size:14px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.toolbar-inner{max-width:692px;margin:auto;display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:9px}
.btn{border:0;border-radius:13px;padding:13px 10px;font-size:15px;font-weight:700;background:#111827;color:#fff} .btn.secondary{background:#eef1f4;color:#222} .icon{font-size:18px;padding:10px 0}
.empty{padding:60px 24px;text-align:center;color:var(--muted)} .stats{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.jump{width:70px;border:1px solid var(--line);border-radius:10px;padding:7px 8px;background:#fff;font-size:13px}
@media (min-width:721px){.q{font-size:20px} .card{padding:22px}}

.backupbar{margin:10px 14px 0;display:flex;gap:8px;flex-wrap:wrap}.mini-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:13px;color:var(--text)}.storage-note{margin:8px 14px 0;font-size:12px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="row">
      <div class="grow">
        <div class="title">阿里云刷题</div>
        <div class="stats"><span id="statDone">已答 0</span><span id="statCorrect">正确 0</span><span id="statWrong">当前错题 0</span><span id="statWrong1">错1次 0</span><span id="statWrong2">错2次 0</span><span id="statWrong3">错3+次 0</span></div>
      </div>
      <input id="jump" class="jump" inputmode="numeric" placeholder="跳到题号">
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <div class="tabs">
    <button class="chip active" data-mode="all">顺序刷题</button>
    <button class="chip" data-mode="random">随机刷题</button>
    <button class="chip" data-mode="wrong">当前错题</button>
    <button class="chip" data-mode="wrong1">错1次</button>
    <button class="chip" data-mode="wrong2">错2次</button>
    <button class="chip" data-mode="wrong3">错3+次</button>
    <button class="chip" data-mode="fav">收藏</button>
  </div>
  <div class="backupbar">
    <button id="exportProgress" class="mini-btn">导出进度</button>
    <button id="importProgress" class="mini-btn">导入进度</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
  <div class="storage-note" id="storageNote">正在读取本机进度…</div>
  <main id="main"></main>
</div>
<div class="toolbar">
  <div class="toolbar-inner">
    <button id="prev" class="btn secondary icon">‹</button>
    <button id="fav" class="btn secondary">☆ 收藏</button>
    <button id="submit" class="btn">提交答案</button>
    <button id="next" class="btn secondary icon">›</button>
  </div>
</div>
<script>
const QUESTIONS=[{"id":1,"question":"动态查看日志文件尾部信息的命令是什么？","options":{"A":"tailf","B":"head","C":"cat","D":"less"},"answer":["A"],"explanation":"tail 的命令用于显示文件尾部内容，默认显示指定文件的末尾 10 行； head 的命令为用于查看文件 的开头部分； cat 命令主要用于将文件、连接文件和创建文件； less 命令主要用于查看文件，查看之前不 会加载整个文件；"},{"id":2,"question":"RDS MySQL 通过以下哪种引擎支持数据压缩功能。","options":{"A":"MyISAM","B":"InnoDB","C":"TokuDB","D":"Memory"},"answer":["C"],"explanation":"MyISAM：RDS MySQL 不支持 MyISAM 引擎，参考官方链接： https://help.aliyun.com/document_detail/52558.html InnoDB：InnoDB 是存储引擎，参考官方链接： https://help.aliyun.com/document_detail/96047.html (aliyun.com) TokuDB：阿里云数据库 MySQL 5.6 版支持通过 TokuDB 存储引擎压缩数据。经过大量测试表明，数据表从 InnoDB 存储引擎转到 TokuDB 存储 引擎后，数据量可以减少 80% 到 90%，即 2T 的数据量能压缩到 400G 甚至更低。除了数据压缩外， TokuDB 存储引擎还支持事务和在线 DDL 操作，可以很好兼容运行于 MyISAM 或 InnoDB 存储引擎上的应用 Memory：用来存储和读写的大量的二进制数据"},{"id":3,"question":"下列属于 DNS 常用解析记录的是（）。","options":{"A":"A 记录","B":"B 记录","C":"NS 记录","D":"CNAME 记录"},"answer":["A","C","D"],"explanation":"云解析 DNS 目前支持下列记录类型： A 记录 （可实现将域名指向 IP 地址） CNAME 记录（可实现将 域名指向另一个域名） MX 记录（用于电子邮件系统发邮件时根据收信人的地址后缀来定位邮件服务器） AAAA 记录（可实现将域名指向 IPV6 地址） TXT 记录（文本记录） NS 记录（可实现把子域名交给其他 DNS 服务商提供解析服务） SRV 记录（服务定位器） CAA 记录（认证机构授权） 云解析 DNS 除了上述记录类型， 还提供 URL 隐性/显性转发服务，可以实现将一个域名指向到另外一个已存在的站点。 https://help.aliyun.com/document_detail/29725.html"},{"id":4,"question":"下列选项中，关于阿里云 SLB 实现 HTTPS 负载均衡，说法正确的是（）。","options":{"A":"SLB 提供统一的证书管理服务，证书无需上传后端 ECS","B":"SLB 提供统一的证书管理服务，证书必须上传后端 ECS","C":"解密处理在负载均衡上进行。降低后端 ECS CPU 开销","D":"解密处理在后端 ECS 上进行"},"answer":["A","C"],"explanation":"阿里云 SLB 实现 HTTPS 负载均衡时,SLB 提供统一的证书管理服务，证书无需上传后端 ECS,并且解密 处理在负载均衡上进行,用来降低后端 ECS CPU 开销 官方链接： https://help.aliyun.com/document_detail/101364.html"},{"id":5,"question":"通过云服务器 ECS 控制台，可以对 ECS 实例进行如下（）操作。","options":{"A":"停止","B":"启动","C":"重启","D":"文件注入"},"answer":["A","B","C"],"explanation":"文件注入操作需要通过编写程序代码来进行注入。 官网链接： https://help.aliyun.com/document_detail/163467.html?spm=a2c4g.11186623.0.0.1d464692yzJXjm"},{"id":6,"question":"一台 ECS 服务器最多可以挂载（）数据盘。","options":{"A":"1 块","B":"2 块","C":"3 块","D":"64 块"},"answer":["D"],"explanation":"链接：https://help.aliyun.com/document_detail/25412.html 单实例数据盘数量限制为 64 块"},{"id":7,"question":"以下哪个不属于虚拟化软件技术 （ ）","options":{"A":"KVM","B":"virtualhost","C":"Vmware","D":"Hyper-V"},"answer":["B"],"explanation":"KVM Vmware 这两个肯定是虚拟化技术，Hypervisor 这个是虚拟化核心技术，virtualhost 更多是虚拟 化的一个概念或者配置方法。"},{"id":8,"question":"负载均衡主要可以应用于以下哪些场景中?","options":{"A":"横向扩展应用系统的服务能力，适用于各种 web server 和 app server","B":"消除应用系统的单点故障，当其中一部分 ECS 宕机后，应用系统仍能正常工作","C":"单台 ECS 服务器的垂直扩容","D":"需要浮动 IP 时可以选择 SLB 负载均衡服务实现"},"answer":["A","B"],"explanation":"单台 ECS 服务器的垂直扩容是通过 ECS 配置扩容。需要浮动 IP 时不能通过 SLB 负载均衡服务实现， 阿里云的上 ECS 服务器跟我们自己的虚拟机不一样，它不支持浮动 IP。如果要支持需要：1、阿里云上提工 单，让其开通 havip，高可用虚拟 ip。2、到专有 VPC 网络的高可用虚拟 IP，点击创建高可用虚拟 IP。 官 网链接：https://help.aliyun.com/document_detail/93511.html"},{"id":9,"question":"使用那些软件可以远程登陆一台 Linux 版本的 ECS 服务器","options":{"A":"Xshell","B":"mstsc","C":"Putty","D":"SecureCRT"},"answer":["A","C","D"],"explanation":"mstsc 是 windows 的远程登陆方式。"},{"id":10,"question":"阿里云按量付费云服务器 ECS 每小时计费总费用包括","options":{"A":"CPU 费用","B":"内存费用","C":"数据盘费用","D":"公网带宽费用"},"answer":["A","B","C","D"],"explanation":"ECS 每小时计费总费用包括：CPU 费用、内存费用、数据盘费用、公网带宽费用 官网链接： https://help.aliyun.com/document_detail/25370.html"},{"id":11,"question":"在 ECS 服务器磁盘中那种磁盘 IOPS 吞吐性能最佳","options":{"A":"SSD 云盘","B":"普通云盘","C":"高效云盘","D":"OSS"},"answer":["A"],"explanation":"ESSD 云盘：0.2 ms；SSD 云盘：0.5~2 ms;高效云盘：1~3 ms;普通云盘：5~10 ms。如有 ESSD 选 ESSD，有选 SSD。 官方链接：https://help.aliyun.com/document_detail/108494.html"},{"id":12,"question":"阿里云 SLB 负载均衡支持的调度算法有哪些","options":{"A":"UPL","B":"加权轮询","C":"加权最小连接数","D":"IP Hash"},"answer":["B","C","D"],"explanation":"调度算法 SLB 支持轮询、加权轮询（WRR）和一致性哈希（CH）调度算法等。 upload 是上传，不是 调度算法 官方链接：https://help.aliyun.com/document_detail/196874.html"},{"id":13,"question":"快照是磁盘上的数据在某一个时间点的拷贝，关于快照支持的功能，下列描述正确的是（）。","options":{"A":"快照回滚","B":"创建自定义镜像","C":"创建快照数量无限制","D":"快照需要手动创建"},"answer":["A","B"],"explanation":"创建快照数量有限制，阿里云快照 2.0 服务上线后,每个磁盘拥有 64 个快照额度； 快照通过控制台 配置后可自动配置。 https://help.aliyun.com/document_detail/25391.html https://help.aliyun.com/document_detail/25460.html"},{"id":14,"question":"在购买阿里云 RDS 时，决定数据库实例 IOPS 大小的参数是","options":{"A":"存储空间大小","B":"内存大小","C":"所选地域","D":"购买时长"},"answer":["B"],"explanation":"决定数据库实例 IOPS 大小的参数是内存大小"},{"id":15,"question":"使用云盾可以实现什么功能","options":{"A":"防止 Ddos 攻击","B":"防止广播风暴","C":"隔离广播域","D":"杀毒"},"answer":["A"],"explanation":"云盾的产品及服务：网络安全：DDoS 高防 IP、Web 应用防火墙 、云防火墙 服务器安全：安骑士（已 更新为云安全中心 ） 应用安全：SSL 证书 数据安全：数据库审计、加密服务 业务安全：内容安全 安全管 理：态势感知、堡垒机、安全管家、 混合云 先知(服务)：先知 SSL 证书"},{"id":16,"question":"阿里云使用什么对 OSS 对象存储中的照片进行鉴黄","options":{"A":"网盟","B":"绿网","C":"蓝网","D":"防火墙"},"answer":["B"],"explanation":"阿里绿网目前包括站点检测服务和 OSS 图片鉴黄服务"},{"id":17,"question":"SLB 负载均衡前端协议支持那些","options":{"A":"TCP","B":"HTTP","C":"HTTPS","D":"UDP"},"answer":["A","B","C","D"],"explanation":"SLB 支持提供四层和七层负载均衡服务。当前提供四层（TCP 协议和 UDP 协议）和七层（HTTP 和 HTTPS 协议）的负载均衡服务"},{"id":18,"question":"ECS 云服务器可以挂载什么数据盘","options":{"A":"普通盘","B":"iscsi 云盘","C":"SSD 云盘","D":"混合云盘"},"answer":["A","C"],"explanation":"云盘类型根据性能分类，云盘包含以下几类产品：ESSD 云盘 SSD 云盘高效云盘普通云盘 官网链接： https://help.aliyun.com/document_detail/146752.html"},{"id":19,"question":"可以用来对云服务器 ECS 进行远程管理的工具或命令包括","options":{"A":"ping","B":"远程桌面（mstsc）","C":"PuTTY","D":"SSH"},"answer":["B","C","D"],"explanation":"ping 只是检测网络连通性的工具,不能用来对云服务器 ECS 进行远程管理。 远程桌面（mstsc)， PuTTY 和 SSH 是常用的云服务器 ECS 远程管理工具。 官网链接： https://help.aliyun.com/document_detail/453041.html"},{"id":20,"question":"关于阿里云云服务器 ECS 内网通讯问题，说法错误的是","options":{"A":"相同账号下的同一地域（region）不同可用区域之间的云服务器 ECS 是不互通的","B":"所有地域内的服务器都是可以互通的","C":"相同账号下的同一地域（region）之间的云服务器 ECS 内网是不互通的","D":"相同账号下的不同地域（region）之间的云服务器 ECS 内网是不互通的"},"answer":["A","B","C"],"explanation":"1.相同账号下的不同地域（region）之间的云服务器 ECS 内网是不互通的 。2.相同账号下的同一地 域（region）之间的云服务器 ECS 内网是互通的 ，要在同一安全组下面。3.相同账号下的同一地域 （region）不同可用区之间的云服务器 ECS 内网是互通的"},{"id":21,"question":"在 ECS 弹性伸缩能力中，以下属于垂直扩展的是","options":{"A":"增加内存","B":"增加带宽","C":"增加机器","D":"增加 CPU"},"answer":["A","B","D"],"explanation":"垂直扩展是指增加服务器配置，包括增加内存，增加带宽和增加 CPU 水平扩展是指增加服务器数量， 包括增加机器。 官网链接：https://help.aliyun.com/document_detail/51704.html"},{"id":22,"question":"OSS 对象存储服务的读写权限可以设置为","options":{"A":"局部写","B":"公共读写","C":"公共读","D":"私有"},"answer":["B","C","D"],"explanation":"OSS 对象存储服务的读写权限可以设置为公共读写，公共读私有写和私有读写。 官网链接： https://help.aliyun.com/document_detail/147599.html"},{"id":23,"question":"OSS 对象存储可以存储那些数据","options":{"A":"日志","B":"图片","C":"视频","D":"文本"},"answer":["A","B","C","D"],"explanation":"OSS 对象存储可以存储的数据有日志，图片，视频和文本。 官网链接： https://help.aliyun.com/document_detail/172501.html"},{"id":24,"question":"阿里云云服务器 ECS 包括的镜像类型包括","options":{"A":"自定义镜像","B":"公共镜像","C":"第三方镜像市场提供的镜像","D":"微软镜像"},"answer":["A","B","C"],"explanation":"阿里云云服务器 ECS 包括的镜像类型有公共镜像，第三方镜像市场提供的镜像和自定义镜像，没有微 软镜像。 官网链接：https://help.aliyun.com/document_detail/25389.html"},{"id":25,"question":"阿里云云监控可以监控 ECS 实例的什么数据","options":{"A":"CPU 百分比","B":"网络流入速率","C":"TCP 连接数","D":"系统盘 IOPS"},"answer":["A","B","D"],"explanation":"阿里云云监控可以监控 ECS 实例的 CPU 百分比、内存使用百分比、磁盘 IOPS、网络流入流出速率等， 但是不能监控 TCP 连接数 官网链接：https://help.aliyun.com/document_detail/25482.html"},{"id":26,"question":"常用 Linux 发行版本有哪些","options":{"A":"FreeBSD Linux","B":"Ubuntu Linux","C":"Debian Linux","D":"Suse Linux"},"answer":["B","C","D"],"explanation":"Ubuntu Debian Suse 都是常见的 linux 发行版本，FreeBSD 是 Unix 操作系统，不属于 Linux"},{"id":27,"question":"目前阿里云 ECS 实例最大 CPU 规格为","options":{"A":"4 核","B":"8 核","C":"16 核","D":"32 核"},"answer":["D"],"explanation":"阿里云 ECS 实例目前最大 CPU 的规格是 32 核"},{"id":28,"question":"出于性能和安全性考虑，RDS MySQL 建议尽量采用哪种存储引擎？","options":{"A":"MylSAM","B":"InnoDB","C":"TokuDB","D":"Memory"},"answer":["B"],"explanation":"RDS MySQL 出于性能和安全性考虑建议尽量采用 InnoDB 存储引擎"},{"id":29,"question":"阿里云 ECS 服务器升级规则是","options":{"A":"重启升级网络，不重启升级内存和 CPU","B":"重启升级 CPU 和内存，不重启升级网络","C":"不重启升级 CPU 和内存，不重启升级网络","D":"重启升级网络，重启升级内存和 CPU"},"answer":["B"],"explanation":"阿里云 ECS 服务器升级规则是：重启升级 CPU 和内存，不重启升级网络"},{"id":30,"question":"阿里云云服务器 ECS 的英文全称是","options":{"A":"Elastic Compute Service","B":"Elastic Compute Server","C":"Elastic Container Service","D":"Elastic Computer Service"},"answer":["A"],"explanation":"阿里云云服务器 ECS 的英文全称是 Elastic Compute Service"},{"id":31,"question":"阿里云云服务器 ECS 按量付费的结算周期是","options":{"A":"每分钟结算","B":"每小时整点结算","C":"每天凌晨结算","D":"每月初结算"},"answer":["B"],"explanation":"阿里云云服务器 ECS 按量付费的结算周期是小时"},{"id":32,"question":"使用云数据库 RDS 时，仍然需要用户关注的是","options":{"A":"连接数是否足够","B":"高可用","C":"安全补丁","D":"记录 SQL 审计日志"},"answer":["D"],"explanation":"阿里云负责 RDS 的日常维护和管理，包括但不限于软硬件故障处理、数据库补丁更新等工作，保障 RDS 的正常运转。仍然需要用户关注的是记录 SQL 审计日志"},{"id":33,"question":"阿里云 ECS 实例标签的作用","options":{"A":"快速查找实例","B":"无实际意义","C":"组合虚拟机实例","D":"加速实例"},"answer":["A"],"explanation":"阿里云 ECS 实例标签的作用是快速查找实例"},{"id":34,"question":"阿里云监控不可以监控什么数据","options":{"A":"ECS 实例信息","B":"RDS 数据库信息","C":"负载均衡数据信息","D":"镜像数量"},"answer":["D"],"explanation":"阿里云监控不可以监控镜像数量"},{"id":35,"question":"阿里云监控报警的短信限额为多少","options":{"A":"10000 条/月","B":"10 条/月","C":"2000 条/月","D":"1000 条/月"},"answer":["D"],"explanation":"阿里云监控报警的短信限额为 1000 条/月"},{"id":36,"question":"SLB 监听的端口范围为多少？","options":{"A":"1-1024","B":"1-65535","C":"1024-65535","D":"1-65536"},"answer":["B"],"explanation":"SLB 监听的端口范围为 1-65535"},{"id":37,"question":"阿里云 OSS 对象存储不包含什么功能","options":{"A":"3 副本","B":"HTTP 访问","C":"FTP 访问","D":"API 访问"},"answer":["C"],"explanation":"无法直接提供文件系统目录访问方式。OSS 的存储空间内部是扁平的，没有文件系统的目录等概念， 所有的对象都直接隶属于其对应的存储空间。如果您想要像使用本地文件夹和磁盘那样来使用 OSS 存储服务， 可以通过配置云存储网关来实现"},{"id":38,"question":"SLB 负载均衡可以对后端 ECS 服务器设置的权重范围是","options":{"A":"1-254","B":"0-100","C":"1-255","D":"100-200"},"answer":["B"],"explanation":"权重范围为 0~100，如果权重设置为 0，该服务器不会再接受新请求。"},{"id":39,"question":"为实现动态调整存储服务器的数量，对象存储可以使用（）算法。","options":{"A":"一致性 Hash 算法","B":"取余","C":"随机数","D":"顺序读写"},"answer":["A"],"explanation":"对象存储使用一致性 Hash 算法实现动态调整存储服务器的数量"},{"id":40,"question":"云计算环境中，用户不需要购买软硬件，直接购买云端所提供的服务即可使用，大大节省了用户投入成 本和服务上线时间。用户选择阿里云云服务器 ECS，属于云计算服务模式中的?","options":{"A":"基础设施即服务(laaS )","B":"平台即服务(Paas)","C":"数据即服务(Daas)","D":"软件即服务( Saas)"},"answer":["A"],"explanation":"云服务器（Elastic Compute Service，简称 ECS）是阿里云提供的性能卓越、稳定可靠、弹性扩展的 IaaS（Infrastructure as a Service）级别云计算服务。"},{"id":41,"question":"下列关于阿里云云服务器 ECS 中 GPU 服务器的说法，错误的是?","options":{"A":"适用于视频解码、深度学习等场景","B":"逻辑控制，串行运算","C":"具有实时高速的并行计算和浮点计算能力","D":"使用 CUDA 和 OpenCL 编程模型的通用 GPU 计算设计"},"answer":["B"],"explanation":"GPU 服务器的特点和优势在于出色的并行计算能力。"},{"id":42,"question":"下列关于释放阿里云云服务器 ECS 的说法中，错误的是?","options":{"A":"按量付费实例可以释放","B":"实例可以设置自动释放时间,让实创自动释放","C":"当实例释放时,数据盘是可以被保留","D":"实例释放后可以通过回收站找回"},"answer":["D"],"explanation":"实例释放后数据无法恢复，不能通过回收站找回。"},{"id":43,"question":"在阿里云中，可以对网络进行隔离的是?","options":{"A":"VPC","B":"VPN","C":"NAT","D":"EIP"},"answer":["A"],"explanation":"专有网络 VPC（Virtual Private Cloud）是用户基于阿里云创建的自定义私有网络, 不同的专有网络 之间二层逻辑隔离，用户可以在自己创建的专有网络内创建和管理云产品实例，比如 ECS、负载均衡、RDS 等。难度：容易。"},{"id":44,"question":"用户可以使用 Workbench 工具连接 Linux 系统云服务器 ECS。使用 Workbench 工具时需要用到的协议是?","options":{"A":"SSH","B":"HTTP","C":"HTTPS","D":"ICMP"},"answer":["A"],"explanation":"workbench 使用 SSH 协议连接 Linux 系统的 ECS 服务器。"},{"id":45,"question":"您所在公司的网站通过内容分发网络 CDN 进行加速，现在想删除该 CDN。如何操作才能保证网站可以被继 续访问?","options":{"A":"删除 CDN 后,不需要任何操作,源站可以直接访问","B":"源站所提供的服务访问只要保证正常即可","C":"在 DNS 处将 CNAME 记录改为源站的 A 记录","D":"源站的带宽保证充分即可"},"answer":["C"],"explanation":"对用户来说，访问的域名是不变的，所以需要改变 CDN 的 CNAME 域名解析记录更改到源站 A 记录，才 不会影响网站正常访问。"},{"id":46,"question":"如果启用了 VPC 内实例停止不收费后，用户停止一台按量付费的云服务器 ECS 并选择不保留实例，下列 会继续收取费用的是?","options":{"A":"VCPU","B":"内存","C":"固定公网 IP 地址","D":"系统盘"},"answer":["D"],"explanation":"支持节省停机模式的 ECS 资源（即，资源会被回收并停止收费）包括： 计算资源（vCPU 和内存）。 如果是异构计算实例，也会回收 GPU、FPGA 或 NPU 资源、固定公网 IP 和固定带宽。 其他 ECS 资源不支持节 省停机模式（即，资源会保留并继续收费，收费项与按量计费一致），包括但不限于： 系统盘 实例上挂载 的数据盘、弹性公网 IP（EIP）和 EIP 带宽、镜像、快照。 https://help.aliyun.com/zh/ecs/product- overview/economical-mode#concept-js1-1fd-5db"},{"id":47,"question":"用户在创建一台 Linux 操作系统的云服务器 ECS 实例的时候，没有分配固定公网 IP，也没有分配弹性公 网 IP，那么连接该实例可以采用的方式是?","options":{"A":"Workbench","B":"VNC","C":"Putty","D":"MSTSC"},"answer":["B"],"explanation":"A、C、D 选项皆为远程连接的方式，需要依靠固定公网 IP 才可以使用。 https://help.aliyun.com/document_detail/71529.html"},{"id":48,"question":"ACL 应设置为（），使所有人都可以对 object 进行读写操作。","options":{"A":"公共读","B":"共有","C":"私有","D":"公共读写"},"answer":["D"],"explanation":"公共读写（public-read-write）：任何人（包括匿名访问者）都可以对该存储空间内文件进行读写 操作。难度：中等。"},{"id":49,"question":"当您遗忘了一台阿里云云服务器 ECS 密码的时候，可以通过重置实例密码的方式重新获取云服务器 ECS 的控制权。重置密码时，要求云服务器 ECS 实例状态为?","options":{"A":"启动中","B":"停止中","C":"运行中","D":"已停止"},"answer":["C","D"],"explanation":"重置密码时候，需要实例必须处于稳定状态，例如已停止或运行中。"},{"id":50,"question":"创建一台 Linux 操作系统的阿里云云服务器 ECS 后，在 Windows 系统的主机中连接该云服务器 ECS ,可以 采用的连接方式是?","options":{"A":"Workbench","B":"VNC","C":"Putty","D":"Rdesktop"},"answer":["A","B","C"],"explanation":"云服务器 ECS 支持通过多种方式连接实例，包括 Workbench、VNC 和第三方客户端工具。rdesktop 是 linux 系统客户端工具。Workbench、VNC、Putty 支持 Windows 系统。 参考链接： https://help.aliyun.com/document_detail/71529.html"},{"id":51,"question":"在创建阿里云实例时，需要创建一个默认安全组。 该安全组的入方向默认放行的协议是?","options":{"A":"ICMP","B":"SSH","C":"HTTP","D":"HTTPS","E":"RDP"},"answer":["A","B","C","D","E"],"explanation":"https://help.aliyun.com/document_detail/25468.html 在您创建 ECS 实例时，如果您还未创建过 安全组，阿里云会为您创建一个默认安全组。默认安全组中的默认规则如下所示： 默认开放 ICMP 协议，用 于 Ping ECS 服务器等操作。 默认入方向开放 SSH 22 端口 和 RDP 3389 端口，用于访问 ECS 实例。 可选 入方向开放 HTTP 80 端口 和 HTTPS 443 端口，如果您使用 ECS 实例进行建站，需要选中 HTTP 80 端口和 HTTPS 443 端口。"},{"id":52,"question":"阿里云 OSS 图片处理服务可以提供哪些功能","options":{"A":"获取图片信息","B":"图片格式转换","C":"图片裁剪","D":"添加水印"},"answer":["A","B","C","D"],"explanation":"阿里云 OSS 图片处理服务提供获取图片信息、图片格式转换、图片裁剪、添加水印等功能。"},{"id":53,"question":"配置阿里云内容分发网络 CDN 时，使用哪些端口号可以添加域名。","options":{"A":"22","B":"80","C":"443","D":"800"},"answer":["B","C"],"explanation":"配置 CDN 时，可以使用 http 或者 https 协议端口"},{"id":54,"question":"购买阿里云云服务器 ECS 时，可以根据购买时长进行选择。阿里云针对云服务器 ECS 提供的时长选择类 型有?","options":{"A":"周","B":"2 周","C":"1 个月","D":"2 个月"},"answer":["A","C","D"],"explanation":"阿里云 ECS 购买时长可以选择 1 周、1 个月、2 个月。"},{"id":55,"question":"云服务器 ECS 中可以通过增加数据盘的方式来增加存储空间。数据盘增加成功后，需要为数据盘创建文 件系统。其中 Linux 系统不能使用的文件系统格式是?","options":{"A":"ext3","B":"ext4","C":"xfs","D":"nfs"},"answer":["D"],"explanation":"ext3、ext4、xfs 选项皆为 ECS 可以支持的文件系统格式。"},{"id":56,"question":"用户在阿里云控制台中启动一台云服务器 ECS ,此云服务器的状态应该是?","options":{"A":"stopping","B":"Stopped","C":"Running","D":"Staring"},"answer":["B"],"explanation":"只有当 ECS 服务器状态处于停止时的状态时，才可以启动 ECS。 https://help.aliyun.com/document_detail/25441.html"},{"id":57,"question":"创建阿里云云服务器 ECS 时 ,可以选择不同的付费方式。云服务器 ECS 的付费方式主要有包年包月和按 量付费。下面场景中不适用于包年包月场景的是?","options":{"A":"办公系统和邮件系统","B":"电商促销活动临时需要大量处理能力","C":"公司对外网站","D":"数据库服务器"},"answer":["B"],"explanation":"电商促销活动临时需要大量处理能力这个业务场景是临时性的，不适合包年包月场景。"},{"id":58,"question":"阿里云云服务器 ECS 采用 Windows 操作系统。如果希望使用 Windows 远程桌面服务连接,管理该云服务器 ECS ,需要在安全组中开放的端口号是?","options":{"A":"22","B":"110","C":"1443","D":"3389"},"answer":["D"],"explanation":"Windows 远程桌面服务使用的端口是 3389，所以选择该选项。"},{"id":59,"question":"阿里云云服务器 ECS 可以对资源进行调整，其中不能调整的资源是?","options":{"A":"实例规格","B":"数据盘","C":"所属 VPC","D":"公网带宽"},"answer":["C"],"explanation":"阿里云 ECS 不能对 VPC 资源进行调整，其他选项皆为 ECS 的配置选项。"},{"id":60,"question":"下列关于 ECS 系统盘的说法中，正确的是?","options":{"A":"可以没有","B":"以后可以增加","C":"只能一个","D":"最多 16 个"},"answer":["C"],"explanation":"ECS 系统盘只能是 1 个，数据盘可以更改数量。"},{"id":61,"question":"阿里云内容分发网络 CDN 可以提高客户端访问互联网服务的速度。 使用云内容分发网络 CDN 时，需要使 用 DNS 服务的记录类型是?","options":{"A":"PTR","B":"CNAME","C":"A","D":"AAAA"},"answer":["B"],"explanation":"配合阿里云 CDN 服务使用的 DNS 解析记录是 CNAME 记录，需要解析域名 CNAME 记录到阿里云 CDN 加速 节点。"},{"id":62,"question":"在阿里云中可针对云服务器 ECS 进行升降配操作。下列关于云服务器 ECS 实例升降配的说法描述正确的 是（）。","options":{"A":"升级 vCPU 和内存后可以直接使用","B":"固定带宽可以变更为按量付费","C":"vCPU 和内存不能单独升级","D":"弹性裸金属服务器也可以进行变配操作"},"answer":["B","C"],"explanation":"升配规格：                    必须指定目标实例规格（包括 vCPU 和内存），不能单独升级其中一个配 置。              必须设置重启时间，重启后新实例规格才能生效。                     升级固定公网带 宽。              将公网带宽计费方式从按使用流量转换为按固定带宽。 降配规格：                        是否支 持实时降配功能根据您的云服务器使用情况而定。                             必须指定目标实例规格（包括 vCPU 和内 存），不能单独降低其中一个配置。                            降低固定公网带宽。       将公网带宽计费方式从 按固定带宽转换为按使用流量。 弹性裸金属服务器不支持变配操作。 参考链接： https://help.aliyun.com/document_detail/25438.html https://help.aliyun.com/document_detail/52574.html"},{"id":63,"question":"当云服务器 ECS 不再被需要时，可以手动释放该云服务器 ECS。释放后，可保留在本地分配给其他云服务 器 ECS 继续使用的阿里云资源有（）。","options":{"A":"EIP","B":"vCPU","C":"内存","D":"数据盘"},"answer":["A","D"],"explanation":"EIP 和数据盘可以单独保留分配给其他 ECS 服务器继续使用，其他资源均会被释放。"},{"id":64,"question":"下列属于阿里云弹性裸金属服务器 EBM 支持的硬盘类型的是（）。","options":{"A":"本地盘","B":"SSD 云盘","C":"高效云盘","D":"ESSD 云盘"},"answer":["B","C","D"],"explanation":"弹性裸金属服务器支持 ESSD 云盘、SSD 云盘和高效云盘，最多可以挂载 16 块数据盘。 https://help.aliyun.com/document_detail/108473.html#section-gu1-xmv-r8f"},{"id":65,"question":"创建阿里云云服务器 ECS 时，可以选择镜像类型有?","options":{"A":"公共镜像","B":"原始镜像","C":"私有镜像","D":"共享镜像","E":"镜像市场"},"answer":["A","D","E"],"explanation":"ECS 镜像根据来源不同，分为公共镜像、自定义镜像、共享镜像和市场镜像。"},{"id":66,"question":"通过升降配置的方式可以来调整阿里云云服务器 ECS 实例，以满足业务变化的需求。下列配置中可以单 独调整的是?","options":{"A":"vCPU","B":"内存","C":"EIP 带宽","D":"数据盘"},"answer":["C","D"],"explanation":"一个实例规格已预定义 vCPU 和内存。修改实例规格时，您需要选择目标实例规格，不能单独修改 vCPU 或内存。 https://help.aliyun.com/document_detail/25437.html"},{"id":67,"question":"下面哪些选项属于云计算提供的服务模式?","options":{"A":"laas","B":"Saas","C":"Paas","D":"Naas"},"answer":["A","B","C"],"explanation":"云计算的三种服务模式：IaaS，PaaS 和 SaaS。难度：中等。"},{"id":68,"question":"用户购买阿里云云服务器 ECS 构建高性能数据库服务器时,建议用户购买的实例规格是?","options":{"A":"通用型","B":"计算型","C":"大数据型","D":"内存型"},"answer":["D"],"explanation":"c：一般表示计算型（computational） g：一般表示通用型（general） r：一般表示内存型（ram） d：一般表示大数据型（big data） 高性能数据库推荐规格族：r 系列 参考链接： https://help.aliyun.com/document_detail/58291.html"},{"id":69,"question":"创建一台 Linux 操作系统的阿里云云服务器 ECS 后，如果要在本地 Windows 系统中连接，默认连接方式 是?","options":{"A":"Workbench","B":"Rdesktop","C":"Mstsc","D":"Remote Desktop"},"answer":["A"],"explanation":"本地 Windows 操作系统连接 Linux 默认连接方式是 workbench。。"},{"id":70,"question":"阿里云公共镜像包含哪些内容？","options":{"A":"操作系统","B":"预装的安全加固软件","C":"客户自己的应用系统","D":"360 软件"},"answer":["A","B"],"explanation":"阿里云公共镜像包含了操作系统和预装的安全加固软件"},{"id":71,"question":"下列关于 TCP 协议和 UDP 协议的区别，描述正确的是（）。","options":{"A":"TCP 是面向连接的协议，UDP 是面向非连接的协议","B":"TCP 需要三次握手建立连接，UDP 不需要三次握手","C":"TCP 是面向非连接的协议，UDP 是面向连接的协议","D":"TCP 不需要三次握手建立连接，UDP 需要 3 次握手"},"answer":["A","B"],"explanation":"TCP 协议和 UDP 协议的区别： 1.TCP 是面向连接的协议，需要三次握手建立连接 2.UDP 是面向非连接 的协议，不需要三次握手建立连接"},{"id":72,"question":"阿里云 ECS 最重要的特点是弹性，若发现某 ECS（window2008）下挂载的磁盘空间不够，可以对已有的磁 盘进行扩容，需要进行哪些操作（正确答案 3 个）","options":{"A":"对磁盘进行“扩容”操作","B":"对 ECS 实例进行“重启”操作","C":"对扩容后的磁盘进行“重新挂载”操作","D":"对扩容后的磁盘进行“扩展卷”操作"},"answer":["A","B","D"],"explanation":"步骤一：扩容云盘容量 步骤二：重启或者启动 ECS 实例 后续操作： 在控制台上扩容云盘容量后， 您还不能直接使用已扩容的容量，需要在 ECS 实例内部继续扩容云盘的分区和文件系统。 参考文档： https://help.aliyun.com/document_detail/113316.html"},{"id":73,"question":"小明听说在阿里云官网创建一台 ECS 实例十分方便，想尝试购买一台 ECS 用于个人博客网站的服务器， 他开通 ECS 必须的步骤不包括以下哪一项","options":{"A":"注册 aliyun.com 账号","B":"实名认证","C":"至少充值 100 元","D":"指定操作系统镜像"},"answer":["D"],"explanation":"解析：创建 ECS 实例的过程中按量付费时，账户余额不得小于 100 元。参考链接： https://help.aliyun.com/document_detail/87190.htm?…"},{"id":74,"question":"阿里云云服务器 ECS 为用户保证服务可用性不低于 99.95%，数据可靠性不低于 99.9999999%，以下哪个 选项不能体现 ECS 高可用及高可靠？","options":{"A":"数据三副本存储","B":"支持大多数主流操作系统镜像","C":"宕机自动迁移","D":"防 DDoS 攻击"},"answer":["B"],"explanation":"支持大多数主流操作系统镜像与 ECS 高可用及高可靠无关"},{"id":75,"question":"下列必须要在控制台重启 ECS 实例才能生效的有哪些操作？","options":{"A":"磁盘扩容","B":"修改安全组规则","C":"使用快照回滚恢复数据盘的数据","D":"修改 ECS 的登录密码"},"answer":["A","C"],"explanation":"在线扩容云盘，扩容后无需重启 ECS。 离线扩容云盘：扩容后必须在 ECS 控制台或者调用 API 重启 ECS 实例。 参考文档：https://help.aliyun.com/document_detail/113316.html 修改安全组无需重启 ECS。 通过云助手修改实例密码后，无需重启实例即可生效。 https://help.aliyun.com/document_detail/288238.html"},{"id":76,"question":"阿里云云服务器 ECS 与传统的机房服务器托管相比，具有更好的易用性，ECS 支持的在线操作不包括？","options":{"A":"升级配置","B":"扩大磁盘容量","C":"修改密码","D":"更改可用区"},"answer":["D"],"explanation":"解析：实例创建完成后不支持更改地域和可用区"},{"id":77,"question":"快照是阿里云 ECS 中集成的一项功能，降低了运维难度，提高了用户管理 ECS 的效率。下列哪一项无法 通过 ECS 的快照功能完成？","options":{"A":"使用数据盘快照创建新的数据盘","B":"使用系统盘快照创建新的 ECS 实例","C":"使用磁盘快照备份磁盘中的数据","D":"使用磁盘快照恢复磁盘中的数据"},"answer":["B"],"explanation":"使用 ECS 快照功能无法创建新的 ECS 实例。"},{"id":78,"question":"在阿里云上，有很多服务或功能为云服务器 ECS 提供安全保障，下列哪项服务/产品的目的不是为了防止 阿里云 ECS 被恶意访问？","options":{"A":"VPC","B":"安全组","C":"DDoS 基础防护","D":"快照"},"answer":["D"],"explanation":"快照的作用是用于 ECS 的灾难恢复，不是用于防止阿里云 ECS 被恶意访问"},{"id":79,"question":"使用阿里云云监控可以实时监控阿里云 ECS 的运行情况，其可以监控的指标不包括哪一项？","options":{"A":"CPU 使用率","B":"异地登录","C":"内存使用率","D":"系统磁盘读 IOPS"},"answer":["B"],"explanation":"解析：云监控对 ECS 的监控主要是基础监控项和操作系统级监控，如 CPU 空闲百分比、网卡流量等参 考链接：https://help.aliyun.com/document_detail/28619.html"},{"id":80,"question":"磁盘“快照”是云服务器 ECS 下的一个重要概念，它是磁盘数据在某一个时间点的拷贝，以下关于 ECS 快照的说法错误的有哪些？","options":{"A":"快照最常见的用途是备份数据，当应用程序或人为误删除一些数据时，可以通过快照找回","B":"ECS 支持在任意时刻手工制作磁盘的快照","C":"只有数据盘支持制作快照，系统盘不支持","D":"ECS 支持自动快照，自动快照策略是系统默认的，不支持修改，如有定制快照的需要，可以使用 手工快照的方式实现"},"answer":["C","D"],"explanation":"阿里云快照服务是一种无代理（Agentless）的数据备份方式，可以为所有类型的云盘创建崩溃一致 性快照，用于备份或者恢复整个云盘。它是一种便捷高效的数据容灾手段，常用于数据备份、制作镜像、应 用容灾等。 支持以下创建快照方式： 手动快照：由您手动创建，作为重大操作的准备工作，提高操作容错率。支持创建单个云盘快照或者快照一 致性组（一台或多台 ECS 实例上多个云盘的快照）。 自动快照：将自动快照策略应用到云盘上，在您设置的时间点自动为云盘创建的快照。通过自动备份云盘数 据，提高业务数据安全性。 参考文档：https://help.aliyun.com/document_detail/25391.html"},{"id":81,"question":"现在越来越多的企业及个人选择云服务器代替传统硬件服务器，一个重要的原因是可以极大地节约 IT 成 本，关于使用阿里云 ECS 可以节约成本的原因，正确的是？（）(正确 3 个)","options":{"A":"整个云平台的资源是虚拟的，在业务高峰时，可以共享其它用户的资源","B":"完全不需要机房托管费用和硬件运维费用","C":"按需使用，按量付费，无资源浪费","D":"因为使用了云计算技术，同样配置的情况下，云服务器比传统服务器的性能更好"},"answer":["A","C","D"],"explanation":"云服务器是同等配置独立服务器计算能力的 4 倍，可满足高性能计算的要求。 阿里云 ECS 支持包年 包月、按量付费、按量付费+预留实例券、抢占式实例、按量付费+节省计划计费方式。通过按量付费，您可 以按需开通和释放资源，无需提前购买大量资源，成本比传统主机降低 30%~80%。 阿里云服务器 ECS 共享型 实例在资源利用上更多强调资源性能的共享，所以无法保证实例计算性能的稳定，但是成本相对来说也更低。 共享型的不同实例 vCPU 会争抢物理 CPU 资源，并导致高负载时计算性能波动不稳定，有可用性 SLA 保证， 但无性能 SLA 保证。"},{"id":82,"question":"阿里云 ECS 有两种计费方式，通过合理选择计费方式，用户可以最大限度地节约成本，以下说法正确的 是?（） (正确 3 个)","options":{"A":"阿里云 ECS 的两种计费方式分别是“包年包月”和”按量付费”","B":"“包年包月“类型又叫做“预付费“类型，用户在创建 ECS 时首先支付费用，阿里云将保证为用 户预留资源","C":"“按量付费”类型又叫做“后付费”类型，系统按小时结算前 1 小时的使用费用，使用后付费类 型，需要保证用户中有 100 元或以上余额","D":"相对于“后付费”的实例，“包年包月“类型每小时的单价更加使宜，只要预算足够，用户应尽 量选择包年包月类型"},"answer":["A","B","C"],"explanation":"后付费和“包年包月”的单价是一样的 https://help.aliyun.com/document_detail/40653.htm"},{"id":83,"question":"使用阿里云云监控可以实时监控阿里云 ECS 的运行情况，其优势不包括哪一项?（）","options":{"A":"免费","B":"易用","C":"支持多种报警方式","D":"防 DDoS 攻击"},"answer":["D"],"explanation":"解析：防 DDos 攻击是安全中心的功能，不是云监控的功能 参考链接： https://help.aliyun.com/document_detail/28580.html"},{"id":84,"question":"阿里云 ECS 最重要的特点是弹性，若发现磁盘空间不够，需要扩大存储，可以新增一块磁盘，关于新增 磁盘的注意事项表述错误的是?（）","options":{"A":"新增的磁盘必须与 ECS 在同一可用区","B":"新增的磁盘必须进行挂载后才能使用","C":"挂载新磁盘后需要重启实例才能生效","D":"新增磁盘的容量必须不小于原磁盘的容量"},"answer":["D"],"explanation":"参考； https://help.aliyun.com/document_detail/35095.html"},{"id":85,"question":"阿里云官网创建一台 ECS 实例非常方便，在创建 ECS 时，需要选择合适的配置，下列说法中错误的是？ （）","options":{"A":"用户应该根据自己业务的具体情况，自行选择合适的配置","B":"阿里云为不知道如何选择合适配置的用户提供了默认推荐配置","C":"阿里云 ECS 最重要的特点是弹性，云平台会根据用户 ECS 的 CPU 负载情况，自动升级 ECS 的配置","D":"阿里云 ECS 最重要的特点是弹性，若要升级 ECS 的配置，需要在控制台进行手工升级"},"answer":["C"],"explanation":"云平台不会根据用户 ECS 的 CPU 负载情况，自动升级 ECS 的配置"},{"id":86,"question":"在阿里云官网创建一台 ECS 实例非常方便，              在创建 ECS 时，要指定实例所在的“地域”及“可用区“， 下列关于地域与可用区的描述错误的是（）。","options":{"A":"阿里云 ECS 支持多地域，一个地域下面一般包含多个可用区","B":"不同地域的 ECS 的价格可能不同","C":"不同地域的 ECS 为用户提供的服务标准不同，(注: 服务标准包括服务可用性，数据可靠性、售 后支持的时间段等等)","D":"用户可以根据自己客户的分布情况，就近选择地域"},"answer":["C"],"explanation":"不同地域的 ECS 为用户提供的服务标准都是相同的。 用户和资源部署地域的距离越近，网络时延越 低，访问速度越快。 根据您的预算选择合适的地域。 不同地域的资源价格可能有差异。 一个地域通常由 多个可用区组成。只有同一地域内的不同可用区之间内网互通，且使用低时延链路相连。不同地域之间的可 用区完全隔离。 https://help.aliyun.com/document_detail/188196.html?spm=a2c4g.25430.0.0.65901017hRUN2W"},{"id":87,"question":"使用阿里云云服务器 ECS，可以极大地减少服务器运维成本。下列选项中，阿里云不负责保障运维，需用 户自己关注的（）。","options":{"A":"ECS 的 CPU 负载过高","B":"机房停电","C":"服务器宕机","D":"机房断网"},"answer":["A"],"explanation":"使用阿里云 ECS，用户不需要关心机房以及服务器硬件，网络设备相关的事情，只需要关注 ECS 本身 即可，所以需要关心的是 ECS 的 CPU 负载过高"},{"id":88,"question":"阿里云 ECS 最重要的特点是弹性，若发现磁盘空间不够，需要扩大存储，无法通过下列那种方法实现?（）","options":{"A":"增加系统盘个数","B":"增加数据盘个数","C":"扩大已有的数据盘的容量","D":"扩大已有的系统盘的容量"},"answer":["A"],"explanation":"不可以多个系统盘，这不是说一个虚拟机的空间够不够装的问题，还是虚拟化协议和主机协议是底层 决定。如果在创建 ECS 实例时磁盘容量不足或者选择了错误的操作系统，或者需要使用其他操作系统，您能 通过更换系统盘来更换操作系统。"},{"id":89,"question":"使用控制台可以便捷地管理 ECS 实例，下列哪项操作无法在阿里云控制台完成?（）","options":{"A":"查看云磁盘中的数据","B":"查看阿里云 ECS 挂载的磁盘列表","C":"管理用户拥有的所有 ECS 实例","D":"修改 ECS 的登录密码"},"answer":["A"],"explanation":"无法在阿里云控制台查看云磁盘中的数据"},{"id":90,"question":"阿里云云服务器 ECS 最重要的特点是弹性。传统的硬件服务器若要升级配置，必须重新采购硬件，而云 服务器支持在线升级配置，几分钟就可以生效，下列关于升级配置的说法错误的是？（）","options":{"A":"支持随时升级 CPU,需重启 ECS 实例生效","B":"支持随时升级带宽，需重启 ECS 实例生效","C":"支持随时升级内存，需重启 ECS 实例生效","D":"支持随时升级磁盘容量，需重启 ECS 实例生效"},"answer":["B"],"explanation":"阿里云 ECS 支持随时升级带宽，并且不需要重启 ECS"},{"id":91,"question":"提交 ICP 备案时，以下哪些信息必须填写的","options":{"A":"个人名下已有网站数量","B":"网站所有者(主体)的名称和证件号、联系电话","C":"网站负责人的名称和证件号、联系电话","D":"网站对应的全部域名","E":"ECS 的管理密码"},"answer":["B","C","D"],"explanation":"解析：备案时是备案某一个域名，不会写已有网站数量 参考链接： https://help.aliyun.com/document_detail/147846.html"},{"id":92,"question":"下列选项中，关于注册域名时必须要提供的信息有哪些?","options":{"A":"域名","B":"注册年限","C":"域名所有人信息","D":"域名的用途","E":"域名所指向的服务器 IP"},"answer":["A","B","C"],"explanation":"注册域名时必须要提供的信息有域名,注册年限和域名所有人信息"},{"id":93,"question":"阿里云云服务器 ECS 的用户可以免费申请到”备案服务号”，用以提交 ICP 备案登记，备案服务号的申 请方法是什么?","options":{"A":"在线自主申请","B":"免费邮寄","C":"购买完 ECS 后自动发送到用户邮箱","D":"提交工单获取"},"answer":["A"],"explanation":"备案服务号的申请方式是在线自主申请。"},{"id":94,"question":"XIN 域名注册完成后，需要进行什么操作才能获得域名解析资格?","options":{"A":"实名认证","B":"进行公安备案","C":"转移到阿里云","D":"续费 1 年"},"answer":["A"],"explanation":"新域名注册完成后，需要实名认证后才能获得域名解析资格"},{"id":95,"question":"使用 SFTP 协议上传网站内容至云服务器 ECS，在安全性方面的好处是（）。","options":{"A":"加密的传输通道，防窃听","B":"数据传输前自动加密，防盗用","C":"无需设置复杂密码，易管理","D":"有自动审计功能，可跟踪"},"answer":["A"],"explanation":"SFTP 协议使用加密的传输通道，可以防窃听"},{"id":96,"question":"用户 D 在云服务器 ECS 建立了自己的网站，由于访问量增长较大，半年后 ECS 的 CPU 占用率特别高，他 希望将 1 核 1G 的 ECS 换成“2 核 4G”，用户 D 可采用什么方法最快地完成升级?","options":{"A":"在线变更原有 ECS 配置","B":"新购买一台 2 核 4G 的 ECS","C":"单独购买 1 核 CPU2 核内存，进行资源挂载","D":"提交工单，让工程师完成免费升级"},"answer":["A","B"],"explanation":"“新购买一台 2 核 4G 的 ECS”：可以通过镜像迁移到新买服务器上，无需进行环境部署就可以快速上 线。注：需要修改域名解析的 ip 地址“提交工单，让工程师完成免费升级”：没有提交后台升级工单操作"},{"id":97,"question":"用户通过域名访问目标网站(如：http://www.aliyun.com)时，一定会使用到的四个元素是：域名、IP 地 址、服务器和浏览器，IP 地址的主要作用是","options":{"A":"在网络上定位到服务器","B":"保存网站的内容","C":"方便网名记忆","D":"在网络上定位到域名"},"answer":["A"],"explanation":"IP 地址的主要作用是在网络上定位到服务器"},{"id":98,"question":"使用 FileZilla 远程加密连接云服务器 ECS 时，需要用到什么?","options":{"A":"ECS 的公网 IP","B":"ECS 的用户名","C":"SSH 协议","D":"ECS 用户的密码","E":"SFTP 协议","F":"ECS 上的私网 IP"},"answer":["A","B","D","E"],"explanation":"需要 ECS 的公网 IP、ECS 的用户名、ECS 用户的密码、协议为 SFTP 协议"},{"id":99,"question":"云服务器 ECS 的用户在进行 ICP 备案前，需要先获得什么（）","options":{"A":"按量付费的 ECS","B":"ECS 的管理员权限","C":"备案服务号","D":"阿里云批准"},"answer":["C"],"explanation":"云服务器 ECS 的用户在进行 ICP 备案前，需要先获得备案服务号"},{"id":100,"question":"使用阿里云的备案平台提交 ICP 备案时，一次可以提交几个网站?（）","options":{"A":"1 个","B":"多个","C":"最多 3 个","D":"最多 5 个"},"answer":["D"],"explanation":"使用阿里云的备案平台提交 ICP 备案时，一次最多提交 5 个网站"},{"id":101,"question":"使用远程终端管理阿里云的 Linux 云服务器 ECS 时，可以使用什么协议？（）","options":{"A":"HTTPS","B":"SSH","C":"HTTP","D":"SMTP"},"answer":["B"],"explanation":"SSH 是较可靠，专为远程登录会话和其他网络服务提供安全性的协议。使用远程终端登录 linux 主机， 可以使用 SSH 协议。 HTTPS,HTTP 和 SMTP 协议均不能用来远程终端登录 linux 主机"},{"id":102,"question":"域名解析系统中设置的“A 记录”，主要功能是什么?（）","options":{"A":"让域名更好记忆","B":"符合工信部的监管要求","C":"指定域名所对应的 IP 地址","D":"提高网站的安全性"},"answer":["C"],"explanation":"A 记录的主要功能是指定域名所对应的 IP 地址"},{"id":103,"question":"用户 E 准备建两个网站，分别指向 www.abc com 和 mail.123.abc.com，此时用户需要注册（）域名。","options":{"A":"www.abc.com","B":"abc.com","C":"www.abc.com 和 123.abc.com","D":"abc.com 和 123.abc.com"},"answer":["B"],"explanation":"域名只能注册 abc.com 这种类型的，并且可以支持*.abc.com 的网站"},{"id":104,"question":"假设用户 A 期望建一个自己的网站，能通过 http://www.abc.def.xin 访问到，那么用户需要提前注册 什么域名？（）","options":{"A":"def.xin","B":"abc.def.xin","C":"www.abc.det.xin","D":"xin"},"answer":["A"],"explanation":"www.abc.def.xin 对应的二级域名是 def.xin，想要能够使用 www.abc.def.xin，需要注册对应的二级 域名，三级域名和四级域名都是作为二级域名的附属物 ，不需要注册。"},{"id":105,"question":"对个人用户(中国公民)，完成域名实名认证必须提供什么?（）","options":{"A":"支付宝帐号","B":"身份证照片","C":"户口本照片","D":"信用卡号码"},"answer":["B"],"explanation":"对个人用户(中国公民)，完成域名实名认证必须提供身份证"},{"id":106,"question":"将本地数据库迁移到 RDS 的限制不包括以下哪种?","options":{"A":"不支持增量迁移","B":"迁移过程中，不支持 DDL 操作","C":"结构迁移不支持 event 的迁移","D":"如果使用了对象名映射功能后，依赖这个对象的其他对象可能迁移失败"},"answer":["A"],"explanation":"解析："},{"id":107,"question":"数据传输服务的传输粒度可细化到哪种级别?","options":{"A":"表","B":"记录","C":"库","D":"实例"},"answer":["A"],"explanation":"解析：数据传输服务的传输粒度最小可细化到表"},{"id":108,"question":"云数据库 RDS 中支持内外网地址同时连接的模式是（）。","options":{"A":"低性能模式","B":"标准模式","C":"高安全模式","D":"长连接模式"},"answer":["C"],"explanation":"云数据库 RDS 的高安全模式支持内外网地址同时连接"},{"id":109,"question":"数据传输服务 DTS 能快速的将本地数据库或者 RDS 中的实例迁移到另一个 RDS 实例中，它的迁移模式 不包括哪种?","options":{"A":"结构迁移","B":"全量数据迁移","C":"过滤数据迁移","D":"增量数据迁移"},"answer":["C"],"explanation":"https://help.aliyun.com/document_detail/126875.htm…"},{"id":110,"question":"与传统迁移工具比较，数据传输服务 DTS 有以下哪些特点？","options":{"A":"传输粒度更细","B":"是单机版本","C":"功能丰富","D":"有 SLA 保障","E":"配置步骤复杂"},"answer":["A","C","D"],"explanation":"数据传输服务 DTS 与传统迁移工具比较，有以下优点：传输粒度更细，支持分布式部署，有 SLA 保障， 功能丰富和配置步骤简单。"},{"id":111,"question":"云数据库 RDS 的规格类型包括哪些？","options":{"A":"双实例","B":"通用型","C":"独享套餐","D":"独占物理机","E":"三节点"},"answer":["B","C","D"],"explanation":"RDS 的实例规格族，包括共享规格、通用规格、独享规格。独享规格的顶配是独占物理机，完全独占 一台物理机的所有资源。 https://help.aliyun.com/document_detail/57184.html"},{"id":112,"question":"使用数据传输服务 DTS 将数据迁移到云数据库，在配置迁移任务之前，需要具备哪些前提条件？","options":{"A":"创建 RDS 数据库","B":"文件导入任务配置","C":"完成迁移链路配置","D":"创建迁移账号"},"answer":["A","D"],"explanation":"链接：https://help.aliyun.com/document_detail/126875.html"},{"id":113,"question":"在云数据库实例中创建账号之后，需要授权操作，可以授予的权限包括哪些？","options":{"A":"私有","B":"读写","C":"只读","D":"公共读写"},"answer":["B","C"],"explanation":"在已授权数据库中，可以将权限设置为读写（DDL+DML）、只读、仅 DDL 或仅 DML。 https://help.aliyun.com/document_detail/183354.html"},{"id":114,"question":"云数据库 RDS 多可用区实例可以承受更高级别的灾难，这个级别指的是哪一种？","options":{"A":"同城容灾","B":"异地容灾","C":"单可用区容灾","D":"多实例容灾"},"answer":["A"],"explanation":"同一地区，多可用区实例部署，相当于就是同城容灾。"},{"id":115,"question":"决定云数据库性能的关键因素是（）。","options":{"A":"CPU","B":"内存","C":"磁盘","D":"连接数"},"answer":["B"],"explanation":"内存是决定云数据库性能的关键因素。"},{"id":116,"question":"在数据库迁移中，哪种是指进行结构对象定义语法的迁移、包括表、视图、触发器、存储过程，存储函 数，同义词等结构对象的语法迁移？","options":{"A":"结构迁移","B":"全量数据迁移","C":"过滤数据迁移","D":"增量数据迁移"},"answer":["A"],"explanation":"DTS 将迁移对象的结构定义迁移到目标实例，目前 DTS 支持结构迁移的对象为表、视图、触发器、存 储过程和存储函数。"},{"id":117,"question":"数据传输服务 DTS 能提供的功能有哪些？","options":{"A":"数据迁移","B":"DDL 操作","C":"数据同步","D":"数据修改","E":"数据订阅"},"answer":["A","C","E"],"explanation":"https://help.aliyun.com/document_detail/26592.html"},{"id":118,"question":"某电商网站的 RDS 云数据库位于华东 1 地域的可用区 A 的经典网络，而其应用位于华东 1 地域的可用区 B 的经典网络的 ECS 上，那么该应用应该采用哪种来连接 RDS?（）","options":{"A":"VPN","B":"单独使用内网地址","C":"单独使用外网地址","D":"同时使用内外网地址"},"answer":["B"],"explanation":"同一个地域的不同可用区，可以内网互通，为了安全起见，ECS 服务器应该单独使用内网地址去连接 RDS"},{"id":119,"question":"以下哪种复制方式指：应用发起更新(含增加、删除、修改操作)请求，Master 完成相应操作后立即响应 应用，Master 向 Slave 异步复制数据。因此异步复制方式下，Slave 不可用不影响主库上的操作，而 Master 不可用有较小概率会引起数据不一致。（）","options":{"A":"异步","B":"半同步","C":"强用步","D":"半异步"},"answer":["A"],"explanation":"RDS 数据复制方式有以下三种方式： 异步复制（Async）：应用发起更新（含增加、删除、修改操 作）请求，Master 完成相应操作后立即 响应应用，Master 向 Slave 异步复制数据。因此异步复制方式 下， Slave 不可用不影响主库上的操 作，而 Master 不可用有较小概率会引起数据不一致。 强同步复制 （Sync）：应用发起更新（含增加、删除、修改操作）请求，Master 完成操作后向 Slave 复制数据， Slave 接收到数据后向 Master 返回成功信息，Master 接到 Slave 的反馈后再响应 应用。Master 向 Slave 复制数据是同步进行的，因此 Slave 不可用会影响 Master 上的操作，而 Master 不可用不会引起 数据不一致。 半同步复制（Semi-Sync）：正常情况下数据复制方式采用强同步复制方式，当 Master 向 Slave 复 制数据出现异常的时候（Slave 不可用或者双节点间的网络异常），Master 会暂停对应用的响 应，直 到复制方式超时退化成异步复制。如果允许应用在此时更新数据，则 Master 不可用会引起数据不 一 致。当双节点间的数据复制恢复正常（Slave 恢复或者网络恢复），异步复制会恢复成强同步复制。 恢 复成强同步复制的时间取决于半同步复制的实现方式，阿里云数据库 MySQL5.5 版和 MySQL5.6 版有所不同。 所以正确答案是 A"},{"id":120,"question":"阿里云云数据库 RDS 实例不支持以下哪些引擎?","options":{"A":"InnoDB","B":"TokuDB","C":"MyISAM","D":"ARCHIVE"},"answer":["C"],"explanation":"解析：不支持 MyISAM 引擎。由于 MyISAM 引擎的自身缺陷，存在数据丢失的风险，实例的 MyISAM 引 擎表会自动转换为 InnoDB 引擎表。"},{"id":121,"question":"配置迁移任务时,         我们需要检测数据传输服务器是否能够连通要迁移的云数据库，   这会在哪个步骤 中完成?（）","options":{"A":"访问控制","B":"预检查","C":"实时同步","D":"配置引擎"},"answer":["B"],"explanation":"预检查负责检测数据传输服务器是否能够连通要迁移的云数据库"},{"id":122,"question":"如果需要进行数据迁移，必须在数据传输服务控制台创建（），配置迁移的源跟目标实例连接方式，迁 移对象及迁移类型等信息。用户可以在数据传输服务控制台进行迁移任务的创建、管理、停止及删除等操作。","options":{"A":"迁移任务","B":"预检查","C":"配置引擎","D":"访问控制"},"answer":["A"],"explanation":"如果需要进行数据迁移，必须在数据传输服务控制台创建迁移任务配置迁移的源跟目标实例连接方式， 迁移对象及迁移类型等信息。"},{"id":123,"question":"为了解决地区故障导致的服务不可用，提高服务可用性，可以在构建异地灾备中心。当业务中心发生地 区故障时，直接将业务流量切换到灾备中心，立刻恢复服务。灾备中心同业务中心的数据库通过哪种服务进 行数据实时同步，当业务中心故障时，可以保证数据灾备的数据完整性?（）","options":{"A":"数据传输","B":"数据管理","C":"数据迁移","D":"数据库"},"answer":["A"],"explanation":"解析： 异地容灾，支持创建异地灾备实例，通过数据传输实现异地数据实时同步"},{"id":124,"question":"为了数据库的安全稳定，在开始使用 RDS 实例前，您需要将访问数据库的 IP 地址或者 IP 段加到目标实 例的白名单中。IP 地址哪种代表禁止所有 IP 地址或 IP 段访问该 RDS 实例?（）","options":{"A":"127.0.0.1","B":"0.0.0.0/0","C":"2.168.0.1","D":"127.0.0.0"},"answer":["A"],"explanation":"解析： 白名单 IP 地址设置为 127.0.0.1，表示禁止所有地址访问。 https://help.aliyun.com/zh/rds/apsaradb-rds-for-mysql/whitelist- template?spm=a2c4g.11186623.0.0.452c3b52TNQ3ko"},{"id":125,"question":"云数据库 RDS 的哪种模式会小幅度增加连接闪断的概率，失去 SQL 拦截能力?（）","options":{"A":"低性能模式","B":"标准模式","C":"高安全模式","D":"长连接模式"},"answer":["B"],"explanation":"标准模式和数据库代理模式（原高安全模式）两种访问模式的区别： 标准模式：RDS 使用负载均衡屏 蔽了数据库引擎 HA 切换对应用层的影响，缩短响应时间，但会小幅度增加连接闪断的概率，失去 SQL 拦截 能力。 数据库代理模式（原高安全模式）：具有防止 90%的连接闪断和 SQL 拦截的能力（基于 SQL 语义分析 来实现防御 SQL 注入攻击），但是会增加 20%以上响应时间。"},{"id":126,"question":"为了使云数据库 RDS 实例免受 DDoS 攻击的风险，建议用户通过哪种方式访问 RDS 实例?（）","options":{"A":"内网","B":"外网","C":"高安全模式","D":"标准模式"},"answer":["C"],"explanation":"高安全模式可以使云数据库 RDS 实例免受 DDoS 攻击的风险。"},{"id":127,"question":"对于阿里云上的网络安全防护，用户可以通过不同的手段来实现，其中可以免费在云上获取的防护手段 有（）。","options":{"A":"ECS 安全组","B":"WAF 应用防火墙","C":"基础 ddos 防护","D":"ddos 高防 IP","E":"专用网络 VPC"},"answer":["A","C","E"],"explanation":"ECS 安全组，基础 DDOS 防护和专用网络 VPC 是阿里云提供的免费服务。 WAF 和 DDOS 高防 IP 是收费 服务。"},{"id":128,"question":"对于云上的安全攻击，阿里云以安全监测报告的形式列出最常见的安全攻击手段，以下哪些是在阿里云 的安全监测报告中列出来的攻击方式（）","options":{"A":"ddos 攻击","B":"口令暴力攻击","C":"web 应用攻击","D":"木马后门入侵"},"answer":["A","B","C"],"explanation":"解析：DDos、口令暴力破解、web 应用攻击、会以安全监测报告的形式出来"},{"id":129,"question":"以下哪些攻击属于 ddos 攻击的方式。","options":{"A":"ACK Flood","B":"SYN Flood","C":"DNS Response Flood","D":"web shell","E":"SQL 注入"},"answer":["A","B","C"],"explanation":"畸形报文：畸形报文主要包括 Frag Flood、Smurf、Stream Flood、Land Flood、IP 畸形报文、TCP 畸形报文、UDP 畸形报文等。 传输层 DDoS 攻击：传输层 DDoS 攻击主要包括 Syn Flood、Ack Flood、UDP Flood、ICMP Flood、RstFlood 等。 DNS DDoS 攻击：DNS DDoS 攻击主要包括 DNS Request Flood、DNS Response Flood、虚假源+真实源 DNS Query Flood、权威服务器攻击和 Local 服务器攻击等。 连接型 DDoS 攻击：连接型 DDoS 攻击主要是指 TCP 慢速连接攻击、连接耗尽攻击、Loic、Hoic、Slowloris、 Pyloris、 Xoic 等慢速攻击。 Web 应用层 DDoS 攻击：Web 应用层攻击主要是指 HTTP Get Flood、HTTP Post Flood、 CC 等攻击。 解析：https://help.aliyun.com/document_detail/28401.html"},{"id":130,"question":"关于云上的安全服务方式，以下描述正确的是哪种（）","options":{"A":"用户使用云服务之后，所有的安全都是由云服务厂商负责的","B":"使用云服务之后，云上的安全责任是用户和云服务厂商分担的，分别负责不同层次的安全","C":"使用云服务之后，用户还是需要关心物理和环境安全的","D":"使用云服务之后，用户只需要关注自己的应用和数据安全就可以了，其他的由云服务厂商负责"},"answer":["B"],"explanation":"使用云服务之后，云上的安全责任是用户和云服务厂商分担的，分别负责不同层次的安全。客户负责 自己部署的操作系统、运行环境和应用安全。云服务商负责虚拟机监视器（Hypervisor）及底层资源的安全。"},{"id":131,"question":"为了让网站能够防护最常见的 web 服务器插件漏洞和 XSS 跨站脚本等攻击，在阿里云上可以选择哪种安 全服务来实现（）","options":{"A":"DDOS 高防 IP","B":"云盾证书","C":"Web 应用防火墙","D":"云安全中心（安骑士）"},"answer":["C"],"explanation":"Web 应用防火墙（Web Application Firewall，简称 WAF）可以有效识别 Web 业务流量的恶意特征， 在对流量清洗和过滤后，将正常、安全的流量返回给服务器，避免网站服务器被恶意入侵导致性能异常等问 题，从而保障网站的业务安全和数据安全。"},{"id":132,"question":"在阿里云上，哪个产品可以满足客户用户身份管理的需求，如子帐号创建、修改、授权等?（）","options":{"A":"安全组","B":"DDoS 高防","C":"访问控制 RAM","D":"态势感知"},"answer":["C"],"explanation":"访问控制 RAM 可以满足客户用户身份管理的需求，如子帐号创建、修改、授权"},{"id":133,"question":"为了提高云资源的管理效率，阿里云提供了多种提醒和自动化功能的方式，尽可能降低因忘记续费而导 致的云实例和数据丢失风险。以下关于提醒服务的介绍中，描述不正确的是（）。","options":{"A":"云资源服务到期前以短信提醒用户服务即将到期","B":"云资源服务到期前以邮件提醒用户服务即将到期","C":"云资源服务到期前都会有业务人员上门指导用户续费","D":"用户可提前设置自动续费功能，减少人工参与"},"answer":["C"],"explanation":"云资源服务到期前不会有业务人员上门指导用户续费，而是以短信和邮件的方式提醒用户服务即将到 期"},{"id":134,"question":"以下阿里云的云上安全服务，哪个是用于网络安全防护的?（）","options":{"A":"安骑士","B":"DDoS 高防 IP","C":"Web 应用防火墙","D":"态势感知"},"answer":["B"],"explanation":"解析： 安骑士防护服务器       ，ddos 防护网络安全"},{"id":135,"question":"关于阿里云的数据安全防护，以下（）可以满足数据备份和容灾的要求。","options":{"A":"云盾证书","B":"云数据库加密存储","C":"云服务器快照","D":"HTTPDNS"},"answer":["C"],"explanation":"云盾证书的作用是为网站和移动应用（APP）提供 HTTPS 保护，对网站流量进行加密，防止数据被窃 取 云数据库加密存储是对云数据库存储进行加密，防止数据库泄露 云服务器快照是一种无代理 （Agentless）的数据备份方式，可以为所有类型的云盘创建崩溃一致性快照，用于备份或者恢复整个云盘， 常用于数据备份、制作镜像、应用容灾等。 HttpDNS 是使用 HTTP 协议进行 DNS 解析请求，防止被 DNS 劫 持。"},{"id":136,"question":"OSS 提供 Bucket 级别的权限控制，Bucket 有哪几种权限可以设置？","options":{"A":"公有读","B":"私有读","C":"公有读写","D":"私有"},"answer":["A","C","D"],"explanation":"阿里云 OSS 提供 Bucket 级别的权限访问控制，Bucket 目前有三种访问权限：公有读，公有读写和私 有"},{"id":137,"question":"硬盘的发展经历机械硬盘到 SSD 固态硬盘，SSD 硬盘相比机械硬盘有哪些优点？","options":{"A":"数据存储速度快","B":"绿色环保","C":"重量轻便","D":"不会产生故障"},"answer":["A","B","C"],"explanation":"SSD 硬盘相比机械硬盘的优点有数据存储速度快，绿色环保和重量轻便"},{"id":138,"question":"阿里云上提供了满足用户不同需求的云存储服务，以下哪些是常见的云存储服务？","options":{"A":"表格存储","B":"归档存储","C":"云服务器","D":"块存储","E":"云负载均衡"},"answer":["A","B","D"],"explanation":"表格存储，归档存储，块存储，对象存储和文件存储是常见的云存储服务"},{"id":139,"question":"据统计，存储系统的硬件故障 90%以上是为了解决硬盘故障的问题，通过多块硬盘，以某种方式形成一 定的数据冗余来保证数据的安全，该种方式是以下哪种技术（）","options":{"A":"RAID","B":"SSD","C":"OSS","D":"SAN"},"answer":["A"],"explanation":"RAID 技术将多个单独的物理硬盘以不同的方式组合成一个逻辑硬盘,提高了硬盘的读写性和数据安全 性,根据不同的组合方式分为不同的 RAID 级别。"},{"id":140,"question":"以下哪个工具不是用来管理 OSS 的客户端工具?（）","options":{"A":"ossutil","B":"ossfs","C":"wordpress","D":"ossftp"},"answer":["C"],"explanation":"wordpress 不是用来管理 OSS 的客户端工具"},{"id":141,"question":"访问控制 RAM 是一个稳定可靠的集中式访问控制服务，以下说法错误的是?","options":{"A":"主子账号单独付费，主账号可以监督子账号的费用情况","B":"主账号可以分配子账号具有哪些权限","C":"可以设置管理 OSS 权限和只读 OSS 权限","D":"子账号可以分配给企业成员或合作伙伴"},"answer":["A"],"explanation":"费用用主账号支付，主账号可以监督子账号的费用情况 https://help.aliyun.com/document_detail/28627.html"},{"id":142,"question":"对象存储服务 OSS 提供静态网站托管功能，在 OSS 中可以进行哪些设置?（）","options":{"A":"静态内容格式","B":"异常页面","C":"http header 信息","D":"首页和 404 页面"},"answer":["D"],"explanation":"在 OSS 中可以进行首页和 404 页面的设置。"},{"id":143,"question":"对象存储服务 OSS 提供图片处理的功能，使用该功能需要在 URL 上增加（）信息。","options":{"A":"分隔符和样式名称","B":"SSL 加密范式","C":"图片的大小","D":"图片的来源"},"answer":["A"],"explanation":"解析： 需要加上分隔符和样式名称"},{"id":144,"question":"对象存储服务不适用以下哪个应用场景?（）","options":{"A":"存储网站静态文件","B":"存储高清视频文件","C":"对订单数据进行大数据分析","D":"存储海量日志文件"},"answer":["C"],"explanation":"解析： OSS 可用于图片、音视频、日志等海量文件的存储。各种终端设备、Web 网站程序、移动应用 可以直接向 OSS 写入或读取数据。 订单数据统计分为常规统计和流量分析统计： 常规统计倾向于财务统计， 主要包括销售额、毛利、成本、纯利润、客单价等。 流量分析统计更多是为了指导电商平台运营工作，分 析用户行为、订单流量等，如访客数、浏览量、支付转化率等。 这种类型分析往往要求实时性高，而对象 存储这种吞吐性能往往能难满足分析性能要求。 https://help.aliyun.com/document_detail/31819.html"},{"id":145,"question":"使用对象存储服务 OSS 的需要先新建一个 Bucket，以下关于 Bucket 的描述错误的是?（）","options":{"A":"在 OSS 中可以创建任意数量的 Bucket","B":"每个 Object 必须都包含在 Bucket 中","C":"Bucket 名字在整个 OSS 中具有全局唯一性，不能修改","D":"每个 Bucket 中存放的文件数量没有限制，大小不能超过 2PB"},"answer":["A"],"explanation":"同一阿里云账号在同一地域内创建的存储空间总数不能超过 100 个。                 官方链接： https://help.aliyun.com/document_detail/31842.html"},{"id":146,"question":"微博的博客挂件工具支持将最新的微博内容显示在网页上，在 WordPress 网站上显示最新微博内容时， 可以使用以下哪些版本的博客挂件工具?","options":{"A":"Flash 版","B":"PHP 版","C":"HTML 版","D":"JSP 版"},"answer":["A","C"],"explanation":"解析："},{"id":147,"question":"动态网站搭建的时候需要使用到数据库服务，以下哪些是属于数据库工具的? （）。","options":{"A":"Nginx","B":"SQLServer","C":"MySQL","D":"Oracle","E":"ASP"},"answer":["B","C","D"],"explanation":"Nginx 是一个高性能的 HTTP 和反向代理服务器,也是一个 IMAP/POP3/SMTP 代理服务器。 ASP(Application Service Provider)。ASP 可为用户设备的配置、租赁和管理应用提供解决方案。"},{"id":148,"question":"在云上搭建 WordPress 网站的时候，以下哪些属于其必需的步骤?      （）(正确   3 个)","options":{"A":"采购硬件服务器","B":"创建云服务器 ECS","C":"安装和配置开发环境","D":"购买云服务器操作系统的 Licence","E":"部署 WordPress 网站"},"answer":["B","C","E"],"explanation":"云端不需要买硬件； 因为 ecs 中已经有操作系统，不需要单独购买"},{"id":149,"question":"为了丰富 WordPress 网站的内容，将第三方视频资源嵌入到 WordPress 网页中，可以通过以下哪个功能 实现?","options":{"A":"主题管理","B":"内容管理","C":"插件管理","D":"多媒体管理"},"answer":["C"],"explanation":"将第三方视频资源嵌入到 WordPress 网页中是通过插件管理功能来实现的。"},{"id":150,"question":"为了将第三方的视频资源快速嵌入到 WordPress 网站，丰富网站的内容，可以通过什么方式来实现?（）","options":{"A":"WordPress 网站自带功能","B":"Smartideo 插件","C":"CNZZ 数据专家服务","D":"博客挂件工具"},"answer":["B"],"explanation":"Smartideo 插件支持将第三方的视频资源快速嵌入到 WordPress 网站，丰富网站的内容"},{"id":151,"question":"动态网站可以通过不同的开发语言来搭建，WordPress 网站是基于哪个开发语言来实现的?（）","options":{"A":"PHP","B":"ASP","C":"JSP","D":"JavaScript"},"answer":["A"],"explanation":"WordPress 是使用 PHP 语言开发的博客平台。"},{"id":152,"question":"静态网站和动态网站都有各自的使用场景，以下哪些场景适合使用静态网站?（）","options":{"A":"用户注册","B":"在线调查","C":"公司信息介绍","D":"订单管理"},"answer":["C"],"explanation":"解析： 动态网站适合进行交互的功能，用户注册，订单管理，在线调查都具有交互性"},{"id":153,"question":"动态网站有多种实现方式，以下哪个方式不可以用于动态网站搭建的?（）","options":{"A":"Windows+llS+SQLServer+ASP","B":"Linux+Apache+MySQL+PHP","C":"Linux+Nginx+MySQL+PHP","D":"Linux+Apache+Nginx+ASP"},"answer":["D"],"explanation":"解析： 动态网站需要数据库，D 没有数据库"},{"id":154,"question":"关于静态网站的特性，以下描述错误的是（）。","options":{"A":"相比动态网站，静态网站可以减轻服务器的负担","B":"静态网站的内容相对稳定，更加有利于搜索引擎优化","C":"页面打开速度比动态页面的打开速度慢","D":"在网站制作和维护方面工作量较大"},"answer":["C"],"explanation":"静态网页不需要处理页面直接返回，打开速度快。"},{"id":155,"question":"以下关于 WordPress 网站主题管理的描述错误的是?（）","options":{"A":"WordPress 网站的主题可以随时进行更换","B":"WordPress 网站的主题指定以后不能再进行更换","C":"WordPress 网站的主题管理中列出了当前使用主题的风格","D":"WordPress 提供了主题安装的不同方式"},"answer":["B"],"explanation":"WordPress 网站的主题指定以后可以再进行更换"},{"id":156,"question":"静态网站和动态网站最大的区别在于是否使用数据库服务，以下不属于数据库技术的是（）。","options":{"A":"Nginx","B":"MySQL","C":"SQLServer","D":"Oracle"},"answer":["A"],"explanation":"Nginx 是一个高性能的 HTTP 和反向代理 web 服务器，同时也提供了 IMAP/POP3/SMTP 服务"},{"id":157,"question":"WordPress 网站的传统搭建方式和云上搭建方式有很多异同点，其中关于两者不同的地方，下列描述正 确的是（）。","options":{"A":"服务器的采购方式","B":"部署开发环境","C":"下载 WordPress 安装包","D":"部署 WordPress 网站"},"answer":["A"],"explanation":"传统搭建方式和云上搭建方式的不同点在于服务器的采购方式不同"},{"id":158,"question":"在往阿里云负载均衡 SLB 后端添加 ECS 时，需要注意的事项有哪些?","options":{"A":"ECS 的权重值","B":"ECS 的数量","C":"ECS 的操作系统","D":"ECS 的安全配置"},"answer":["A","B"],"explanation":"阿里云负载均衡 SLB 后端添加 ECS，需要保证 ECS 的数量不超过限制，并且合理的配置每个 ECS 的权 重值。不需要考虑 ECS 的操作系统和安全配置。"},{"id":159,"question":"为了提升服务器的服务能力，可以采用以下哪些方式来实现? （）","options":{"A":"向上扩展","B":"向外扩展","C":"向前扩展","D":"向后扩展"},"answer":["A","B"],"explanation":"扩展，也称为伸缩性，指的是系统不断增加其承载水平的能力。服务器的扩展分为两种：向上扩展和 向外扩展。向上扩展就是指提升服务器的性能，比如说增加服务器配置（CPU,硬盘，内存等），或者购买性 能更好的服务器，使得服务器能够承受更大的负载。向外拓展就是指的增加更多的服务器，通过集群或者分 布式计算的方法，让多个小服务器共同承担单个应用系统的负载。没有向前扩展和向后扩展的说法。"},{"id":160,"question":"云负载均衡是以服务的方式提供给用户的，以下哪些是属于云负载均衡服务的组成部分（）。","options":{"A":"负载均衡实例","B":"负载均衡器","C":"监听规则配置","D":"数据库服务器","E":"后端服务器"},"answer":["A","C","E"],"explanation":"负载均衡由以下三个部分组成： 负载均衡实例 （Instances）一个负载均衡实例是一个运行的负载 均衡服务，用来接收流量并将其分配给后端服务器。要使用负载均衡服务，您必须创建一个负载均衡实例， 并至少添加一个监听和两台 ECS 实例。 监听 （Listeners）监听用来检查客户端请求并将请求转发给后端 服务器。监听也会对后端服务器进行健康检查。 后端服务器（Backend Servers）后端服务器是一组接收前 端请求的 ECS 实例。您可以单独添加 ECS 实例到后端服务器池，也可以通过虚拟服务器组或主备服务器组来 批量添加和管理。"},{"id":161,"question":"随着互联网技术的发展，传统业务将面临越来越多的挑战，以下哪个不属于传统业务面临的挑战？（）","options":{"A":"基于网络的数据访问流量迅速增长","B":"相对于网络技术的发展，服务器处理速度和内存访问速度的增长却远远低于网络带宽和应用服务 的增长","C":"大部分网站(尤其电子商务等网站)都需要提供不间断 24 小时服务","D":"单机模式不会成为网络故障点"},"answer":["D"],"explanation":"解析： 传统的单机模式，往往成为网络故障点"},{"id":162,"question":"关于阿里云负载均衡 SLB 和云服务器 ECS 的关系，以下描述错误的是?","options":{"A":"SLB 后端可以只添加一个后端 ECS","B":"SLB 后端的 ECS 可以分布在不同的可用区","C":"SLB 和后端的 ECS 可以分布在不同的地域","D":"SLB 和后端的 ECS 在不同可用区会增加访问的延迟"},"answer":["C"],"explanation":"解析： SLB 支持跨可用区挂载后端 ECS,即只要 ECS 和 SLB 实例在同一个地域即可。"},{"id":163,"question":"在使用阿里云负载均衡 SLB 的时候，首先要明确使用服务的地域，然后再去创建和使用 SLB。请问以下 关于地域的描述错误的是?（）","options":{"A":"为了减少延迟时间并提高下载速度，建议选择离客户最近地域的 SLB","B":"由于 SLB 不支持跨地域部署，应选择与后端 ECS 实例相同的地域","C":"为了提升系统的可用性，可以将 SLB 和 ECS 跨地域部署","D":"为了提升系统的可用性，SLB 可以部署在同一地域的不同可用区"},"answer":["C"],"explanation":"解析： 负载均衡是不支持跨地域的"},{"id":164,"question":"在添加服务器 ECS 到负载均衡 SLB 后端时，需要配置服务器 ECS 的权重值，下列关于权重的描述正确的 是（）。","options":{"A":"云服务器 ECS 的权重值必须一样","B":"权重值表示云服务器 ECS 的优先级，权重值越大说明相应用户请求的优先级越高","C":"SLB 后端服务器 ECS 的权重值可以不匹配","D":"访客请求将按照权重值进行分发，权重值大的云服务器将相应所有的请求"},"answer":["B"],"explanation":"解析： 云服务器 ECS 的权重值可以不一样 SLB 后端服务器 ECS 的权重值需要匹配        访客请求将 按照权重值进行分发，权重值大的云服务器可以相应部分请求，不是所有请求"},{"id":165,"question":"以下哪个不属于负载均衡 SLB 的使用步骤？（）","options":{"A":"规划和准备数据","B":"创建和部署云服务器 ECS","C":"购买硬件负载均衡器","D":"解析域名"},"answer":["C"],"explanation":"解析： SLB 使用步骤：规划和准备数据、创建和部署云服务器 ECS、创建和配置负载均衡 SLB、解析 域名"},{"id":166,"question":"相比于传统的服务模式，负载均衡有很多的优势，以下哪个不属于负载均衡的优势？（）","options":{"A":"成本低","B":"高扩展性","C":"安全性略低","D":"高可用性"},"answer":["C"],"explanation":"解析： 安全性差，产品就无法推广了"},{"id":167,"question":"网站流量中 PV 是指（）","options":{"A":"访问页面浏览总量","B":"独立访客数","C":"独立 IP 的访客数","D":"搜索引擎来源独立访客数"},"answer":["A"],"explanation":"网站流量中 PV 是指访问页面浏览总量。PV(访问量):即 Page View, 即页面浏览量或点击量,用户每次 刷新即被计算一次。"},{"id":168,"question":"要想知道网站一天中各个时间点的访客请求数，可以使用指标（）。","options":{"A":"网站一天的 PV","B":"网站一天的 UV","C":"网站一天的 IP","D":"网站一天的访问趋势"},"answer":["A"],"explanation":"UV（Unique visitor）是指通过互联网访问、浏览这个网页的自然人。访问您网站的一台电脑客户端 为一个访客。00:00-24:00 内相同的客户端只被计算一次。一天内同个访客多次访问仅计算一个 UV。IP （Internet Protocol）独立 IP 是指访问过某站点的 IP 总数，以用户的 IP 地址作为统计依据。00:00- 24:00 内相同 IP 地址之被计算一次。UV 与 IP 区别：如：你和你的家人用各自的账号在同一台电脑上登录新 浪微博，则 IP 数+1，UV 数+2。由于使用的是同一台电脑，所以 IP 不变，但使用的不同账号，所以 UV+2PV （Page View）即页面浏览量或点击量，用户每 1 次对网站中的每个网页访问均被记录 1 个 PV。用户对同一 页面的多次访问，访问量累计，用以衡量网站用户访问的网页数量。VV（Visit View）用以统计所有访客 1 天内访问网站的次数。当访客完成所有浏览并最终关掉该网站的所有页面时便完成了一次访问，同一访客 1 天内可能有多次访问行为，访问次数累计。PV 与 VV 区别：如：你今天 10 点钟打开了百度，访问了它的三个 页面；11 点钟又打开了百度，访问了它的两个页面，则 PV 数+5，VV 数+2.PV 是指页面的浏览次数，VV 是指 你访问网站的次数。"},{"id":169,"question":"网站流量中 UV 是指（）。","options":{"A":"访问页面浏览总量","B":"独立访客数","C":"独立 IP 的访客数","D":"搜索引擎来源独立访客数"},"answer":["B"],"explanation":"UV(独立访客)：即 Unique Visitor,访问您网站的一台电脑客户端为一个访客。00:00-24:00 内相同 的客户端只被计算一次。"},{"id":170,"question":"对于网站服务器自动采集的用户访问日志中的客户端信息，其中不能收集到的是（）。","options":{"A":"操作系统","B":"浏览器名称","C":"浏览器版本","D":"显示器分辨率"},"answer":["D"],"explanation":"客户端信息不能收集显示器分辨率。"},{"id":171,"question":"阿里云监控创建联系人时，需要填写哪些信息：","options":{"A":"手机","B":"邮箱","C":"微信","D":"来往"},"answer":["A","B"],"explanation":"报警联系人和联系组是云监控发送报警通知的基础。您需要先创建报警联系人和报警联系组，并将报 警联系人添加到报警联系组。当您创建报警规则时，选择相应的报警联系组，从而实现通过报警联系组接收 报警通知的目的。在设置报警联系人页面，填写报警联系人的姓名、手机号码、邮箱、旺旺和钉钉机器人。"},{"id":172,"question":"下面关于云计算多种服务模式的说法中，描述错误的是（）。","options":{"A":"SaaS 软件即服务，用户无需购买软件，直接租用","B":"云提供的服务层次由低到高，分别是 laaS、Paas、SaaS","C":"PaaS 是平台即服务，主要是指将软件的研发平台作为一种服务","D":"laas 是数据即服务，可以不要虚拟化平台，就可以构建 laaS 云"},"answer":["D"],"explanation":"IaaS 是基础设施即服务，主要提供一些基础资源。"},{"id":173,"question":"阿里云提供多种镜像供用户创建云服务器 ECS，下列镜像中根据实例规格进行计费的是?","options":{"A":"Ubuntu","B":"RedHat Enterprise Linux","C":"Debian","D":"CentOS"},"answer":["B"],"explanation":"RedHat Enterprise Linux 操作系统属于商业授权，镜像需要按实例规格进行计费，故选 B。A、C、D 选项均为开源操作系统，镜像不收费。"},{"id":174,"question":"镜像是阿里云提供给用户创建云服务器 ECS 时使用的，用户可以复制的镜像是?","options":{"A":"公共镜像","B":"自定义镜像","C":"共享镜像","D":"镜像市场"},"answer":["B"],"explanation":"创建实例后，可以根据业务需要自定义实例（如安装软件、部署应用环境等），并为更新后的实例创 建自定义镜像，并可以复制镜像。"},{"id":175,"question":"用户在使用过程中，忘记了云服务器 ECS 的密码，可以使用重置密码的方式进行密码设置。下面关于重 置密码的说法中，正确的是?","options":{"A":"云服务器 ECS 必须在运行中(Running)状态才可以重置密码","B":"运行中(Running) 状态的云服务器 ECS 实例重置密码可以直接使用新密码登录","C":"实例可以登录的时候可以在实例内直接修改密码，修改后立即生效","D":"Linux 系统的云服务器 ECS 如果仅密码认证,可以绑定密钥对直接支持双认证"},"answer":["C"],"explanation":"云服务器 ECS 可以在运行中(Running)和已停止状态时，可以重置密码。如果实例处于运行中状态， 您需要在重置实例登录密码后重启实例才能使新密码生效。实例可以登录的时候可以在实例内直接修改密码， 修改后立即生效。如果实例运行的是 Linux 系统，支持使用密钥对和用户名密码方式登录实例。如果当前仅 使用密码认证，绑定密钥对后密码验证方式自动失效，您必须重置实例登录密码才能使用两种方式登录实例。"},{"id":176,"question":"云计算是由多种技术共同实现的，其中专有网络 VPC 使用的技术是?","options":{"A":"计算虚拟化","B":"网络虚拟化","C":"存储虚拟化","D":"管理虚拟化"},"answer":["B"],"explanation":"专有网络 VPC 使用的技术时网络虚拟化技术。"},{"id":177,"question":"用户公司网站使用阿里云内容分发网络 CDN 进行加速的过程中，不需要特别关注的 CDN 指标选项是（）。","options":{"A":"网络路径","B":"延时","C":"丢包率","D":"回源率"},"answer":["A"],"explanation":"使用 CDN 服务后，主要关注的几个性能指标，包括：延时、下载速度、打开速度、丢包率、回源率。"},{"id":178,"question":"使用 Workbench 方式连接云服务器 ECS 时，需要在实例所在安全组中添加相应的安全组规则，在安全组 授权对象中可以添加多个地址段，下列地址段中不会开放 Workbench 访问的是?","options":{"A":"47.96.60.0/24","B":"100.64.0.0/16","C":"118.31.243.0/24","D":"0.0.0.0/0"},"answer":["B"],"explanation":"B 选项中，100.104.0.0/16 为专有网络私网 IP 地址段，开放这个 IP 段并不能 Workbench 方式连接云 服务器 ECS，故选择 B 选项。A、C、D 选项地址段均正确。"},{"id":179,"question":"阿里云为用户提供高性能的弹性裸金属服务器 EBM，相比云服务器 ECS 而言，弹性裸金属服务器 EBM 的 独有特性是?","options":{"A":"虚拟化嵌套","B":"在线更换系统盘","C":"分钟级交付","D":"无性能损失"},"answer":["A","D"],"explanation":"阿里云弹性裸金属服务器 EBM 保留了物理机的性能与特性，全面支持嵌套虚拟化技术，并且可以独占 计算资源，没有虚拟化性能开销和特性损失。分钟级交付不是独特优势，ECS 一样的，所以不选。"},{"id":180,"question":"下面关于阿里云内容分发网络 CDN 的说法中，正确的是?","options":{"A":"只能对阿里云中服务访问提供加速","B":"CDN 可以为客户访问进行加速","C":"CDN 支持不同地域访问客户的加速","D":"CDN 可以为对象存储 OSS 提高访问加速"},"answer":["B","C","D"],"explanation":"阿里云内容分发网络 CDN 支持阿里云服务以外的服务提供加速服务。其他选项均为阿里云 CDN 服务的 特性，均正确。"},{"id":181,"question":"在创建阿里云云服务器 ECS 时，必须指定的信息有哪些？","options":{"A":"地域","B":"vCPU","C":"镜像","D":"数据盘"},"answer":["A","B","C"],"explanation":"创建 ECS 实例时，需要配置实例规格、镜像、存储、网络、安全组等必备信息，数据盘并不是创建云 服务器 ECS 时必须指定的信息。"},{"id":182,"question":"小明所在公司为用户提供手游业务，采用阿里云云服务器 ECS 做业务访问。如果需要更新游戏的客户端， 为提高更新速度，减少带宽方面的投入，可以采用的阿里云服务是什么?","options":{"A":"对象存储 OSS","B":"负载均衡 SLB","C":"内容分发网络 CDN","D":"云数据库 RDS"},"answer":["C"],"explanation":"阿里云内容分发网络（Content Delivery Network）是建立并覆盖在承载网之上，由分布在不同区域 的边缘节点服务器群组成的分布式网络。阿里云 CDN 分担源站压力，避免网络拥塞，确保在不同区域、不同 场景下加速网站内容的分发，提高资源访问速度。更新游戏客户端时，通过 CDN 会到客户最近的 CDN 节点下 载内容，提高更新速度，同时不会到源站取数据，降低源站带宽的投入。A 是对象存储,对象存储服务 （Object Storage Service，OSS）是一种海量、安全、低成本、高可靠的云存储服务，适合存放任意类型 的文件。容量和处理能力弹性扩展，多种存储类型供选择，全面优化存储成本。负载均衡 SLB，负载均衡 （Server Load Balancer）是对多台云服务器进行流量分发的负载均衡服务。负载均衡可以通过流量分发扩 展应用系统对外的服务能力，通过消除单点故障提升应用系统的可用性。云数据库 RDS，阿里云（Gartner 全球数据库魔力象限领导者）提供稳定可靠、可弹性伸缩的关系型云数据库 RDS，支持 MySQL、SQL Server、 PostgreSQL、MariaDB 和 PPAS 引擎，具备容灾、备份、恢复、迁移等方面的全套解决方案。"},{"id":183,"question":"下列关于阿里云地域(Region)和可用区(Zone)的说法中，正确的是?","options":{"A":"一个 Region 可以包含多个 Zone","B":"一个 Zone 可以包含多个 Region","C":"Region 之间可以通过阿里云内网进行互联","D":"Zone 一般是基于地理位置进行划分的"},"answer":["A"],"explanation":"region 是地理区域的概念，例如不同的省份会是不同的 region；zone 是可用区，在一个区域内可以 有多个可用区，通过不同的可用区实现高可用性。zone 之间通过内网通信，region 之间的资源不能内网通 信，可以通过云企业网或者高速通道打通。"},{"id":184,"question":"自建的 MySQL 迁移至 RDSMysq 可以通过哪个产品实现应用不停服务的情况下，平滑完成数据库的迁移工 作?","options":{"A":"Mysqldump","B":"数据传输 DTS","C":"Mysqllnsert","D":"数据库逻辑备份"},"answer":["B"],"explanation":"数据传输服务 DTS（Data Transmission Service）是阿里云提供的实时数据流服务，支持 RDBMS、 NoSQL、OLAP 等，集数据迁移/订阅/同步于一体，为您提供稳定安全的传输链路。不停机迁移可以通过数据 传输服务 DTS 实现，也可以通过数据库的主从同步实现，"},{"id":185,"question":"弹性裸金属服务器 EBM 是阿里云中推出的高性能产品，下面关于弹性裸金属服务器 EBM 的说法中不正确 的是?","options":{"A":"分钟级交付","B":"可以变配","C":"数据盘使用云盘","D":"系统盘使用云盘"},"answer":["B"],"explanation":"弹性裸金属服务器（神龙）弹性裸金属服务器（ECS Bare Metal Instance）是一种弹性可水平伸缩 的高性能计算服务，计算性能与传统物理机无差别，具有安全物理隔离的特点，分钟级的交付周期助你的企 业获得实时的业务响应能力。使用弹性裸金属服务器时，请注意：不支持规格变配。当弹性裸金属服务器发 生硬件故障时，支持故障转移，数据都保留在云盘中。"},{"id":186,"question":"创建一台阿里云云服务器 ECS 并部署应用后，需要把该云服务器 ECS 迁移至其他账号中，最便捷的实现 方法是?","options":{"A":"使用阿里云快照","B":"制作自定义镜像","C":"共享数据盘","D":"共享系统盘"},"answer":["B"],"explanation":"阿里云上 2 个账号之间虚拟机迁移流程：用 A 账号的虚拟机创建镜像，将镜像拷贝到 B 账号的对象存 储，在 B 账号用镜像拉起虚拟机，迁移完毕。"},{"id":187,"question":"用户想使用阿里云中构建自己的专有云，用户选择的实例规格是?","options":{"A":"通用型","B":"计算型","C":"弹性裸金属服务器","D":"内存型"},"answer":["C"],"explanation":"构建专有云，就是用物理服务器/裸金属服务器部署自己的专有云，故选 C。"},{"id":188,"question":"快照是阿里云云服务器 ECS 的一种数据保护方式。可以创建快照的云服务器 ECS 的状态是?","options":{"A":"准备中(Pending)","B":"启动中(Starting)","C":"运行中(Running)","D":"停止中(Stopping)"},"answer":["C"],"explanation":"创建快照时，请勿修改 ECS 实例状态（停止或重启 ECS 实例），会导致快照创建失败（创建时会有提 示）。准备中说明虚拟机还未创建出来，没创建出来的虚拟机当然也没法做快照。故选 C"},{"id":189,"question":"下列关于云计算的部署模式中说法不正确的是?","options":{"A":"专有云:也称私有云，用户自行管理和维护难度低于公有云","B":"公有云:规模化、运维可靠、高扩展性","C":"混合云:同时兼具专有云隐私性和公有云的扩展性优势","D":"从运维角度来说，混合云的使用和管理复杂性要高于公有云和专有云。"},"answer":["A"],"explanation":"公有云的底层都是公有云的厂商来运维，用户只需要运维上层的资源，难度大大降低。而专有云，从 物理硬件、网络、环境到 IaaS、PaaS、SaaS 都需要客户自己运维，因此专有云的运维难度明显大于公有云。 故A错"},{"id":190,"question":"下列不属于阿里云 OSS 对象存储访问方式（）。","options":{"A":"SSH 访问","B":"HTTP 访问","C":"FTP 访问","D":"API 访问"},"answer":["C"],"explanation":"阿里云 OSS 对象存储功能包括副本，HTTP 访问，API 访问等，但是不支持 FTP 访问。"},{"id":191,"question":"购买阿里云云服务器 ECS，主要的付费方式有哪些?","options":{"A":"流量计费","B":"包年包月","C":"按量付费","D":"带宽付费"},"answer":["B","C"],"explanation":"ECS 付费方式有包年包月、按量付费、竞价实例。"},{"id":192,"question":"以下选项中，关于阿里云监控说法错误的有哪些?","options":{"A":"可以监控 ECS","B":"可以监控 OSS 文件数量","C":"不可以监控 RDS 数据库","D":"可以监控 SLB"},"answer":["B","C"],"explanation":"云监控可以监控 ECS、RDS、SLB，但不能监控 OSS 文件数量。 https://help.aliyun.com/document_detail/163515.htm?spm=a2c4g.11186623.2.11.60762e44AfxpPt#conc ept-2486491"},{"id":193,"question":"以下哪些选项是用来实现阿里云 SLB 负载均衡核心功能的?","options":{"A":"apache","B":"squid","C":"Tengine","D":"LVS"},"answer":["C","D"],"explanation":"阿里云 SLB 七层采用 Tengine，四层采用 LVS"},{"id":194,"question":"创建一台 Linux 操作系统的阿里云云服务器 ECS 时，以下哪些选项是可以选择的登录凭证(认证方式)?","options":{"A":"密码对","B":"无密码","C":"创建后设置","D":"自定义密码","E":"创建前设置"},"answer":["A","C","D"],"explanation":"创建 ECS 时，登陆凭证有密钥对、自定义密码和创建后设置。A 存疑，应该是密钥对。"},{"id":195,"question":"在阿里云中创建云服务器 ECS 时，可以选择不同的实例规格族，一个实例规格族定义的主要信息有哪些?","options":{"A":"CPU","B":"内存","C":"块存储","D":"镜像"},"answer":["A","B"],"explanation":"根据业务场景和使用场景，ECS 实例可以分为多种实例规格族。根据 CPU、内存等配置，一种实例规 格族又分为多种实例规格。ECS 实例规格定义了实例的基本属性：CPU 和内存（包括 CPU 型号、主频等）。 但是，ECS 实例只有同时配合块存储、镜像和网络类型，才能唯一确定一台实例的具体服务形态。"},{"id":196,"question":"以下关于阿里云负载均衡 SLB 的会话保持功能描述错误的是?","options":{"A":"SLB 的会话保持功能可以将同一客户端请求转发到同一后端 ECS 上","B":"四层负载均衡的会话保持和七层负载均衡的会话保持没有区别","C":"四层负载均衡对于同一 IP 地址的请求持续发往一台服务器","D":"七层负载均衡指的是相同 cookie 的请求发往同一台服务器"},"answer":["B"],"explanation":"阿里云的负载均衡分为四层负载均衡和七层负载均衡两种。四层负载，说的是基于 IP+端口的负载均 衡；七层负载，说的是基于 WEB 请求，URL 等应用信息的负载均衡。会话保持功能就是保障同一客户端请求 转发到同一后端 ECS 上。因为四层负载均衡针对的是 IP 加端口，所以四层的会话保持是对于同一 IP 地址的 请求持续发往一台服务器；而七层负载均衡针对的是 WEB 请求，所以七层负载均衡的会话保持指的是相同 cookie 的请求发往同一台服务器。"},{"id":197,"question":"关于负载均衡 SLB 实例的网络选型，描述错误的是?","options":{"A":"可以选择公网和私网两种不同的网络类型","B":"如果您的负载均衡服务需要公网访问，选择公网实例","C":"如果您的负载均衡服务仅需要对内网进行访问，选择私网实例","D":"SLB 可以同时具备公网和私网两种不同网络类型"},"answer":["D"],"explanation":"负载均衡 SLB 实例提供公网和私网两种不同的网络类型，只能选择其中一种，不能同时具备。如果您 的负载均衡需要公网访问，那么选择公网实例；如果只需要内网访问，那么选择私网实例，不允许同时使用。"},{"id":198,"question":"以下哪些是阿里云负载均衡 CLB 支持的流量调度方式?","options":{"A":"源地址 hash","B":"轮询","C":"目标地址 hash","D":"最小连接数"},"answer":["A","B"],"explanation":"解析：CLB 支持轮询、加权轮询（WRR）和一致性哈希（CH）调度算法。 七层 CLB 暂不支持一致性哈 希（CH）调度算法。 https://help.aliyun.com/zh/slb/classic-load-balancer/product- overview/features?spm=a2c4g.11186623.0.0.232bc8d2pKYcuh"},{"id":199,"question":"关于阿里云负载均衡 SLB 功能的描述，以下错误的是?","options":{"A":"SLB 支持 4 层和 7 层的负载均衡服","B":"轮询和最小连接数两种流量调度都是静态的流量分发，不能根据后端服务器的负载进行动态调整","C":"SLB 的会话保持功能可以将同一客户端的请求转发到同一后端 ECS 上","D":"SLB 的健康检查功能可以自动屏蔽异常状态的 ECS，待该 ECS 恢复正常后自动解除屏蔽"},"answer":["B"],"explanation":"B 中负载能动态调整"},{"id":200,"question":"关于云负载均衡和传统负载均衡的对比，以下描述错误的是?","options":{"A":"云负载均衡可以实现无缝伸缩，伸缩过程对相关调用和访问没有任何影响","B":"传统负载均衡在升级的时候会导致业务中断","C":"云负载均衡需要额外购买安全防护模块，部署比较困难","D":"传统负载均衡是按需使用，按量付费的"},"answer":["C","D"],"explanation":"云负载均衡可以实现无缝伸缩，伸缩过程对相关调用和访问没有任何影响，也不会导致业务中断。传 统型负载均衡不支持热升级，在升级的时候会导致业务中断。云负载均衡自带 DDos 防护，一键集成 WAF 等 等安全功能，不需要额外购买安全防护模块，部署很简单。云负载均衡仅支持按量付费，传统型负载均衡支 持按量计费和包年包月两种模式。"},{"id":201,"question":"在创建和配置负载均衡 SLB 的时候，需要选择的配置有哪些?","options":{"A":"选择 SLB 实例的地域","B":"选择 SLB 主备实例所在的可用区","C":"SLB 实例的转发方式","D":"SLB 实例所在服务器的信息","E":"SLB 实例是单机部署还是集群部署"},"answer":["A","B","C"],"explanation":"创建和配置负载均衡 SLB 的时候，需要选择的配置有：地域、VPC、可用区、IP 模式、功能版本、实 例的网络类型、公网计费方式、实例名称资源 https://help.aliyun.com/document_detail/197341.html"},{"id":202,"question":"以下关于阿里云负载均衡 SLB 架构描述正确的是?","options":{"A":"SLB 是部署在单台服务器上的","B":"SLB 的四层转发是通过 LVS 实现的","C":"SLB 的七层转发是通过 Tengine 实现的","D":"SLB 实现的是同一个可用区的高可用"},"answer":["B","C"],"explanation":"阿里云负载均衡 SLB 服务通过设置虚拟服务地址，将位于同一地域的多台云服务器资源虚拟成一个高 性能、高可用的应用服务池；再根据应用指定的方式，将来自客户端的网络请求分发到云服务器池中。其中 四层负载均衡采用开源软件 LVS 构建，并根据云计算需求对其进行了定制和优化；七层负载均衡使用的才用 开源软件 Tengine 构建。阿里云的 SLB 能够将请求均衡的转移到不同地域，不同可用区，来实现高可用。选 项 A 错误之处在于 SLB 不是部署在单台机器上，是部署在多台云服务器组成的集群中，选项 D 的错误之处在 于阿里云的 SLB 实现的是多个可用区的高可用。"},{"id":203,"question":"以下关于阿里云负载均衡 SLB 使用场景的描述错误的是?","options":{"A":"SLB 不可以单独使用，后端必须添加 ECS 作为其后端服务器","B":"SLB 分为公网实例和私网实例","C":"用户可以直接访问 SLB 私网实例","D":"SLB 后端可以挂载一个或多个 ECS"},"answer":["C"],"explanation":"1.SLB 不可以单独使用，后端必须添加 ECS 作为其后端服务器，SLB 后端可以挂载一个或多个 ECS，所 以 AD 正确 2.SLB 分为公网实例和私网实例，公网实例提供公网 IP，用户可以直接访问，私网实例提供的是 私网地址，只能通过阿里云内部网络访问该负载均衡服务。所以 B 正确，C 错误 所以正确答案是 C"},{"id":204,"question":"为了实现阿里云负载均衡 SLB 对异常 ECS 自动进行隔离或恢复，可以用那个实现?","options":{"A":"会话保持","B":"健康检查","C":"流量分发","D":"监听配置"},"answer":["B"],"explanation":"会话保持的作用是保障同一客户端请求转发到同一后端 ECS 上。健康检查是通过定期对后端 ECS 发生 Ping、尝试连接或发送请求来测试后端 ECS 运行的状态。当后端 ECS 实例被判定为不健康时，负载均衡实例 将不会把请求转发到该实例上，从而对异常 ECS 自动进行隔离。但健康检查会对所有后端 ECS 进行，当不健 康 ECS 恢复健康状态时，负载均衡实例将会恢复把新的请求转发给它。流量分发是指负载均衡 SLB 根据转发 规则将新的请求流量分发到不同的后端 ECS 上。监听配置是指负载均衡 SLB 对后端 ECS 的 IP 和端口的配置。"},{"id":205,"question":"在使用负载均衡 SLB 之前，需要做好哪些准备?","options":{"A":"注册一个阿里云网站账号","B":"购买一台物理服务器","C":"购买一个负载均衡器","D":"选择使用服务的地域"},"answer":["A","C"],"explanation":"使用负载均衡 SLB 的准备工作有：注册一个阿里云网站帐号，然后购买一个负载均衡器。负载均衡 SLB 是以云服务的形式提供，不需要购买物理服务器。负载均衡 SLB 不需要考虑使用服务的地域。"},{"id":206,"question":"下列关于阿里云负载均衡 SLB 转发方式的描述正确的有哪些？","options":{"A":"可以在监听规则配置时选择具体的转发方式","B":"轮询模式是将访问请求分发给当前连接数最小的一台后端 ECS 进行处理","C":"最小连接数模式会将外部和内部的访问请求分发给后端 ECS 进行处理","D":"同一个 SLB 实例不可以同时提供两种不同转发方式"},"answer":["A","D"],"explanation":"在配置监听规则时，可以选择具体的负载均衡 SLB 的转发方式，转发方式有两种：轮询和最小连接数。 轮询是指按顺序逐一分发新增连接给后端的 ECS 进行处理；最小连接数是指将新增连接分配给活动连接数少 的服务器。同一个 SLB 实例只能转发内部和外部其中一种访问请求，也只能提供一种转发方式。"},{"id":207,"question":"阿里云云服务器 ECS 包括的镜像类型不包括","options":{"A":"自定义镜像","B":"微软镜像","C":"公共镜像","D":"第三方镜像市场提供的镜像"},"answer":["B"],"explanation":"阿里云云服务器 ECS 包括的镜像类型有公共镜像，第三方镜像市场提供的镜像和自定义镜像，没有微 软镜像。"},{"id":208,"question":"以下哪个 API 属于 OSS 上传文件的 API 接口?","options":{"A":"GetObject","B":"PutObject","C":"DeleteObject","D":"UpdateObject"},"answer":["B"],"explanation":"OSS 上传文件的 API 接口是 PutObject https://help.aliyun.com/document_detail/55538.html"},{"id":209,"question":"如果充分利用阿里云 ECS 的计费策略，可以极大地降低 IT 投入的成本，以下哪项不是合理降低成本的 策略?","options":{"A":"由于云平台具有超强的计算能力，可以将所有业务都部署在同一台 ECS 上。","B":"业务初期先选择较低配置的 ECS，等用户增多时，再升级 ECS 的配置。","C":"用于短期测试的 ECS，选择按量付费的方式，用完之后立即释放，只付使用期间的费用。","D":"稳定，不间断运行的应用，选择包年包月的付费方式，平均单价更低。"},"answer":["A"],"explanation":"BCD 选项都可以合理的降低成本，A 选项把所有的所有业务都部署在同一台 ECS 上会导致单点故障， 一旦这台 ECS 发生故障，所有业务将不可用，因此不合理，所以答案选择 A"},{"id":210,"question":"以下什么命令是用于安装 Apache 服务的?","options":{"A":"yum-y setup httpd","B":"yum-y install httpd","C":"service httpd start","D":"passwd siteadmin"},"answer":["B"],"explanation":"yum install 是 linux 中安装服务的命令"},{"id":211,"question":"在阿里云上创建专有网络 VPC 时，VPC 会自动为用户创建 1 条系统路由，这条路由的作用是（）。","options":{"A":"没有任何作用","B":"用于专有网络外的云产品实例访问专有网络内的云产品实例","C":"用于专有网络内的云产品实例访问专有网络外的云服务(该云服务支持 VPC 内的云产品实例直接访 问)","D":"用于打通用户所有的专有网络"},"answer":["C"],"explanation":"解析：以 100.64.0.0/10 为目标网段的路由条目，用于 VPC 内的云产品通信。 以路由表所属 VPC 内 的交换机网段为目标网段的路由条目，用于交换机内的云产品通信。 https://help.aliyun.com/zh/vpc/user-guide/create-and-manage-route- table?spm=a2c4g.11186623.0.i35 创建 VPC 后，系统会自动为您创建一张系统路由表并为其添加系统路由 条目来管理 VPC 的流量。您不能在系统路由表中创建系统路由条目，也不能删除系统路由条目，但您可以创 建自定义路由条目并将指定目标网段的流量路由至指定目的地。"},{"id":212,"question":"如果用户对云盘既需要较高的 IOPS 和吞吐性能，同时又希望价格适中，最佳的选择是()。","options":{"A":"普通云盘","B":"SSD 云盘","C":"高效云盘","D":"本地 SATA 磁盘"},"answer":["C"],"explanation":"阿里云云盘有以下几种： ESSD 云盘：基于新一代分布式块存储架构的超高性能云盘产品，结合 25GE 网络和 RDMA 技术，单盘可提供高达 100 万的随机读写能力和更低的单路时延能力。 SSD 云盘：具备稳定的 高随机读写性能、高可靠性的高性能云盘产品。 高效云盘：具备高性价比、中等随机读写性能、高可靠性 的云盘产品。 普通云盘：属于上一代云盘产品，已经逐步停止售卖。 其中高效云盘价格适中，也能提供较 高的 IOPS 和吞吐性能，所以正确答案是 C"},{"id":213,"question":"阿里云云服务器 ECS 为用户提供多种连接方式进行 ECS 的控制，下列关于 VNC 和 Workbench 的连接方式 中说法正确的是（）。","options":{"A":"VNC 支持多用户同时连接同一台实例","B":"Workbench 支持多用户同时连接同一台实例","C":"VNC 和 Wordbench 都支持多用户同时连接同一台实例","D":"VNC 和 Wordbench 都不支持多用户同时连接同一台实例"},"answer":["B"],"explanation":"相比 VNC，Workbench 支持多用户远程连接同一台 Windows 实例 相比 VNC，Workbench 支持多用户远 程连接同一台 Linux 实例 https://help.aliyun.com/document_detail/163819.html https://help.aliyun.com/document_detail/163821.html"},{"id":214,"question":"下面关于阿里云自定义镜像说法不正确的是?","options":{"A":"自定义镜像是管理员自行创建的","B":"使用自定义镜像创建云服务器 ECS 后，该镜像不能被删除","C":"自定义镜像可以共享给其他用户","D":"可以基于快照制作自定义镜像"},"answer":["A"],"explanation":"自定义镜像是用户基于实例或快照创建的镜像，或者从本地导入的镜像，包含已部署的应用、数据等 信息，不是管理员自行创建的。 使用自定义镜像创建云服务器 ECS 后，该镜像不能被删除。 自定义镜像可 以共享给其他用户。 可以基于快照制作自定义镜像。 所以正确答案是 A"},{"id":215,"question":"创建一台 Linux 操作系统的阿里云云服务器 ECS 后，发现可用的磁盘空间不足。希望通过增加数据盘的 方式增大存储空间。当数据盘在 Linux 操作系统中已经分区格式化后，挂载在本地文件夹下才能使用，所用 的挂载命令是?","options":{"A":"ls","B":"mkdir","C":"mount","D":"mkfs"},"answer":["C"],"explanation":"ls 列出当前目录内容 mkdir 创建新目录 mount 挂载分区 mkfs 格式化分区"},{"id":216,"question":"创建阿里云云服务器时，需要确定操作系统。可以通过下列哪个选项，来确定云服务器 ECS 的操作系统?","options":{"A":"安全组","B":"专有网络 VPC","C":"镜像","D":"快照"},"answer":["C"],"explanation":"购买 ECS 云服务器时可以通过镜像来安装云服务器的操作系统，ECS 可选的镜像来源有公共镜像、自 定义镜像、共享镜像和镜像市场"},{"id":217,"question":"Linux 操作系统的云服务器 ECS 新增一块块存储，如果希望开机能够自动挂载该块存储中的空间，（） 配置文件可将挂载信息写入。","options":{"A":"/etc/initab","B":"/etc/fstab","C":"/etc/system","D":"/etc/passwd"},"answer":["B"],"explanation":"/etc/initab 是 linux 系统启动时的初始化脚本，设定运行级别。 /etc/fstab 是用来存放文件系统 的静态信息的文件，开机时会读取文件内容进行自动挂载存储。 /etc/passwd 是用来存放用户账号信息的文 件，用于用户登录时校验 不存在/etc/system 文件。"},{"id":218,"question":"设置阿里云内容分发网络 CDN 的加速域名为 www.a.com,源站域名设置为 www.b.com。关于这两个域名正 确的表述是？","options":{"A":"客户访问 www.a.com 可以由 CDN 进行加速","B":"客户直接访问 www.a.com","C":"客户访问 www.a.com 符合会直接解析为源站 IP 地址","D":"管理员需要对 www.a.com 的域名配置 CNAME 记录"},"answer":["D"],"explanation":"设置了加速域名为 www.a.com 后，不能直接使用。需要对 www.a.com 的域名配置 CNAME 记录，然后才 能使用加速。客户访问 www.a.com 后，会被解析成 CNAME 域名。"},{"id":219,"question":"用户创建了一台 Linux 操作系统的云服务器 ECS，登录时使用的默认管理员用户是?","options":{"A":"admin","B":"administrator","C":"root","D":"sa"},"answer":["C"],"explanation":"新创建的 Linux 云服务器的默认管理员用户是 root"},{"id":220,"question":"在 Linux 操作系统的云服务器 ECS 中修改用户登录密码时，使用的命令是（）。","options":{"A":"passwd","B":"password","C":"shadow","D":"net user"},"answer":["A"],"explanation":"在 Linux 云服务器 ECS 中，修改用户登录密码的命令是 passwd"},{"id":221,"question":"下面关于阿里云内容分发网络 CDN 的说法中，错误的是?","options":{"A":"CDN 可以为网站服务器提供访问加速","B":"CDN 仅支持阿里云中资源的加速","C":"CDN 可以为 OSS 提供访问加速","D":"CDN 可以将客户访问请求的 HTTP 转换为 HTTPS"},"answer":["B"],"explanation":"1.CDN 可以为网站服务器提供访问加速 2.CDN 支持阿里云中资源的加速，也支持非阿里云中资源的加 速 3.CDN 可以为 OSS 提供访问加速 4.CDN 可以将客户访问请求的 HTTP 转换为 HTTPS"},{"id":222,"question":"阿里云一台云服务器 ECS 相当于一 台虚拟机，会包括计算机的基本组件。云服务器 ECS 不包含的是?","options":{"A":"vCPU","B":"内存","C":"操作系统","D":"声卡"},"answer":["D"],"explanation":"云服务器 ECS 包含操作系统,VCPU，内存和虚拟磁盘，不包括声卡。"},{"id":223,"question":"下面关于阿里云云服务器 ECS 的说法中，错误的是?","options":{"A":"可以通过内网访问其他阿里云服务","B":"提供虚拟防火墙等安全方案","C":"分钟级交付，快速部署","D":"支持虚拟化嵌套方案"},"answer":["D"],"explanation":"1.阿里云 ECS 可以通过内网访问其他阿里云服务 2.阿里云 ECS 提供虚拟防火墙等安全方案 3.阿里云 ECS 可以分钟级交付，快速部署 4.阿里云 ECS 不支持虚拟化嵌套方案"},{"id":224,"question":"阿里云快照可以实现数据备份和恢复。下面关于阿里云快照的说法中正确的是?","options":{"A":"可以单独回滚某个文件进行恢复","B":"更换系统盘后，新的系统盘可以使用快照进行回滚","C":"快照默认是开通的，支持随时回滚数据","D":"快照可以回滚一个磁盘上的数据"},"answer":["D"],"explanation":"1.阿里云快照不能单独回滚某个文件进行恢复 2.更换系统盘后，新的系统盘无法使用快照进行回滚 3.快照不是是默认开通的 4.快照可以回滚一个磁盘上的数据 所以正确答案是 D"},{"id":225,"question":"在阿里云中创建了 Linux 操作系统的云服务器 ECS,该云服务器 ECS 默认支持的认证方式有哪些?","options":{"A":"证书认证","B":"指纹认证","C":"密码认证","D":"动态口令"},"answer":["A","C"],"explanation":"阿里云云服务器 ECS 默认支持的认证方式有证书认证和密码认证"},{"id":226,"question":"以下属于 RDS 访问模式的有哪些?","options":{"A":"常规模式","B":"标准访问模式","C":"高安全访问模式","D":"非常规模式"},"answer":["B","C"],"explanation":"RDS 的访问模式有标准访问模式和高安全访问模式。"},{"id":227,"question":"下列选项中，（）服务可以为网站加速，分担源站压力，提高资源访问速度?","options":{"A":"RDS","B":"OSS","C":"VPC","D":"CDN"},"answer":["D"],"explanation":"RDS 是关系型数据库服务 OSS 是对象存储服务 VPC 是私有网络服务 CDN 是内容分发网络服务 CDN 内 容分发网络服务可以为网站加速，分担源站压力，提高资源访问速度"},{"id":228,"question":"以 下哪些选项，是需要用户在购买阿里云云服务器 ECS 后自行维护的?","options":{"A":"电力系统","B":"应用软件的升级","C":"数据的备份","D":"网络设备的检查"},"answer":["B","C"],"explanation":"用户购买阿里云云服务器 ECS 后，无须担心硬件相关的维护，包括电力系统和网络设备检查。需要自 行维护的有应用软件升级，数据的备份等。"},{"id":229,"question":"用户在使用阿里云云服务器 ECS 的过程中，通过更换系统盘的可以修改的配置有哪些?","options":{"A":"主机中的 EIP","B":"操作系统","C":"登陆密码","D":"系统盘大小"},"answer":["B","C","D"],"explanation":"用户在使用阿里云云服务器 ECS 的过程中，通过更换系统盘的可以修改的配置有操作系统，登录密码 和系统盘大小"},{"id":230,"question":"以下关于阿里云内容分发网络 CDN 的说法中，正确的有哪些?","options":{"A":"可以提高用户访问速度，增加服务器带宽","B":"可以解决用户访问量大的问题，提高用户访问速度","C":"可以节省服务器带宽消耗","D":"可以实现跨运营商、跨地域的全网覆盖"},"answer":["A","B","C","D"],"explanation":"阿里云内容分发网络 CDN 的优点有： 1.可以提高用户访问速度，增加服务器带宽 2.可以解决用户访 问量大的问题，提高用户访问速度 3.可以节省服务器带宽消耗 4.可以实现跨运营商、跨地域的全网覆盖"},{"id":231,"question":"下列关于使用 CLB 定义后端服务器权重的说法正确的有哪些?","options":{"A":"权重没有大小要求，可以无限大","B":"权重为 0，则相当于该 ECS 手动下线","C":"权重范围为 0-100","D":"权重范围为 1-1000"},"answer":["B","C"],"explanation":"1 权重为 0，则相当于该 ECS 手动下线 2.权重有大小要求，范围为 0-100"},{"id":232,"question":"使用阿里云 SLB 负载均衡时，后端的 ECS 服务器必须在相同的（ ）","options":{"A":"zone","B":"region","C":"distribute","D":"机房"},"answer":["B"],"explanation":"使用阿里云 SLB 负载均衡时，后端的 ECS 服务器必须在相同的区域，否则无法调用"}
