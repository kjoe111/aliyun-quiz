<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>阿里云刷题题库</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#72767d;--line:#e8eaed;--good:#16794b;--bad:#c43d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:94px}.top{position:sticky;top:0;z-index:20;background:#f5f6f8ee;backdrop-filter:blur(12px);padding:12px 14px 10px;border-bottom:1px solid var(--line)}.row{display:flex;align-items:center;gap:8px}.grow{flex:1}.title{font-weight:750;font-size:18px}.stats,.small,.note,.status,.hint{font-size:12px;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}.progress{height:5px;background:#e1e4e8;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#111827}.tabs,.tools,.cloud{display:flex;gap:8px;overflow:auto;padding:10px 14px 0;flex-wrap:wrap}.chip,.mini{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font-size:13px;color:var(--text)}.chip{border-radius:99px;white-space:nowrap}.chip.active{background:#111827;color:#fff}.note{padding:8px 14px 0;line-height:1.5}.cloud{align-items:center}.status{flex:1;min-width:170px}.status.ok{color:var(--good)}.status.err{color:var(--bad)}.auth{display:none;margin:8px 14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.auth.show{display:block}.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.auth input,.jump{border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;font-size:13px}.auth input{width:100%;font-size:14px}.authactions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.hint{margin-top:7px;line-height:1.5}.card{margin:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.meta{display:flex;justify-content:space-between;margin-bottom:12px}.badge{font-size:12px;background:#eef1f4;padding:5px 8px;border-radius:8px}.q{font-size:18px;line-height:1.7;font-weight:650;white-space:pre-wrap}.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin-top:10px;font-size:16px;line-height:1.5}.letter{flex:0 0 26px;height:26px;border:1px solid #cfd4da;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}.option.selected{background:#f4f6f8}.option.selected .letter{background:#111827;color:#fff}.option.good{background:#edf8f2;border-color:#8cc9aa}.option.bad{background:#fff1f1;border-color:#e3a1a1}.option.good .letter{background:var(--good);color:#fff}.option.bad .letter{background:var(--bad);color:#fff}.answer{display:none;border-top:1px solid var(--line);padding-top:14px;margin-top:15px;line-height:1.7}.answer.show{display:block}.exp{font-size:14px;color:#4f555c;margin-top:8px;white-space:pre-wrap}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.toolbar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:30}.toolbarin{max-width:692px;margin:auto;display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:9px}.btn{border:0;border-radius:13px;padding:13px 10px;font-weight:700;background:#111827;color:#fff;font-size:15px}.secondary{background:#eef1f4;color:#222}.jump{width:78px}@media(max-width:520px){.authgrid{grid-template-columns:1fr}}
</style></head>
<body><div class="app">
<div class="top"><div class="row"><div class="grow"><div class="title">阿里云刷题</div><div class="stats"><span id="done">已答 0</span><span id="correct">正确 0</span><span id="wrongN">当前错题 0</span><span id="wrong1">错1次 0</span><span id="wrong2">错2次 0</span><span id="wrong3">错3+次 0</span></div></div><input id="jump" class="jump" inputmode="numeric" placeholder="跳到题号"></div><div class="progress"><i id="bar"></i></div></div>
<div class="tabs"><button class="chip active" data-mode="all">顺序刷题</button><button class="chip" data-mode="random">随机刷题</button><button class="chip" data-mode="wrong">当前错题</button><button class="chip" data-mode="wrong1">错1次</button><button class="chip" data-mode="wrong2">错2次</button><button class="chip" data-mode="wrong3">错3+次</button><button class="chip" data-mode="fav">收藏</button></div>
<div class="tools"><button id="exportBtn" class="mini">导出进度</button><button id="importBtn" class="mini">导入进度</button><input id="importFile" type="file" accept="application/json,.json" hidden></div>
<div id="localNote" class="note">正在读取本机进度…</div>
<div class="cloud"><span id="cloudStatus" class="status">云同步：正在检查登录状态…</span><button id="syncBtn" class="mini" hidden>立即同步</button><button id="loginToggle" class="mini">登录 / 注册</button><button id="logoutBtn" class="mini" hidden>退出登录</button></div>
<div id="auth" class="auth"><div class="authgrid"><input id="email" type="email" autocomplete="email" placeholder="邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="密码（至少6位）"></div><div class="authactions"><button id="signin" class="mini">登录</button><button id="signup" class="mini">注册</button><button id="cancelAuth" class="mini">取消</button></div><div class="hint">电脑和手机登录同一个账号即可自动同步。首次注册如要求邮箱确认，请先完成确认再登录。</div></div>
<main id="main"><div class="empty">正在加载题库…</div></main></div>
<div class="toolbar"><div class="toolbarin"><button id="prev" class="btn secondary">‹</button><button id="fav" class="btn secondary">☆ 收藏</button><button id="submit" class="btn">提交答案</button><button id="next" class="btn secondary">›</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let QUESTIONS=[];
const QSRC='https://raw.githubusercontent.com/kjoe111/aliyun-quiz/a93e8897da814d97e3401f9e304183f46044a17f/index.html';
const KEY='aliyun_quiz_mobile_v1',DB='aliyun_quiz_pwa',STORE='state',DKEY='aliyun_quiz_device_id_v1';
const SBURL='https://abeohnmkmtxlhcryxbax.supabase.co',SBKEY='sb_publishable_CHezIU3i81XsoULMhoH7Tw_Yl_8mhBN';
const MODES=['all','wrong','wrong1','wrong2','wrong3','fav','random'];
const DEF={index:0,answers:{},wrong:{},fav:{},mode:'all',randomOrder:[],errorCounts:{},positions:{all:0,wrong:0,wrong1:0,wrong2:0,wrong3:0,fav:0,random:0},favUpdatedAt:{},positionUpdatedAt:{},lastActivityAt:0};
let state=structuredClone(DEF),selected=[],revealed=false,dbp=null,sb=null,user=null,pushTimer=null,syncing=false,suppressPush=false,deviceId='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function loadQuestions(){let r=null;try{if('caches'in window){const c=await caches.open('aliyun-quiz-question-data-v1');r=await c.match(QSRC);if(!r){r=await fetch(QSRC,{cache:'force-cache'});if(r.ok)await c.put(QSRC,r.clone())}}else r=await fetch(QSRC);if(!r||!r.ok)throw Error('题库下载失败');const t=await r.text(),a=t.indexOf('const QUESTIONS='),b=t.indexOf('\nconst KEY=',a);if(a<0||b<0)throw Error('题库格式错误');QUESTIONS=JSON.parse(t.slice(a+16,b).replace(/;\s*$/,''));if(QUESTIONS.length!==750)throw Error('题库数量异常')}catch(e){throw Error('无法加载题库：'+e.message)}}
function openDB(){if(!('indexedDB'in window))return Promise.resolve(null);if(dbp)return dbp;dbp=new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}).catch(()=>null);return dbp}
async function idbGet(){const d=await openDB();if(!d)return null;return new Promise(res=>{const x=d.transaction(STORE,'readonly').objectStore(STORE).get(KEY);x.onsuccess=()=>res(x.result||null);x.onerror=()=>res(null)})}
async function idbSet(v){const d=await openDB();if(!d)return;return new Promise(res=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,KEY);t.oncomplete=()=>res();t.onerror=()=>res()})}
function norm(raw){const s=raw&&typeof raw==='object'?raw:{},x={...structuredClone(DEF),...s};x.answers=x.answers||{};x.wrong=x.wrong||{};x.fav=x.fav||{};x.randomOrder=x.randomOrder||[];x.errorCounts=x.errorCounts||{};x.favUpdatedAt=x.favUpdatedAt||{};x.positionUpdatedAt=x.positionUpdatedAt||{};x.lastActivityAt=Number(x.lastActivityAt)||0;if(!x.positions)x.positions=structuredClone(DEF.positions);MODES.forEach(m=>{if(!Number.isInteger(x.positions[m]))x.positions[m]=0});Object.keys(x.wrong).forEach(id=>{if(!x.errorCounts[id])x.errorCounts[id]=1});x.mode=MODES.includes(x.mode)?x.mode:'all';x.index=Number.isInteger(x.positions[x.mode])?x.positions[x.mode]:0;return x}
async function loadState(){let raw=await idbGet(),src='IndexedDB';if(!raw){try{raw=JSON.parse(localStorage.getItem(KEY)||'null');src=raw?'旧版记录':'新题库'}catch(e){}}state=norm(raw);localSave();$('localNote').textContent='进度已启用本机持久保存（'+src+'）。登录后自动云同步；仍建议偶尔导出备份。'}
function mark(mode=state.mode){const n=Date.now();state.lastActivityAt=n;state.positionUpdatedAt[mode]=n}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}idbSet(state);schedulePush()}
function list(){if(state.mode==='wrong')return QUESTIONS.filter(q=>state.wrong[q.id]);if(state.mode==='wrong1')return QUESTIONS.filter(q=>(+state.errorCounts[q.id]||0)===1);if(state.mode==='wrong2')return QUESTIONS.filter(q=>(+state.errorCounts[q.id]||0)===2);if(state.mode==='wrong3')return QUESTIONS.filter(q=>(+state.errorCounts[q.id]||0)>=3);if(state.mode==='fav')return QUESTIONS.filter(q=>state.fav[q.id]);if(state.mode==='random'){if(state.randomOrder.length!==QUESTIONS.length){state.randomOrder=QUESTIONS.map(q=>q.id).sort(()=>Math.random()-.5);localSave()}return state.randomOrder.map(id=>QUESTIONS[id-1])}return QUESTIONS}
function same(a,b){a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((x,i)=>x===b[i])}
function render(){const l=list(),m=$('main');if(!l.length){m.innerHTML='<div class="empty">这里还没有题目。</div>';stats();return}if(state.index>=l.length)state.index=Math.max(0,l.length-1);const q=l[state.index];selected=[];revealed=false;m.innerHTML=`<section class="card"><div class="meta"><span class="badge">${q.answer.length>1?'多选题':'单选题'}</span><span class="small">第 ${q.id} 题 · ${state.index+1}/${l.length}</span></div><div class="q">${esc(q.question)}</div><div>${Object.entries(q.options).map(([k,v])=>`<button class="option" data-k="${k}"><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}</div><div id="answer" class="answer"><b>正确答案：${q.answer.join('、')}</b><div class="exp">${q.explanation?esc(q.explanation):'原资料未提供解析。'}</div></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b.dataset.k));$('fav').textContent=state.fav[q.id]?'★ 已收藏':'☆ 收藏';$('submit').textContent='提交答案';$('bar').style.width=((state.index+1)/l.length*100)+'%';stats();window.scrollTo({top:0,behavior:'smooth'})}
function choose(k){if(revealed)return;const q=list()[state.index];selected=q.answer.length===1?[k]:(selected.includes(k)?selected.filter(x=>x!==k):[...selected,k]);paint(q)}
function paint(q){document.querySelectorAll('.option').forEach(b=>{const k=b.dataset.k;b.classList.remove('selected','good','bad');if(selected.includes(k))b.classList.add('selected');if(revealed){if(q.answer.includes(k))b.classList.add('good');else if(selected.includes(k))b.classList.add('bad')}});$('answer')?.classList.toggle('show',revealed)}
function submit(){const before=list();if(!before.length)return;const q=before[state.index];if(revealed){goNext();return}if(!selected.length){alert('请先选择答案');return}const ok=same(selected,q.answer);state.answers[q.id]={selected:[...selected],correct:ok,updatedAt:Date.now()};if(ok)delete state.wrong[q.id];else{state.wrong[q.id]=true;state.errorCounts[q.id]=(+state.errorCounts[q.id]||0)+1}const after=list(),still=after.some(x=>x.id===q.id);let resume=still?state.index+1:state.index;if(after.length)resume=Math.min(resume,after.length-1);else resume=0;state.positions[state.mode]=resume;mark();revealed=true;localSave();paint(q);stats();$('submit').textContent='下一题'}
function goNext(){const l=list();if(revealed){state.index=state.positions[state.mode]||0;revealed=false}else if(state.index<l.length-1)state.index++;else if(state.mode==='random'){state.randomOrder=[];state.index=0}state.positions[state.mode]=state.index;mark();localSave();render()}
function goPrev(){if(state.index>0)state.index--;state.positions[state.mode]=state.index;mark();localSave();render()}
function stats(){const a=Object.values(state.answers),c=Object.values(state.errorCounts).map(Number);$('done').textContent='已答 '+a.length;$('correct').textContent='正确 '+a.filter(x=>x.correct).length;$('wrongN').textContent='当前错题 '+Object.keys(state.wrong).length;$('wrong1').textContent='错1次 '+c.filter(n=>n===1).length;$('wrong2').textContent='错2次 '+c.filter(n=>n===2).length;$('wrong3').textContent='错3+次 '+c.filter(n=>n>=3).length}
function status(t,k=''){$('cloudStatus').textContent='云同步：'+t;$('cloudStatus').className='status'+(k?' '+k:'')}
function devId(){try{let x=localStorage.getItem(DKEY);if(!x){x=crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now();localStorage.setItem(DKEY,x)}return x}catch(e){return'dev-'+Date.now()}}
function merge(A,B){const a=norm(A),b=norm(B),m=norm({});m.answers={};new Set([...Object.keys(a.answers),...Object.keys(b.answers)]).forEach(id=>{const x=a.answers[id],y=b.answers[id];m.answers[id]=!x?y:!y?x:(+x.updatedAt||0)>=(+y.updatedAt||0)?x:y});m.errorCounts={};new Set([...Object.keys(a.errorCounts),...Object.keys(b.errorCounts)]).forEach(id=>m.errorCounts[id]=Math.max(+a.errorCounts[id]||0,+b.errorCounts[id]||0));m.wrong={};Object.entries(m.answers).forEach(([id,v])=>{if(v&&!v.correct)m.wrong[id]=true});m.fav={};m.favUpdatedAt={};new Set([...Object.keys(a.fav),...Object.keys(b.fav),...Object.keys(a.favUpdatedAt),...Object.keys(b.favUpdatedAt)]).forEach(id=>{const at=+a.favUpdatedAt[id]||0,bt=+b.favUpdatedAt[id]||0,on=at===0&&bt===0?!!(a.fav[id]||b.fav[id]):at>=bt?!!a.fav[id]:!!b.fav[id];if(on)m.fav[id]=true;m.favUpdatedAt[id]=Math.max(at,bt)});m.positions=structuredClone(DEF.positions);m.positionUpdatedAt={};MODES.forEach(md=>{const at=+a.positionUpdatedAt[md]||+a.lastActivityAt||0,bt=+b.positionUpdatedAt[md]||+b.lastActivityAt||0;m.positions[md]=at>=bt?(+a.positions[md]||0):(+b.positions[md]||0);m.positionUpdatedAt[md]=Math.max(at,bt)});const an=(+a.lastActivityAt||0)>=(+b.lastActivityAt||0);m.mode=an?a.mode:b.mode;m.randomOrder=an?a.randomOrder:b.randomOrder;m.lastActivityAt=Math.max(+a.lastActivityAt||0,+b.lastActivityAt||0);m.index=m.positions[m.mode]||0;return norm(m)}
function schedulePush(){if(suppressPush||!user)return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,700)}
async function pushNow(){if(!sb||!user)return false;try{status('正在上传…');const{error}=await sb.from('quiz_progress').upsert({user_id:user.id,state,device_id:deviceId},{onConflict:'user_id'});if(error)throw error;status('已同步 · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),'ok');return true}catch(e){status('上传失败：'+e.message,'err');return false}}
async function syncNow(){if(!sb||!user||syncing)return;syncing=true;status('正在同步…');try{const{data,error}=await sb.from('quiz_progress').select('state').eq('user_id',user.id).maybeSingle();if(error)throw error;if(data?.state){suppressPush=true;state=merge(state,data.state);await idbSet(state);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}suppressPush=false;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.mode===state.mode));render()}await pushNow()}catch(e){status('同步失败：'+e.message,'err')}finally{syncing=false}}
function authUI(){const on=!!user;$('loginToggle').hidden=on;$('logoutBtn').hidden=!on;$('syncBtn').hidden=!on;if(on)status('已登录 '+(user.email||''))}
async function initCloud(){deviceId=devId();if(!window.supabase?.createClient){status('同步组件加载失败，请联网刷新','err');return}sb=window.supabase.createClient(SBURL,SBKEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const{data}=await sb.auth.getSession();user=data?.session?.user||null;authUI();sb.auth.onAuthStateChange((ev,s)=>{user=s?.user||null;authUI();if(user&&(ev==='SIGNED_IN'||ev==='TOKEN_REFRESHED'))setTimeout(syncNow,0)});if(user)await syncNow();else status('未登录，本机进度仍会保存')}
async function signIn(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return alert('请输入邮箱和密码');status('正在登录…');const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return alert('登录失败：'+error.message);user=data.user;$('auth').classList.remove('show');authUI();await syncNow()}
async function signUp(){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6)return alert('请输入有效邮箱，密码至少6位');status('正在注册…');const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return alert('注册失败：'+error.message);if(data.session){user=data.user;$('auth').classList.remove('show');authUI();await syncNow()}else{status('请查收确认邮件');alert('注册成功。请先到邮箱完成确认，然后回到本页面登录。')}}
async function signOut(){await pushNow();await sb.auth.signOut();user=null;authUI();status('已退出，本机进度仍保留')}
function exportState(){const b=new Blob([JSON.stringify({app:'阿里云刷题题库',version:5,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='阿里云刷题进度_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function importState(f){try{const o=JSON.parse(await f.text()),x=o.state||o;if(!x||typeof x!=='object')throw Error();state=norm(x);state.lastActivityAt=Date.now();await idbSet(state);try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.mode===state.mode));render();schedulePush();alert('进度恢复成功')}catch(e){alert('无法导入：进度文件格式不正确')}}
$('submit').onclick=submit;$('next').onclick=goNext;$('prev').onclick=goPrev;$('fav').onclick=()=>{const q=list()[state.index];if(!q)return;state.fav[q.id]=!state.fav[q.id];if(!state.fav[q.id])delete state.fav[q.id];state.favUpdatedAt[q.id]=Date.now();mark();localSave();render()};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');state.mode=c.dataset.mode;state.index=state.positions[state.mode]||0;mark();localSave();render()});
$('jump').onchange=e=>{const n=parseInt(e.target.value);if(n>=1&&n<=QUESTIONS.length){state.mode='all';state.index=n-1;state.positions.all=state.index;mark('all');document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.mode==='all'));localSave();render()}e.target.value=''};
$('exportBtn').onclick=exportState;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{const f=e.target.files?.[0];if(f)importState(f);e.target.value=''};$('loginToggle').onclick=()=>$('auth').classList.toggle('show');$('cancelAuth').onclick=()=>$('auth').classList.remove('show');$('signin').onclick=signIn;$('signup').onclick=signUp;$('logoutBtn').onclick=signOut;$('syncBtn').onclick=syncNow;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&user)syncNow()});window.addEventListener('online',()=>{if(user)syncNow()});
(async()=>{try{if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});await loadQuestions();await loadState();document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.mode===state.mode));render();await initCloud()}catch(e){$('main').innerHTML='<div class="empty">'+esc(e.message||'加载失败')+'<br><br>请联网后刷新页面。</div>';status('初始化失败','err')}})();
</script></body></html>
