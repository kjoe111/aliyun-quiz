.com/document_detail/31818.html"},{"id":249,"question":"对象存储服务 OSS 适合于以下哪些应用场景?       （）。","options":{"A":"应用的动静分离","B":"运行动态网站","C":"海量文件存储","D":"数据下载加速","E":"大数据分析"},"answer":["A","C","D","E"],"explanation":"对象存储服务 OSS 是一种云存储服务，它适合于应用的动静分离、海量文件存储、数据下载加速和大 数据分析等应用场景。对于运行动态网站，一般需要更复杂的服务器和数据库支持，而不仅仅是存储服务， 因此这个选项不正确。"},{"id":250,"question":"IT 系统的风控构成按照等保的划分维度，包括哪几个?（）(正确 4 个)","options":{"A":"物理和环境安全","B":"地域和选址安全","C":"网络和通信安全","D":"设备和计算安全","E":"应用和数据安全","F":"团队意识安全"},"answer":["A","C","D","E"],"explanation":"解析："},{"id":251,"question":"在 Linux 服务器上使用“adduserd -d/var/www/html siteadmin”新增一个用户后，必须进行什么操作 才能使 siteadmin 远程 SSH 登录?（）","options":{"A":"为 site admin 设置一个密码","B":"分配必要的目录权限","C":"设置磁盘限额","D":"安装好 Apache"},"answer":["A"],"explanation":"解析： 新增用户没有密码，是不能登录的"},{"id":252,"question":"如果你选择将网站发布到中国大陆区域内的云服务器 ECS 上，并通过域名能访问到你的网站，以下属于 网站上线前的必要步骤的是（）。","options":{"A":"获得 ICP 备案号","B":"云服务器 ECS 里必须安装 Apache","C":"注册一个.xin 域名","D":"将域名解析到云服务器 ECS 的外网 IP"},"answer":["A","D"],"explanation":"网站上线前需要获得 ICP 备案号和将域名解析到云服务器 ECS 的外网 IP"},{"id":253,"question":"使用阿里云控制台可以便捷地对 ECS 进行管理，如果想要重启华东 2 地域的一台 ECS 实例，在控制台的 操作步骤包括哪几步？（）","options":{"A":"选择华东 2 地域","B":"找到该 ECS 实例，进行相关操作","C":"进入 ECS 控制台","D":"输入 ECS 的登录密码"},"answer":["B","C"],"explanation":"题目提示使用阿里云控制台，要想使用阿里云控制台，首先需要登录阿里云控制台，然后找到对应的 地区，在对应的地区找到该实例。"},{"id":254,"question":"阿里云云服务器 ECS 位于”云端”，但是用户可以完全掌控自己的 ECS，以下哪几项体现了阿里云支持 用户掌控自己的 ECS? （）","options":{"A":"用户可以自主选定自己的 ECS 所处的位置，即地域与可用区，阿里云不会擅自更改","B":"用户可以通过控制台实时掌握自己 ECS 的运行状态","C":"用户可以通过终端远程连接 ECS，对 ECS 所做的所有操作完全自主决定","D":"用户可以自主选定自己的 ECS 所处的位置，即地域与可用区，用户可以在控制台随时进行更改"},"answer":["A","B","C"],"explanation":"用户可以自主选定自己的 ECS 所处的位置，即地域与可用区，一旦选择后，不可以在控制台更改。"},{"id":255,"question":"阿里云 ECS 最重要的特点是弹性，若发现某 ECS (windows 2008)下挂载的磁盘空间不够，可以添加一块 新的磁盘，需要进行哪些操作？（）","options":{"A":"将新购买的磁盘挂载到 ECS 实例上","B":"对磁盘进行格式化","C":"重启 ECS 实例","D":"重新挂载原有磁盘"},"answer":["A","C"],"explanation":"对磁盘进行格式化会造成数据丢失。重新挂载原有磁盘并不会改变磁盘容量大小"},{"id":256,"question":"DNS 常用解析记录有哪些？","options":{"A":"A 记录","B":"B 记录","C":"NS 记录","D":"CNAME 记录"},"answer":["A","C","D"],"explanation":"云解析 DNS 目前支持下列记录类型     A 记录 （可实现将域名指向 IP 地址） CNAME 记录（可实现将 域名指向另一个域名） MX 记录（用于电子邮件系统发邮件时根据收信人的地址后缀来定位邮件服务器） AAAA 记录（可实现将域名指向 IPV6 地址） TXT 记录（文本记录） NS 记录（可实现把子域名交给其他 DNS 服务商提供解析服务） SRV 记录（服务定位器） CAA 记录（认证机构授权） 云解析 DNS 除了上述记录类型， 还提供 URL 隐性/显性转发服务，可以实现将一个域名指向到另外一个已存在的站点。"},{"id":257,"question":"下面哪种不是阿里云云服务器 ECS 中系统盘的存储类型?","options":{"A":"本地盘","B":"普通云盘","C":"高效云盘","D":"ESSD 云盘"},"answer":["A"],"explanation":"阿里云服务器 ECS 系统盘类型分为高效云盘、SSD 云盘和 ESSD 云盘，系统盘大小和云盘类型无关，与 云服务器操作系统有关，不同操作系统下系统盘存储容量大小如下："},{"id":258,"question":"阿里云弹性伸缩服务 ESS 可以根据业务的变化进行自动调整，可以调整云服务器 ECS 的内容是?","options":{"A":"vCPU","B":"内存","C":"公网带宽","D":"数量"},"answer":["D"],"explanation":"弹性伸缩服务 ESS 只能调整 ECS 的数量"},{"id":259,"question":"阿里云 PolarDB MySQL 需使用账户连接数据库，在创建账户时，可以作为账户名的是（）。","options":{"A":"admin","B":"test","C":"root","D":"abc_1"},"answer":["D"],"explanation":"admin、test、root 是默认账户。填写账号名称，名称需满足如下要求： 账号名称长度为 4~20 位。 以字母开头，由大写字母、小写字母、数字、下划线组成。 https://developer.aliyun.com/article/797923?spm=5176.21213303.J_6704733920.7.198a53c910MrZZ&sc m=20140722.S_community%40%40%E6%96%87%E7%AB%A0%40%40797923._.ID_community%40%40%E6%96%87%E7%AB %A0%40%40797923-RL_PolarDB%20%20%20%E5%88%9B%E5%BB%BA%E8%B4%A6%E6%88%B7-LOC_main-OR_ser-V_2- P0_0"},{"id":260,"question":"下面关于阿里云内容分发网络 CDN 的描述中，错误的是?","options":{"A":"CDN 可以将内容缓存至用户更近节点上，提高用户体验","B":"不支持负载均衡 SLB 做源站地址","C":"结合对象存储 OSS，可以降低对象存储 OSS 外网流量","D":"结合云服务器 ECS，提高网站服务可用性"},"answer":["B"],"explanation":"CDN 支持负载均衡 SLB 做源站地址"},{"id":261,"question":"下列云数据库 RDS 支持存储类型中，可以有效降低 I/O 延时的是?","options":{"A":"本地 SSD 盘","B":"SSD 云盘","C":"ESSD 云盘","D":"高效云盘"},"answer":["A"],"explanation":"选 A。本地 SSD 盘是指与数据库引擎位于同一节点的 SSD 盘。将数据存储于本地 SSD 盘，可以降低 I/O 延时。https://help.aliyun.com/document_detail/69795.html"},{"id":262,"question":"阿里云云监控服务可以针对资源的指标设置报警。报警信息可以通过多种方式发送给管理员，不包含的 是?","options":{"A":"E-mail","B":"手机","C":"钉钉","D":"支付宝"},"answer":["D"],"explanation":"没有支付宝。发送报警通知的方式。包括：电话、短信、邮件、钉钉机器人。"},{"id":263,"question":"阿里云云监控中使用自定义查看监控数据的功能，需要用到的功能组件是?","options":{"A":"Dashboard","B":"主机监控","C":"事件监控","D":"日志监控"},"answer":["A"],"explanation":"Dashboard 为您提供自定义查看监控数据的功能。您可以在一个监控大盘中跨云服务、跨实例查看监 控数据。"},{"id":264,"question":"在阿里云中为了提高业务的可用性，可以将资源放置在同地域的不同可用区下，在使用 VPC 的时候，基 于可用区创建的是?","options":{"A":"路由器","B":"交换机","C":"防火墙","D":"安全组"},"answer":["A"],"explanation":"路由器，不同可用区需要使用路由器，交换器一般在同一个可用区内。"},{"id":265,"question":"管理员创建阿里云弹性伸缩服务 ESS 时，不需要包含的内容是（）。","options":{"A":"伸缩配置","B":"伸缩活动","C":"伸缩任务","D":"伸缩规则"},"answer":["B"],"explanation":"一般步骤就是创建伸缩组-伸缩配置-启用伸缩组-伸缩规则等，没有伸缩活动。"},{"id":266,"question":"包台云服务器 ECS 实例系统盘的数量最大是?","options":{"A":"0","B":"1","C":"16","D":"不限"},"answer":["B"],"explanation":"系统盘类似 Windows 系统的 C 盘，主要装系统文件用的，系统盘只能有 1 个；"},{"id":267,"question":"在 Linux 系统的云服务器 ECS 中格式化数据盘的时候，如果该数据盘需要在其他系统(Windows、MAC） 中进行使用，那么格式化的时候可以选择文件系统类型是?","options":{"A":"vfat","B":"ext2","C":"xfs","D":"ntfs"},"answer":["D"],"explanation":"ntfs 可以在 linux 和 windows 兼容"},{"id":268,"question":"阿里云对象存储 OSS 可以提供对外服务的访问域名，这个访问域名被称为?","options":{"A":"Bucket","B":"AccessPoint","C":"Endpoint","D":"AccessKey"},"answer":["C"],"explanation":"Endpoint 表示 OSS 对外服务的访问域名。OSS 以 HTTP RESTful API 的形式对外提供服务，当访问不 同的 Region 的时候，需要不同的域名。通过内网和外网访问同一个 Region 所需要的 Endpoint 也是不同的。 例如杭州 Region 的外网 Endpoint 是 oss-cn-hangzhou.aliyuncs.com，内网 Endpoint 是 oss-cn-hangzhou- internal.aliyuncs.com。 https://help.aliyun.com/document_detail/31947.html"},{"id":269,"question":"DDoS 攻击是网络中常见的攻击手段，下面情况属于 DDoS 攻击的是?","options":{"A":"服务器 CPU 和内存占用率增大","B":"网络出入放行流量激增","C":"服务器密码被破解","D":"网站出现大量未知访问"},"answer":["A","B","D"],"explanation":"凡是利用网络安全防护措施不足 导致用户不能继续使用正常服务的攻击手段,都可以被称为是拒绝服 务攻击 C 是暴力破解，不是 DDOS 攻击"},{"id":270,"question":"创建阿里云 PolarDB MySQL 数据库后，想连接并管理该数据库可以使用的方法或工具有?","options":{"A":"DMS","B":"DTS","C":"MySQL 客户端工具","D":"MySQL 客户端命令"},"answer":["A","C","D"],"explanation":"DTS 是数据传输服务，不是管理数据库的工具。"},{"id":271,"question":"创建阿里云专有网络 VPC 时，需要首先规划私网网段。下面属于阿里云推荐网段的是?","options":{"A":"192.16.1.0/24","B":"172.25.0.0/24","C":"172.32.1.0/24","D":"10.3.1.0/24","E":"192.168.1.0/24"},"answer":["A","D","E"],"explanation":"192.168.0.0/16 可用私网 IP 数量（不包括系统保留地址）：65,532172.16.0.0/12 可用私网 IP 数 量（不包括系统保留地址）：1,048,57210.0.0.0/8 可用私网 IP 数量（不包括系统保留地址）： 16,777,212 自定义地址段 除 100.64.0.0/10、224.0.0.0/4、127.0.0.0/8、169.254.0.0/16 及其子网外的 自定义地址段"},{"id":272,"question":"下列关于阿里云中地域（Region）和可用区(Zone)的说法中，正确的是?","options":{"A":"一个地域可以包含多个可用区","B":"可用区是基于地理位置进行划分，不同可用区之间必须通过公网进行互联","C":"地域之间是通过阿里云内网进行互联","D":"地域之间网络资源是隔离的，必须通过公网连接才能实现跨地域的通信"},"answer":["A","D"],"explanation":"B 错，不同可用区可以是同一个地域的。地域之间内网是不通的。所以 C 也是错的。"},{"id":273,"question":"在 Windows 操作系统的阿里云云服务器 ECS 中，对新挂载的数据盘进行分区管理操作时，可以执行的操 作是?","options":{"A":"运行 diskmgmt.msc 命令","B":"运行 compmgmt.msc 命令","C":"打开计算机管理器","D":"打开磁盘管理"},"answer":["A","D"],"explanation":"运行 compmgmt.msc 命令是计算机管理，C 只是打开计算机管理器，也不是。"},{"id":274,"question":"OSS 对象存储服务的副本说法错误的是","options":{"A":"副本会存储在不同的区域 Region 下","B":"副本会通过 CDN 同步到全网","C":"副本默认为 3 副本","D":"副本在相同 zone 下"},"answer":["A","B"],"explanation":"副本一般不会直接使用 CDN。默认是在相同的 ZONE 下。副本默认为三副本存储"},{"id":275,"question":"阿里云弹性伸缩 ess 可以根据业务情况自动调整。下面属于弹性伸缩 ess 伸缩模式的有?","options":{"A":"定时模式","B":"响应模式","C":"动态模式","D":"健康模式"},"answer":["A","C","D"],"explanation":"1、固定数量模式：如果您在伸缩组设置了最小实例数，当伸缩组的 ECS 实例数量低于最小实例数时， 伸缩组会自动添加 ECS 实例，使得伸缩组内的 ECS 实例数量等于最小实例数。 如果您在伸缩组设置了最大 实例数，当伸缩组的 ECS 实例数量超过最大实例数时，伸缩组会自动移出 ECS 实例，使得伸缩组内的 ECS 实 例数量等于最大实例数。 如果您创建伸缩组时设置期望实例数，伸缩组会自动将 ECS 实例数量维持在期望 实例数。 2、健康模式：如果您在伸缩组开启健康检查功能，伸缩组会定期检查 ECS 实例的运行状态，如果 发现一台 ECS 实例未处于运行中状态，则判定该 ECS 实例为不健康实例并移出。 3、定时模式：您可以创建 定时任务，在指定时间执行指定伸缩规则。 4、自定义模式：您可以手动进行弹性伸缩，包括手动执行伸缩 规则，或者手动添加、移出或者删除已有的 ECS 实例。 5、动态模式：您可以基于云监控性能指标（例如 CPU 使用率）创建报警任务，当伸缩组的指标数据满足您指定的报警条件（例如伸缩组内所有 ECS 实例的 CPU 平均值大于 60%）时，触发报警并执行您指定的伸缩规则。 参考链接： https://help.aliyun.com/document_detail/25879.html"},{"id":276,"question":"下列关于负载均衡 SLB 相关概念描述中，正确的是?","options":{"A":"负载均衡实例运行负载均衡服务","B":"一个负载均衡实例只能开启一个监听","C":"后端服务器可以处理前端请求","D":"主备服务器组中只包含两台云服务器 ECS 实例"},"answer":["A","C"],"explanation":"一个负载均衡实例是一个运行的负载均衡服务 B 错一个负载均衡实例可以添加多个监听和后端服务器 D 错，可以是多台 ECS 实例"},{"id":277,"question":"阿里云弹性伸缩服务 ESS 可以根据伸缩规则来创建或删除云服务器 ECS。下面关于 ESS 创建的云服务器 ECS 说法中,正确的是?","options":{"A":"云服务器 ECS 的 IP 地址会相同","B":"如果伸缩组中指定了云数据库 RDS 实例，云服务器 ECS 会自动添加至云数据库 RDS 白名单","C":"云服务器 ECS 的 vCPU 和内存可能会不同","D":"如果伸缩组指定了负载均衡 SLB 实例，云服务器 ECS 会自动添加至负载均衡 SLB 中"},"answer":["B","D"],"explanation":"ECS 的 IP 地址不能是相同的。ECS 自动添加到 RDS 中。如果伸缩组关联负载均衡实例，ECS 会自动添 加到负载均衡 SLB 中。一个伸缩配置支持多选 ECS 实例规格。"},{"id":278,"question":"您在阿里云对象存储 OSS 中，创建一个存储空间 Bucket 的权限为公共读。通过对象存储 OSS 管理控制 台，上传对象文件至该存储空间后，该对象文件的权限应该是?","options":{"A":"私有","B":"公共读","C":"公共读写","D":"没有权限,必须手动设置后才能让用户访问"},"answer":["B"],"explanation":"只有该存储空间的创建者可以对该存储空间内的文件进行写操作，任何人（包括匿名访问）可以对该 存储空间中的文件进行读操作"},{"id":279,"question":"在阿里云中创建了一台 Windows Server 2016 的云服务器 ECS，默认登录的管理员用户是?","options":{"A":"admin","B":"root","C":"sa","D":"administrator"},"answer":["D"],"explanation":"Windows server 2008 及其他版本的 Windows 服务器默认账号一般为：Administrator"},{"id":280,"question":"阿里云负载均衡 SLB 支持多种不同负载均衡算法来适应不同的场景，负载均衡 SLB 不支持的算法是?","options":{"A":"轮询","B":"加权轮询","C":"最小连接数","D":"加权最小连接数"},"answer":["C"],"explanation":"https://help.aliyun.com/document_detail/196874.html?spm=a2c4g.85995.0.0.44b67101yztGz6 调度算法：支持加权轮询、加权最小连接数、源 IP 哈希、四元组哈希、一致性哈希和 QUIC ID 哈希等调度 算法，可根据自身需求选择相应算法来分配用户流量。"},{"id":281,"question":"负载均衡 SLB 的监听协议中默认以加密方式来传输数据的是?","options":{"A":"TCP","B":"uDP","C":"HTTP","D":"HTTPS"},"answer":["D"],"explanation":"加密的为 https"},{"id":282,"question":"负载均衡 SLB 支持通过端口方式进行设置。HTTPS 的网站设置负载均衡时，默认需要配置的端口号是 （）。","options":{"A":"22","B":"80","C":"443","D":"3306"},"answer":["C"],"explanation":"https 端口:443"},{"id":283,"question":"专有网络 VPC 不需要使用时可以删除掉，下面关于专有网络 VPC 的说法中正确的是?","options":{"A":"VPC 管理的路由器可以给其他 VPC 使用","B":"VPC 关联的路由表可以保留,再次创建 VPC 的时候可以沿用之前路由表","C":"VPC 不能被删除","D":"VPC 下不能含有交换机否则会删除失败"},"answer":["D"],"explanation":"VPC 删除前路由器、交换机等都要先删除"},{"id":284,"question":"当使用 fdisk 命令对云服务器 ECS 中云盘进行分区时，查看当前磁盘的分区表信息可以使用的命令是?","options":{"A":"a","B":"n","C":"t","D":"p"},"answer":["D"],"explanation":"p ：显示分区信息"},{"id":285,"question":"阿里云提供多种云盘供用户进行选择，不同类型的云盘性能和架构都有差异。下列云盘类型中性能最高 的是?","options":{"A":"ESSD 云盘","B":"SSD 云盘","C":"高效云盘","D":"普通云盘"},"answer":["A"],"explanation":"一般主要区别就是价格差异，还有读写 IO 性能差异，一般来说的话 ESSD 云盘>SSD 云盘>高效云盘， 价格贵的读写性能好。一般而言的话，高效云盘基本已经是可以满足我们的日常建站需求的了。            esdd 云 盘是为大型数据库配置的，普通用户使用的机会比较少，我们主要考虑高效云盘和 sdd 云盘就可以了。 sdd 云盘的适用场景   ●I/O 密集型应用   ●中小型关系数据库   ●NoSQL 数据库 高效云盘使用场 景    ●开发与测试业务     ●系统盘   ●数据不被经常访问或者低 I/O 负载的应用场景   ●需要低成 本并且有随机读写 I/O 的应用环境"},{"id":286,"question":"弹性伸缩服务 ESS 配置的规则为最小实例数是 8 台，最大实例数是 15 台。设置的伸缩规则为增加 5 台 云服务器 ECS，当前弹性伸缩服务 ESS 中实例数量为 2 台。如果立刻启用了该伸缩规则，加入到该伸缩组中 云服务器 ECS 的数量是?","options":{"A":"0","B":"5","C":"6","D":"13"},"answer":["C"],"explanation":"弹性伸缩服务 ESS 配置的规则为最小实例数是 8 台。弹性自愈：对业务量稳定的应用程序，可以用到 弹性自愈：弹性伸缩提供健康检查功能，自动监控伸缩组内的 ECS 实例的健康状态，避免伸缩组内健康 ECS 实例低于设置的最小值"},{"id":287,"question":"阿里云弹性伸缩可以根据业务的情况调整服务资源。如果选择弹性伸缩模式为动态模式，需要配合下列 哪种阿里云服务?","options":{"A":"云安全管家","B":"云数据库 RDS","C":"对象存储 OSS","D":"云监控"},"answer":["D"],"explanation":"动态模式：基于云监控性能指标如 CPU 利用率，自动增加或减少 ECS 实例"},{"id":288,"question":"DDoS 攻击分为多种攻击类型，下列不属于常见 DDoS 攻击类型的是（）。","options":{"A":"传输层 DDoS 攻击","B":"物理层 DDoS 攻击","C":"DNS DDoS 攻击","D":"Web 应用层 DDoS 攻击"},"answer":["B"],"explanation":"畸形报文、传输层 DDoS 攻击、DNS DDoS 攻击、Web 应用层 DDoS 攻击"},{"id":289,"question":"用户想要了解阿里云中云服务器 ECS 的状态以及日志等信息，可以使用的阿里云组件是?","options":{"A":"云监控","B":"云安全中心","C":"云安全防火墙","D":"云安全公告"},"answer":["A"],"explanation":"云监控用于监控各云服务资源的监控指标，探测云服务 ECS 和运营商站点的可用性，并针对指定监控 指标设置报警。使您全面了解阿里云上资源的使用情况和业务运行状况，并及时对故障资源进行处理，保证 业务正常运行。"},{"id":290,"question":"下列关于阿里云云数据库 RDS 的说法中,正确的是?","options":{"A":"仅支持包年包月的购买方式,购买时间越长,折扣越多","B":"可以增加云数据库 RDS 节点,实例规格不可升级","C":"用户只需要使用云数据库 RDS 即可,数据备份阿里云会自动完成","D":"云数据库 RDS 的补丁升级由阿里云负责,用户不需要关心"},"answer":["C"],"explanation":"可提供最多 2 倍存储空间大小的免费备份空间。"},{"id":291,"question":"阿里云 PolarDB 数据库分为 Writer 节点(主节点)和 Reader 节点(读节点)。一个 PolarDB 集群最多可以 拥有主节点的数量是（）。","options":{"A":"1","B":"2","C":"15","D":"16"},"answer":["A"],"explanation":"阿里云 PolarDB 数据库的设计中，一个 PolarDB 集群只能有一个 Writer 节点（主节点），用于处理 写入请求，而 Reader 节点（读节点）可以有多个，用于处理读取请求。因此，一个 PolarDB 集群最多可以 拥有的主节点数量是 1。"},{"id":292,"question":"下列关于创建云盘的说法中错误的是（）。","options":{"A":"云服务器 ECS 不支持单独创建系统盘","B":"不支持多块云盘的合并,创建时候需要规划好空间","C":"创建的按量付费云盘不支持转换为包年包月计费方式","D":"使用 LVM 方式管理多块云盘,不建议创建快照,可能会导致数据差异"},"answer":["C"],"explanation":"可以支持转成包年包月。 https://help.aliyun.com/document_detail/58666.html?source=5176.11533457&userCode=34bl8qrv&type =copy"},{"id":293,"question":"下面关于专有网络 VPC 和交换机 Vswitch 的说法中,错误的是?","options":{"A":"云服务器 ECS 可以部署在 VPC 中","B":"云服务器 ECS 可以直接部署在交换机中","C":"VPC 中必须创建交换机才能给云资源使用","D":"VPC 内交换机默认是互通的"},"answer":["A"],"explanation":""},{"id":294,"question":"Linux 操作系统的云服务器 ECS 支持密钥对的认证方式,如果选择密钥对的认证方式后，下载私钥文件的 后缀是?","options":{"A":".pem","B":".crt","C":".key","D":".rsa"},"answer":["A"],"explanation":"Linux 云服务器 ECS 选择秘钥对的认证，认证后缀名为：.pem"},{"id":295,"question":"下面关于阿里云块存储云盘的容量性能指标的说法中，错误的是?","options":{"A":"容量是指存储空间的大小","B":"块存储容量按照二进制单位进行计算","C":"容量无法衡量块存储性能,容量大小对于块存储性能没有影响","D":"容量是采用 1024 进位进行计算"},"answer":["C"],"explanation":"C 错。“容量无法衡量块存储性能,但是会影响块存储的性能,对于存储设备而言,不同的容量能达到的 性能不同,容量越大,存储设备的数据处理能力越强。”"},{"id":296,"question":"用户在自己公司中无法连接阿里云云服务器 ECS,不可能的原因是?","options":{"A":"安全组中没有添加相应的访问规则","B":"ECS 没有可用的公网 IP","C":"ECS 所在地域(Region)和客户所在地区不同","D":"ECS 实例没有开机"},"answer":["C"],"explanation":"ECS 所在地域(Region)和客户所在地区不同对访问没有影响，正常都是走公网"},{"id":297,"question":"阿里云块存储 I/O 大小为 16K,IOPS 最大值为 20000，此磁盘的吞吐量大约为?","options":{"A":"10OMB/S","B":"260MB/S","C":"320MB/S","D":"640MB/S"},"answer":["C"],"explanation":"吞吐量 = IOPS * I/O 大小"},{"id":298,"question":"阿里云对象存储 OSS 可以通过控制台上传对象文件，上传的对象文件最大是?","options":{"A":"1GB","B":"5GB","C":"10GB","D":"无限制"},"answer":["B"],"explanation":"可以通过 OSS 控制台上传不超过 5 GB 大小的文件"},{"id":299,"question":"下列对于阿里云对象存储 OSS 的操作中，会收取流量费用的是?","options":{"A":"用户在公司中上传文件至 OSS","B":"用户在公司下载 OSS 中文件","C":"ECS 通过内网上传文件至 OSS","D":"ECS 通过内网下载 OSS 中文件"},"answer":["B"],"explanation":"上传不收费，内网上传、下载不收费"},{"id":300,"question":"创建一台以 SSD 云盘为系统盘的阿里云云服务器 ECS 后，在该云服务器 ECS 中增加数据盘时,可以选择 的类型有?","options":{"A":"SSD 本地盘","B":"SATA HDD 本地盘","C":"高效云盘","D":"普通云盘"},"answer":["A","C","D"],"explanation":"SATA HDD 本地盘这是物理盘，没有在云盘可选的类型中"},{"id":301,"question":"创建一个阿里云 PolarDB MySQL 集群后，连接该集群时，需要输入用户和密码。关于该集群的用户和密 码的说法中,正确的有?","options":{"A":"用户可以使用 root 进行连接","B":"高权限用户可以通过控制台创建","C":"高权限用户可以通过 SQL 语句创建","D":"普通用户可以通过控制台创建","E":"普通用户可以通过 SQL 语句创建"},"answer":["B","D","E"],"explanation":"不提供 root； 高权限只能通过控制台创建和管理； 一个集群只能有一个高权限账号，可以管理集群 中所有的普通账号和数据库； 可以创建数据库和普通账号，并且把某个数据库授权给某个普通账号，从而 使该普通账号有权限在该数据库中进行增删改查； 开放了更多权限，可满足个性化和精细化的权限管理需 求，例如可为不同用户分配不同表的查询权限； 可以断开任意账号的连接； 普通权限：可以通过控制台或 者 SQL 语句创建和管理。 一个集群可以创建多个普通账号，具体的数量与数据库内核有关。 无创建数据库 和普通账号的权限，只能管理被授权的数据库。 不能管理其他账号，也不能断开其他账号的连接。"},{"id":302,"question":"阿里云云安全中心分为多个不同版本，不同版本支持的保护功能项也有区别。下面属于基础版提供的检 查项有?","options":{"A":"主机异常登录","B":"漏洞修复","C":"漏洞检测","D":"病毒查杀"},"answer":["A","C"],"explanation":"免费版（云安全中心免费版简介） 免费为您提供基础的安全加固能力，可检测服务器异常登录、 DDoS 攻击、服务器主流类型的漏洞以及云产品安全配置。您在购买 ECS 实例时选择安全加固即可开通免费版。 云安全支持 7 天免费试用旗舰版功能。只有购买了 ECS 实例并且以前未试用过云安全中心的用户，才可以免 费试用旗舰版的功能。如果您已具有试用资格，在登录云安全中心控制台后，会有弹窗提示您已获得云安全 中心旗舰版 7 天免费试用资格。 防病毒版 采用包年包月的计费方式，提供安全告警、病毒防御等服务。 高级版 采用包年包月的计费方式，提供安全告警、病毒防御、漏洞检测及修复、安全报告等服务。 企业版 采用包年包月的计费方式，提供安全告警、病毒防御、漏洞检测及修复、基线检查、资产指纹、攻击分析等 全面的安全服务。 旗舰版 采用包年包月的计费方式，提供镜像安全扫描、容器 K8s 威胁检测、容器网络拓 扑、安全告警、病毒防御、漏洞检测及修复、基线检查、资产指纹、攻击分析等全面的安全服务。"},{"id":303,"question":"可以使用阿里云对象存储 OSS 来实现的场景有?","options":{"A":"海量视频","B":"游戏 APP 软件包","C":"员工信息表","D":"海量图片"},"answer":["A","B","D"],"explanation":"OSS 可用于图片、音视频、日志等海量文件的存储。各种终端设备、Web 网站程序、移动应用可以直 接向 OSS 写入或读取数据。"},{"id":304,"question":"当用户不再需要负载均衡 SLB 的时候，可以将其删除节约费用。下面关于负载均衡 SLB 删除的说法中, 正确的是?","options":{"A":"删除负载均衡 SLB 会自动删除后端服务器","B":"负载均衡 SLB 删除后,后端服务器仍然可以对外提供访问服务","C":"删除后，负载均衡 SLB 实例会进入回收站，管理员可以找回该实例","D":"只能删除按量付费的负载均衡 SLB 实例，包年包月到期时，会自动释放"},"answer":["B","D"],"explanation":"释放 CLB 实例不会影响后端 ECS 的运行。您可以根据需要释放 ECS。 删除负载均衡实例不会删除后端 ECS，也不会影响后端 ECS 的运行。 只能释放按量付费的负载均衡实例。包年包月的预付费实例在到期后若 未按时续费会自动释放。 按量计费（后付费）实例释放不会进入回收站。 https://help.aliyun.com/document_detail/86453.html"},{"id":305,"question":"下列选项中，与阿里云弹性伸缩服务 ESS 相关的有?","options":{"A":"伸缩组","B":"伸缩规则","C":"监听","D":"后端服务器"},"answer":["A","B"],"explanation":"监听和后端服务器是 SLB 相关的"},{"id":306,"question":"当用户在阿里云中删除一个负载均衡 SLB 实例时，（）信息不会被删除。","options":{"A":"负载均衡 SLB 实例","B":"监听配置","C":"负载均衡 SLB 中固定公网 IP","D":"后端服务器"},"answer":["D"],"explanation":"在阿里云中删除一个负载均衡 SLB 实例,只会删除 SLB 本身的配置，包括负载均衡 SLB 实例，监听配 置，负载均衡 SLB 中固定公网 IP 等。不会影响后端服务器。"},{"id":307,"question":"下面关于阿里云中负载均衡 SLB 的说法中,正确的是?","options":{"A":"后端服务器操作系统必须相同","B":"后端服务器的公网带宽不会影响负载均衡 SLB 对外服务能力","C":"后端服务器只能提供单网站服务","D":"负载均衡 SLB 使用过程中，可以调整后端服务器的数量"},"answer":["B","D"],"explanation":"后端服务器操作系统可以不同 后端服务器只能提供单网站服务：可以是任何应用"},{"id":308,"question":"创建阿里云弹性伸缩服务 ESS 时，需要创建一个伸缩组，其中包含的内容主要有?","options":{"A":"伸缩触发任务","B":"伸维配置","C":"伸缩规则","D":"伸缩活动"},"answer":["A","B","C"],"explanation":"创建阿里云弹性伸缩服务 ESS 时，需要创建一个伸缩组，其中包含的内容主要有伸缩触发任务，伸缩 配置和伸缩规则"},{"id":309,"question":"下面关于删除存储空间 Bucket 的说法中,正确的是?","options":{"A":"Bucket 不能含有文件","B":"可以通过设置生命周期删除存储空间内所有文件","C":"OSS 管理控制台不能删除 Bucket","D":"Bucket 在 OSS 中全局唯一,不允许用户删除"},"answer":["A","B"],"explanation":"在删除 Bucket 前必须先删除 Bucket 中的所有文件,包括未完成的分片文件；OSS 管理控制台可以删除 Bucket ；阿里云对象存储 OSS 的存储空间 Bucket 支持删除操作"},{"id":310,"question":"下列关于阿里云专有网络 VPC 的说法中，正确的是?","options":{"A":"一个专有网络 VPC 最多只能含有一个网段","B":"一个专有网络 VPC 中可以含有多个路由表","C":"一个专有网络 VPC 中至少需要含有一个交换机","D":"交换机的网段可以不属于专有网络 VPC 中"},"answer":["B","C"],"explanation":"一个专有网络 VPC 可以有多个网段；交换机的网段必须属于专有网络 VPC 中。"},{"id":311,"question":"阿里云专有网络 VPC 用于连接不同网段的组件是?","options":{"A":"路由器","B":"交换机","C":"NAT 网关","D":"VPN 网关"},"answer":["A"],"explanation":"阿里云专有网络 VPC 用于连接不同网段的组件是路由器"},{"id":312,"question":"在使用云服务器 ECS 的过程中发现系统盘的可用空间越来越少，无法满足日常使用需求，那么下面的做 法中正确的是?","options":{"A":"系统盘不支持扩容，只能更换系统盘并增大存储空间","B":"系统盘扩容后，重新扫描磁盘即可发现系统中系统盘的空间自动增大","C":"云服务器 ECS 实例为运行中状态不能扩展系统盘","D":"系统盘扩容后,还需要扩容文件系统才可以使用新增的空间"},"answer":["D"],"explanation":"A 选项：错误，系统盘支持扩容 B 选项：错误，还需要扩容文件系统才可以使用新增的空间 C 选项： 错误，云服务器 ECS 实例为运行中状态可以扩展系统盘 D 选项：正确 所以正确答案是 D"},{"id":313,"question":"下面关于阿里云云安全中心的说法中，正确的是?","options":{"A":"云安全中心可以实时识别安全威胁","B":"客户端不需要任何配置，默认已接入至云安全中心","C":"可以防范勒索病毒","D":"可以保护 Web 应用安全"},"answer":["C"],"explanation":"在购买 ECS 时选择安全加固（选择后会自动为您的 ECS 服务器安装 Agent）或在云安全中心控制台为 该 ECS 服务器安装 Agent。 https://help.aliyun.com/document_detail/42306.html?spm=a2c4g.42302.0.0"},{"id":314,"question":"在阿里云中部署了一个由十台 ECS 构成的 APP 应用，可以满足客户的需求，为了避免因为服务器的故障 而导致业务性能的下降，可以选择弹性伸缩服务 ESS 中的（）伸缩模式。","options":{"A":"定时模式","B":"动态模式","C":"固定数量横式","D":"健康模式"},"answer":["D"],"explanation":"为了避免因为服务器的故障而导致业务性能的下降,也就是希望及时发现后端服务器的故障，所以需 要用健康模式，及时将后端故障的服务器移出伸缩组。"},{"id":315,"question":"下列关于专有网络 VPC 中交换机和网段的说法中,错误的是?","options":{"A":"交换机是 VPC 基于可用区创建的","B":"交换机的网段必须是 VPC 下的子网","C":"交换机的网段以后可以修改","D":"如果需要和其他 VPC 实现互通，VPC 的网段不能重叠"},"answer":["C"],"explanation":"交换机的网段配置好了后就不可以修改"},{"id":316,"question":"如果用户在阿里云对象存储 OSS 中使用 ossbrowser 删除存储空间 Bucket 时失败了，可能的原因是?","options":{"A":"Bucket 非空","B":"Bucket 的权限为私有","C":"ossbrowser 王具不支持删除 Bucket","D":"Bucket 不允许删除"},"answer":["A"],"explanation":"A 选项：正确 B 选项：错误，Bucket 的权限为私有不影响删除 C 选项：错误，ossbrowser 王具支持 删除 Bucket D 选项：错误，Bucket 允许删除 所以正确答案是 A"},{"id":317,"question":"用户创建了一台 Linux 系统的云服务器 ECS。如果在该云服务器 ECS 实例中增加了一块空间超过 2T 的云 盘,对该云盘进行分区管理时使用的分区工具应该是?","options":{"A":"fdisk","B":"磁盘管理","C":"parted","D":"分区管理"},"answer":["C"],"explanation":"对于超过 2T 的云盘进行分区管理，只能使用 parted."},{"id":318,"question":"阿里云中块存储提供本地盘和云盘以供用户选择，下面关于本地盘和云盘的说法正确的是?","options":{"A":"本地盘吞吐量优于云盘","B":"云盘吞吐量优于本地盘","C":"本地盘安全性优于云盘","D":"云盘安全性优于本地盘"},"answer":["A","D"],"explanation":"本地盘能够为 ECS 实例提供本地存储访问能力，具有低时延、高随机 IOPS、高吞吐量和高性价比的优 势。但是本地盘来自单台物理机，数据可靠性取决于物理机的可靠性，存在单点故障风险。 所以正确答案 是 AD"},{"id":319,"question":"下面关于阿里云云监控的描述中，正确的是?","options":{"A":"云监控需要管理员手动开通","B":"云服务器中需要安装 Agent 才能实现云监控功能","C":"云监控提供丰富的图表展现样式","D":"—旦发生异常会立刻给管理员发送报警通知"},"answer":["B","C"],"explanation":"云监控服务无需您购买和开通。当您注册阿里云账号后，自动开通云监控服务。需要监控项到达报警 阈值才会发送通知"},{"id":320,"question":"阿里云云服务器 ECS 中挂载云盘对地域和可用区有要求，下面关于云盘与云服务器 ECS 的地域和可用区 说法中，正确的是?","options":{"A":"云服务器 ECS 和云盘可以不同地域","B":"云服务器 ECS 和云盘地域相同，可用区可以不同","C":"云服务器 ECS 和云盘的地过和可用区都必须相同","D":"云盘可以在不同可用区之间迁移"},"answer":["B"],"explanation":"地域必须相同，可用区可以不同"},{"id":321,"question":"下列负载均衡 SLB 的协议中需要绑定证书的是?","options":{"A":"HTTP","B":"HTTPS","C":"TCP","D":"UDP"},"answer":["B"],"explanation":"只有 HTTPS 协议需要绑定证书。所以答案是 B"},{"id":322,"question":"当部署负载均衡 SLB 的时候，需要对其提前规划。下面关于负载均衡 SLB 的部署说法中，正确的是?","options":{"A":"可以跨地域部署","B":"可以公网部署","C":"不支持跨可用区部署","D":"只能部署在阿里云内网"},"answer":["B"],"explanation":"A 选项错误，SLB 不可以跨地域部署 B 选项 正确 C 选项 错误，SLB 支持跨可用区部署 D 选项错误， SLB 可以部署在公网 所以答案是 B"},{"id":323,"question":"为了实现跨地域(Region)级别的高可用,可以采用的是?","options":{"A":"DNS","B":"内容分发网络 CDN","C":"弹性伸缩 AS","D":"负载均衡 SLB"},"answer":["A"],"explanation":"DNS 可以实现跨地域级别的高可用，所以答案是 A"},{"id":324,"question":"一块 MBR 格式的云盘中，可以创建扩展分区的数量最多是?","options":{"A":"0","B":"1","C":"3","D":"4"},"answer":["B"],"explanation":"MBR 类型磁盘主分区最多为 4 个或者是 3 个主分区+1 个扩展分区.所以答案是 B"},{"id":325,"question":"Windows 系统的云服务器 ECS 中，建议使用的文件系统格式是哪种？","options":{"A":"vfat","B":"ext4","C":"xfs","D":"ntfs"},"answer":["D"],"explanation":"在 Windows 系统的云服务器 ECS 中，建议使用的文件系统格式是 ntfs。"},{"id":326,"question":"用户在创建弹性伸缩服务 ESS 时，定义了”组内最大实例数:10，组内最小实例数:7，伸缩规则为”减 少:4。当该伸缩规则执行时，减少的云服务器 ECS 的数量是?","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":["D"],"explanation":"伸缩规则规定的是 4 台，所以执行的时候也会安装 4 台来执行，与最大最小值无关。"},{"id":327,"question":"阿里云内容分发网络 CDN 可以为用户提供访问加速。下面关于 CDN 加速的说法中，错误的是?","options":{"A":"源站必须保证可用,源站一旦异常,CDN 将无法提供访问","B":"CDN 不仅可以为网的站战加速也可以为对象存储 OSS 进行加速","C":"CDN 可以节省源站带宽的投入","D":"CDN 的加速节点越多代表对用户加速效果越明显"},"answer":["A"],"explanation":"源站异常，CDN 不一定无法访问，用户依旧可以从 CDN 处获取资源。所以答案是 A"},{"id":328,"question":"下面关于阿里云专有网络 VPC 的说法中,正确的是?","options":{"A":"不同专有网络 VPC 之间是逻辑隔离","B":"专有网络 VPC 中交换机可以连接不同云资源，可以实现跨网段互通","C":"一个专有网络 VPC 只能创建一台交换机","D":"专有网络 VPC 中 ECS 可以通过负载均衡 SLB 进行公网访问"},"answer":["D"],"explanation":"还有可能是物理隔离 不支持连接互通云资源 可以创建多个交换机"},{"id":329,"question":"用户使用阿里云云服务器 ECS 时，忘记了 ECS 实例的登录密码，用户可以通过重置密码的方式设置新的 密码。下面关于重置密码说法中不正确的是?","options":{"A":"关机状态不可以重置密码","B":"运行状态的 ECS 可以重置密码","C":"Windows 系统也可以重置密码","D":"运行状态的 ECS 重置密码后必须重启才能生效"},"answer":["A"],"explanation":"重置密码可以在运行中和关机状态下进行，但是运行状态的 ECS 重置密码后必须要重启才能生效。阿 里云支持对 linux 和 windows 主机进行重置密码。"},{"id":330,"question":"下面场景中不适合使用阿里云云安全中心的是?","options":{"A":"实时监控云上业务安全","B":"服务器经常遭受 DDoS 攻击","C":"对云上服务定期进行漏洞扫描","D":"回溯 ECS 服务器中的入侵事件"},"answer":["A"],"explanation":"阿里云云安全中心不支持实时监控云上业务。"},{"id":331,"question":"选购阿里云的 PolarDB MySQL 数据库后，需要连接该数据库进行管理和使用,默认数据库连接的端口号 是?","options":{"A":"80","B":"443","C":"3306","D":"3389"},"answer":["C"],"explanation":"默认数据库连接的端口号是 3306。所以答案是 C"},{"id":332,"question":"用户在使用弹性伸缩服务 ESS 的时候，创建实例选择的是从 0 开始创建”，代表用户创建完弹性伸缩服 务 ESS 后,还需要手动创建的是?","options":{"A":"伸缩配置","B":"伸缩规则","C":"伸缩任务","D":"报警任务"},"answer":["A"],"explanation":"如果从 0 开始创建伸缩组，伸缩组创建完成后没有可用的伸缩配置来源，必须继续创建伸缩配置"},{"id":333,"question":"阿里云云数据库 RDS 需要使用存储来存放数据。下列不是云数据库 RDS 提供的存储类型的是?","options":{"A":"本地 SSD 盘","B":"高效云盘","C":"SSD 云盘","D":"ESSD 云盘"},"answer":["B"],"explanation":"云数据库 RDS 提供三种数据存储类型:本地 SSD 盘、SSD 云盘和 ESSD 云盘。"},{"id":334,"question":"在阿里云对象存储 OSS 创建存储空间时,不能选择的存储类型是?","options":{"A":"标准存储","B":"低频访问","C":"归档存储","D":"SSD 存储"},"answer":["D"],"explanation":"对象存储 OSS 提供标准、低频访问、归档、冷归档四种存储类型。"},{"id":335,"question":"当用户上传一个对象文件至存储空间 Bucket 的时候，在该 Bucket 中含有一个名称相同的对象文件，可 能会发生的是?","options":{"A":"新上传的文件将会在文件名称后面增加","B":"Bucket 中文件不能重名,上传失败","C":"新上传的文件将会覆盖旧文件","D":"上传成功，但是文件内容仍然是旧文件内容"},"answer":["C"],"explanation":"当用户上传一个对象文件至存储空间 Bucket 的时候，在该 Bucket 中含有一个名称相同的对象文件， 新上传的文件将会覆盖旧文件.所以答案是 C"},{"id":336,"question":"阿里云对象存储 OSS 可以为用户提供海量、安全、低成本的存储服务。管理员可以限制用户对对象存储 oSS 中数据的访问。可以设置的权限是?","options":{"A":"共享读","B":"公共读","C":"公共读写","D":"私有读","E":"私有"},"answer":["B","C","E"],"explanation":"阿里云 OSS 对象存储，创建 Bucket，读写权限有：私有、公共读和公共读写。 所以答案是 BCE"},{"id":337,"question":"购买阿里云云数据库 PolarDB MySQL 后，需要连接到该数据库进行管理和使用。关于 PolarDB 数据库连 接地址的说法中，描述正确的是（）。","options":{"A":"集群地址带有读写分离功能","B":"一个 PolarDB 集群只能含有一个集群地址","C":"主地址只能连接主节点,支持读写操作","D":"主节点发生故障后主地址将不再可用"},"answer":["A","C"],"explanation":"A 选项，正确 B 选项，错误，可以有多个集群地址 C 选项，正确 D 选项，错误，主节点故障后，将 会切换到从节点，主地址依旧可用。 所以答案是 AC"},{"id":338,"question":"阿里云云服务器 ECS 中可以扩容数据盘容量的块存储类型是?","options":{"A":"高效云盘","B":"普通云盘","C":"SATA HDD 本地盘","D":"NVMe sSD 本地盘"},"answer":["A","B"],"explanation":"只有高效云盘和普通云盘支持扩容数据盘容量。"},{"id":339,"question":"创建一台 Linux 操作系统的阿里云云服务器 ECS 后，如果希望多个用户在 Windows 系统中同时登陆,可 以选择的连接方式或连接工具有?","options":{"A":"Workbench","B":"VNC","C":"Putty","D":"mstsc"},"answer":["A","C"],"explanation":"VNC 不支持多用户连接"},{"id":340,"question":"后端服务器是负载均衡 SLB 中对外提供访问服务的真实服务器，下面关于后端服务器的说法中，正确的 是?","options":{"A":"提供服务需要一致","B":"配置可以不同","C":"操作系统必须相同","D":"必须配置公网 IP"},"answer":["A","B"],"explanation":"后端服务器 Backend Servers：一组接收前端请求的 ECS 实例，ECS 实例是真正提供服务访问的，后 端服务器的数据要一致，对后端服务器的操作系统等配置没有要求，只要求它们的数据是一致的.所以答案 是 AB"},{"id":341,"question":"下面关于阿里云专有网络 VPC 的说法中，正确的是?","options":{"A":"VPC 之间默认是隔离的不能直接通信","B":"VPC 中需要有一个路由器实现不同网络的互通","C":"云服务器 ECS 创建的时候需要指定所属的 VPC","D":"不同 VPC 可以通过 NAT 网关实现互通","E":"一个 VPC 可以跨地域(Region)进行规划"},"answer":["A","B","C"],"explanation":"不同的 VPC 只能通过云企业网和 VPN 网关实现互通； 一个 VPC 不可以跨地域配置"},{"id":342,"question":"阿里云弹性伸缩服务 ESS 一般会与云服务器 ECS 和负载均衡 SLB 结合使用，下面关于这三种服务之间关 系说法中，正确的是?","options":{"A":"弹性伸缩服务 ESS 可以不结合云服务器 ECS 使用","B":"弹性伸缩服务 ESS 可以手动添加已创建的云服务器 ECS","C":"弹性伸缩服务 ESS 可以不结合负载均衡 SLB 使用","D":"如果结合了负载均衡 SLB，弹性伸缩服务 ESS 可以将自身创建的云服务器 ECS 自动添加至 SLB 下"},"answer":["B","C","D"],"explanation":"阿里云弹性伸缩服务 ESS 是一种服务，它可以根据业务负载的变化自动调整云服务器 ECS 的数量，以 此来保证服务的稳定性和高效性。ESS 一般会与云服务器 ECS 和负载均衡 SLB 结合使用，以实现更好的服务 效果。ESS 可以手动添加已创建的云服务器 ECS，也可以在结合了负载均衡 SLB 后，将自身创建的云服务器 ECS 自动添加至 SLB 下。但是，ESS 并不能不结合云服务器 ECS 或负载均衡 SLB 使用，因为它的主要功能就 是对这两种服务进行管理和调整。"},{"id":343,"question":"使用 Workbench 连接 Linux 系统的阿里云云服务器 ECS 实例时,可选择认证方式有?","options":{"A":"密码认证","B":"证书","C":"IP 地址","D":"端口认证"},"answer":["A","B"],"explanation":"使用 Workbench 连接 Linux 系统的阿里云云服务器 ECS 实例时,可选择认证方式有密码认证和证书认 证。"},{"id":344,"question":"阿里云负载均衡 SLB 支持四层和七层负载均衡，其四层负载均衡中代表 OSI 参考模型的层次是（）。","options":{"A":"网络层","B":"传输层","C":"会话层","D":"应用层"},"answer":["B"],"explanation":"四层负载均衡对应 OSI 模型的传输层,由于在传输层,只有 TCP/UDP 协议,这两种协议中除了包含源 IP、 目标 IP 以外,还包含源端口号及目的端口号。"},{"id":345,"question":"用户创建阿里云负载均衡 SLB 后，在添动加后端服务器之前，需要创健的是","options":{"A":"负载均衡服务","B":"服务地址","C":"监听","D":"服务器组"},"answer":["C"],"explanation":"购买负载均衡 配置监听器 添加后端服务器"},{"id":346,"question":"创建阿里云专有网络 VPC 时，需要指定网段地址，如果想要使用 A 类的 IPv4 地址段 10.0.0.0，那么默 认子网掩码的位数是？","options":{"A":"8","B":"12","C":"16","D":"24"},"answer":["A"],"explanation":"A 类地址 10.0.0.0 默认子网掩码为 8 位"},{"id":347,"question":"管理员可以通过添加数据盘的方式，为阿里云云服务器 ECS 增加存储空间。如果增加的数据盘空 2T，那 么在云服务器 ECS 中需要使用的分区格式是？","options":{"A":"MBR","B":"FAT","C":"GPT","D":"EXT"},"answer":["C"],"explanation":"阿里云块存储支持的分区格式包括 MBR（Master Boot Record）和 GPT（Globally Unique Identifier Partition Table）。其中，MBR 只支持处理不大于 2 TiB 的容量，且只支持划分 4 个主区。如 果您需要使用大于 2 TiB 的数据盘，您必须采用 GPT 格式。"},{"id":348,"question":"使用阿里云服务时，需要充分考虑到地域(Region)和可用区(Zone)的选择，下面场景中需要通过公网互 通的是？","options":{"A":"Zone 内","B":"Zone 间","C":"Region 内","D":"Region 间"},"answer":["D"],"explanation":"阿里云服务器无论是否在同一可用区，只要是同地域，即可使用内网连接互通"},{"id":349,"question":"阿里云弹性伸缩服务 ESS 可以和阿里云其他服务搭配使用，弹性伸缩服务 ESS 不需要搭配使用的是？","options":{"A":"云服务器 ECS","B":"云数据库 RDS","C":"负载均衡 SLB","D":"弹性公网 EIP"},"answer":["D"],"explanation":"解析：阿里云弹性伸缩服务一定要搭配阿里云服务器 ECS 才能使用。 弹性伸缩是开放灵活的平台， 您可以不搭配负载均衡、云监控、RDS，但是搭配这些产品可以增强弹性伸缩的服务能力。 https://help.aliyun.com/document_detail/108806.html?spm=a2c4g.100694.0.i5"},{"id":350,"question":"下面关于阿里云云监控的说法中，正确的是？","options":{"A":"云监控不支持控制台管理","B":"可以监控阿里云中部署的网站","C":"需要单独购买开通","D":"不支持非阿里云主机监控"},"answer":["B"],"explanation":"可以使用云监控功能监控网站环境"},{"id":351,"question":"下面关于阿里云 RDS MySQL 中实例和数据库的包含关系中，正确的是？","options":{"A":"一个数据库可以包含多个实例","B":"一个数据库只能含有一个实例","C":"一个实例可以包含多个数据库","D":"一个实例只能包含一个数据库"},"answer":["B","C"],"explanation":"一个数据库只能对应一个实例，一个实例可以对应多个数据库"},{"id":352,"question":"部署弹性伸缩服务 ESS 时，需要充分考虑提供后端服务的云服务器 ECS。下列关于后端服务器 ECS 描述 正确的是（）。","options":{"A":"可以通过弹性伸缩服务 ESS 进行纵向扩展","B":"云服务器 ECS 后端应用可以是有状态","C":"后端应用可以横向扩展","D":"后端服务器必须有公网 IP"},"answer":["C"],"explanation":"ESS 只能调整服务器的数量：无法纵向扩展，纵向扩展是指自动提升或降低 ECS 实例服务器的 vCPU， 内存，带宽等配置；弹性伸缩只能支持横向扩展，比如增加 ECS 服务器的数量；部署在伸缩组内的 ECS 实例 上应用必须是无状态并且可横向扩展的应用"},{"id":353,"question":"阿里云 PolarDB MySQL 使用时，为了增加数据库安全，仅允许管理员所在的 IP 地址连接数据库工具 是？","options":{"A":"黑名单","B":"白名单","C":"安全组","D":"访问控制"},"answer":["B"],"explanation":"https://help.aliyun.com/document_detail/43185.html"},{"id":354,"question":"在 Linux 系统的云服务器 ECS 中，把多个不同的云盘空间使用到同一个分区中，可以使用的命令是？","options":{"A":"Iws","B":"wm","C":"parted","D":"fdisk"},"answer":["C","D"],"explanation":"Linux fdisk 是一个创建和维护分区表的程序。 parted 适合 2T 以上的云盘，fdisk 适合 2T 以内的 磁盘 https://help.aliyun.com/document_detail/25426.html https://help.aliyun.com/document_detail/34377.html"},{"id":355,"question":"专有网络 VPC 创健成功后，通过修改选项可以修改某些属性。其中可以修改的属性是？","options":{"A":"VPC 名称","B":"VPC 网段","C":"所属地域","D":"VPC 的 ID"},"answer":["A"],"explanation":"输入 VPC 的描述信息。 描述可以为空或者描述长度为 2~256 个字符； https://help.aliyun.com/document_detail/65398.html#section-eyo-8rc-cii"},{"id":356,"question":"阿里云云服务器 ECS 可以通过挂载云盘的方法增大存储空间。在 Liunx 操作系统的云服务器 ECS 系统盘 的命名是？","options":{"A":"/dev/vda","B":"/dev/vdb","C":"/dev/vdc","D":"/dev/vdd"},"answer":["A"],"explanation":"/dev/vda,系统盘；/dev/vdb 是数据盘"},{"id":357,"question":"用户在阿里云云服务器 ECS 搭建数据库服务器，选择数据库这类业务密集型应用的块存储特别关注的性 能指标是？","options":{"A":"IOPS","B":"访问时延","C":"吞吐量","D":"容量"},"answer":["A"],"explanation":"IOPS 是 Input/Output Operations per Second，即每秒能处理的 I/O 个数，用于表示块存储处理读 写（输出/输入）的能力。如果要部署事务密集型应用，典型场景比如数据库类业务应用，需要关注 IOPS 性 能。参考：https://blog.csdn.net/weixin_30485379/article/details/98615027"},{"id":358,"question":"创健阿里云云服务器 ECS 时，需要选择合适的实例规则，才能够更好的匹配用户的业务。如计算型实例 可使用规格族的开头字母是（）。","options":{"A":"c","B":"g","C":"r","D":"ne"},"answer":["A"],"explanation":"计算型实例规格族一般是 C 开头，例如：C7 或者 C6 等 参考链 接:https://help.aliyun.com/document_detail/108491.html"},{"id":359,"question":"购买阿里云云数据库 PolarDB MySQL 后，使用过程中发现数据库性能无法满足业务的需求。关于该数据 库可以变更的配置内容有哪些？","options":{"A":"集群规格可以升级，提高更大处理能力","B":"可以增加新的主节点，以提高写能力","C":"可以增加新的只读节点，增大读能力","D":"可以设置存储容量以提高存储空间"},"answer":["A","C","D"],"explanation":"https://help.aliyun.com/document_detail/257089.html PolarDB 集群支持在线变配，变更配置过 程中无需对数据库加锁。它支持三维扩展能力，集群变配分钟级生效： 计算能力的纵向扩展：集群规格升 降配，支持对主节点和只读节点分别升降配，即只读节点的规格可以与主节点规格不一致。 说明：PolarDB 集群提供了更灵活的变配方案，只读节点的规格可以单独变配。无需与主节点规格保持一致，您可以根据实 际业务需求，灵活分配不同的节点规格。 计算能力横向扩展：增加或删除只读节点，最多扩展至 16 个计算 节点。 存储空间的横向扩展：按容量计费（按量付费）的存储空间采用 Serverless 架构，容量随数据量的 变化而自动在线调整；按空间计费（包年包月）的存储空间，支持通过手工扩容的方式来扩展存储容量。当 您的数据量较大时，推荐使用存储包以降低存储成本 每个 PolarDB 集群都包含了 1 个主节点和多个只读节 点。"},{"id":360,"question":"购买阿里云云服务器 ECS 后，想要了解云服务器 ECS 实例的运行数据，可以使用的方法是？","options":{"A":"使用云监控进行实例运行情况监控，并设置告警规则进行定制化监控","B":"云服务器 ECS 控制台可以直接进行告警监控设置","C":"云服务器 ECS 控制台可以了解到 CPU 使用率和网络使用情况","D":"使用云安全中心可以设置监控项"},"answer":["A","C"],"explanation":"云监控可对用户的多种资源进行性能监控和状态可视化呈现，监控指标可自定义设置，方便运维人员 及时准确排查故障。B，不对，控制台不能直接进行告警监控设置。D 不对：云安全中心基础版，检测服务器 异常登录、DDoS 攻击、服务器主流类型的漏洞以及云产品安全配置"},{"id":361,"question":"下面关于云服务器 ECS 中块存储扩容的说法中，正确的是？","options":{"A":"系统盘不能扩容","B":"云服务器 ECS 开机过程中地可以扩容","C":"扩容云盘只能扩大存储空间，文件系统不会自动扩容","D":"可以缩小云硬盘"},"answer":["C","D"],"explanation":"系统盘可以扩容 ECS 在启动中状态不可扩容。状态为运行中或已停止才可进行扩容参考链接： https://help.aliyun.com/document_detail/35095.html"},{"id":362,"question":"负载均衡 SLB 可以将后端多台云服务器中提供的业务整合后，对外提供高可用的访问服务。使用负载均 衡 SLB 时，主要涉及的操作有？","options":{"A":"创建后端云服务器 ECS 实例","B":"云服务器 ECS 实例部署业务","C":"配置负载均衡 SLB 的监听","D":"配置负载均衡 SLB 的私网网段"},"answer":["A","B","C"],"explanation":"负载均衡服务由负载均衡实例、监听和后端服务器三个部分组成"},{"id":363,"question":"在创建阿里云专有网络 VPC 时，需要规划地域和可用区。下面关于地域和可用区规划的说法中错误的 是？","options":{"A":"VPC 下不同可用区默认不允许互联","B":"VPC 创建完成后不能修改所属地域","C":"VPC 中相同地域不同可用区下的交换机默认是内网高速互联","D":"VPC 下不同的地域默认是内网高速互联"},"answer":["A","D"],"explanation":"VPC 中相同地域不同可用区下的交换机默认是内网高速互联是对的，内网调整互联。"},{"id":364,"question":"阿里云负载均衡 SLB 可以提供高可用的服务访问，为了提高系统的可用性，需要结合的阿里云产品是？","options":{"A":"云服务器 ECS","B":"弹性伸缩","C":"内容分发网络 CDN","D":"云数据库 RDS"},"answer":["A"],"explanation":"SLB 后端要搭配 ECS 才能正常使用"},{"id":365,"question":"创建阿里云云服务器 ECS 时，可以采用自定义密码的方式。下面可以作为云服务器初始密码的是?","options":{"A":"123.com","B":"aliyun.com","C":"1234_abcd","D":"1234_!"},"answer":["C"],"explanation":"设置主机管理密码时，请您遵循如下命名规则： 由大写字母、小写字母以及数字混合组成。 长度为 8~20 个字符。参考链接： https://help.aliyun.com/document_detail/36151.htm?spm=a2c4g.11186623.0.0.172a5ab2EbAsO8#multiT ask286"},{"id":366,"question":"下面关于对象存储 OSS 中的对象文件 Object 的说法中,错误的是?","options":{"A":"Object 名称区分大小","B":"Object 上传成功后可以修改其中内容","C":"Object 需要上传至存储空间","D":"上传同名 Object 可以覆盖旧的 Object"},"answer":["B"],"explanation":"创建的 Object 都是 Normal 类型，这种 Object 在上传结束之后内容就是固定的，只能读取，不能修 改。 对象的命名规范如下: 使用 UTF-8 编码。 长度必须在 1-1023 字节之间。 不能以“/”或者“”字符 开头。 注意:对象名称需要区分大小写"},{"id":367,"question":"阿里云对象存储 OSS 是阿里云针对用户推出的一个海量存储解决方案，下面关于这种存储方案的说法中， 错误的是?","options":{"A":"不限制空间大小","B":"适合存储视频等大文件业务","C":"需要制作文件系统后才能存放","D":"默认开启了 ddos 防御功能"},"answer":["C"],"explanation":"单个 Object 的大小限制为 48.8TB,一个存储空间中可以有无限量的对象；阿里云对象存储服务 (object storage service),是阿里云提供的海量、安全、低成本、高可靠的云存储服务.您可以通过调用 API,在任何应用、任何时间、任何地点上传和下载数据,也可以通过 web 控制台对数据进行简单的管理.OSS 适合存放任意类型的文件,适合各种网站、开发企业及开发者使用"},{"id":368,"question":"在负载均衡 SLB 中，监听中需要配置后端服务器，每个监听可以与后端服务器中对应应用的数量是?","options":{"A":"0","B":"1","C":"2","D":"多个"},"answer":["B"],"explanation":"一个 CLB 实例最多支持添加 50 个监听，每个监听对应后端 ECS 实例上的一个应用。负载均衡的监听 端口对应后端 ECS 实例上的应用服务端口。 https://help.aliyun.com/document_detail/85962.htm"},{"id":369,"question":"创建云服务器 ECS、云数据库 RDS 等资源需要指定所属的专有网络 VPC，用户在创建 VPC 后，还需要进 行的下一步操作是?","options":{"A":"创建路由器","B":"创建交换机","C":"配置路由表","D":"修改安全组"},"answer":["B"],"explanation":"创建 VPC 之后应当创建交换机，然后创建安全组（可选），再创建 ECS"},{"id":370,"question":"下面关于专有网络 VPC 和地域(Region)以及可用区(Zone)的说法中，正确的是?","options":{"A":"一个 Region 至少包含一个 VPC","B":"一个 VPC 可以跨 Region 部署","C":"一个 VPC 只能属于一个 Zone","D":"一个 zone 下只能创建一个 VPC"},"answer":["A"],"explanation":"region ： 地域，顾名思义是标志地区用的，比如 西安，上海，广东 就是不通的 region zone：叫 可用域 ，一般指的是 某个 region 下的可用域，一个 region 下有多个可用域 ，比如 北京 1 ，北京 2 ， 北京 3 vpc：Virtual Private Cloud 虚拟私有云 与 VPN 类似，实现 VPC 也需要利用隧道技术，以及 SDN （软件定义网络）。利用 VPC 技术可以将公有云的网络隔离，每个 VPC 网络都有一个隧道号，相互之间逻辑 上彻底隔离。PC 的子网具有可用区属性，一个 VPC 内可以同时存在多个可用区的子网"},{"id":371,"question":"阿里云云服务器 ECS 中，创建的系统盘最大的容量是?","options":{"A":"30G","B":"40G","C":"500G","D":"2T"},"answer":["C"],"explanation":"ECS 的容量范围从 40~500G,就是最小 40G，最大 500G"},{"id":372,"question":"与传统的 IDC 相比，云计算具有很多优势。以下关于云计算优势的说法中不正确的是（）。","options":{"A":"云计算业务租用的资源范围广语。不局限于服务器和带宽","B":"云计算业务提供弹性按需分配的资源租用服务","C":"在云计算环境中，用户无需在关心安全方面设置","D":"云计算业务中，用户不需要关心物理资源的硬件信息"},"answer":["C"],"explanation":"在云上，用户也是要高度关注安全方面设置的"},{"id":373,"question":"弹性伸缩服务 ESS 可以自动调整后端服务器的数量，支持用户手动添加已有的云服务器 ECS 至 A 弹性伸 缩 ESS 实例中，对云服务器 ECS 实例的状态要求是?","options":{"A":"Running","B":"Stopping","C":"stopped","D":"Starting"},"answer":["A"],"explanation":"手动添加 ECS 实例时，处于运行中（Running）状态的 ECS 实例可加入伸缩组。参看链接： https://help.aliyun.com/document_detail/25911.html"},{"id":374,"question":"阿里云内容分发网络 CDN 中 HTTP 的缓存采用的基础架构是?","options":{"A":"LVS","B":"Tengine","C":"Nginx","D":"swift"},"answer":["D"],"explanation":"x-swift 指明了使用了的具体热点缓存技术。"},{"id":375,"question":"开通阿里云 PolarDB 后需要创建一个数据库，创建数据库过程中可以对授权账号赋予权限，其中不包括 （）。","options":{"A":"完全控制","B":"读写","C":"只读","D":"仅 DML"},"answer":["A"],"explanation":"为该账号授予一个或多个数据库的权限。本参数也可以留空，在创建账号后再给账号授权。 从未授 权数据库列表中选择一个或多个数据库，单击 icon 图标将其添加到已授权数据库列表中。 在已授权数据库 列表中，为目标数据库选择读写、只读、仅 DML、仅 DDL 或只读+索引权限。参照链接： https://help.aliyun.com/document_detail/68508.html?userCode=wrvvs1rm"},{"id":376,"question":"下列哪种执行方式,不属于弹性伸缩服务 ESS 的伸缩规则执行方式?","options":{"A":"手动执行","B":"定时任务执行","C":"报警任务执行","D":"受攻击后执行"},"answer":["D"],"explanation":"伸缩规则只有手动执行、定时任务执行、报警任务执行"},{"id":377,"question":"阿里云云数据库 RDS 实现异地容灾可以使用的工具是?","options":{"A":"DMS","B":"DNS","C":"SLB","D":"DTS"},"answer":["D"],"explanation":"异地灾备主要用于一个地区机房故障，可以使用另一个机房进行灾备。异地直接通过 DTS 实现数据的 双向实时同步，以保持地域间的副本同步。"},{"id":378,"question":"ECS 的普通云磁盘的存储空间范围是","options":{"A":"1G-5T","B":"2G-5T","C":"5G-2T","D":"10G-5T"},"answer":["C"],"explanation":"ESC 的普通云盘存储范围是：5G-2T"},{"id":379,"question":"当用户在对象存储 OSS 中上传对象文件的时候，选择上传至指定目录。如果输入的目录不存在，将会发 生的操作是?","options":{"A":"上传至当前目录","B":"将对象文件改名为目录名","C":"目录不存在，上传失败","D":"新建目录，然后上传"},"answer":["D"],"explanation":"将文件上传到指定目录，您需要输入目录名称。若输入的目录不存在，OSS 将自动创建对应的文件夹 并将文件上传到该文件夹中。参考链接：https://help.aliyun.com/document_detail/31886.html"},{"id":380,"question":"创建了一台 Linux 操作系统的阿里云云服务器 ECS，添加云盘后，默认情况下，云盘可以制作的文件系 统格式为?","options":{"A":"ext4","B":"nfs.","C":"xfs","D":"ntfs"},"answer":["A","C"],"explanation":"一般有 Ext4,XFS,GPT 等文件格式"},{"id":381,"question":"下列关于阿里云云数据库 RDS 高可用版的说法中，正确的是?","options":{"A":"支持单可用区实例","B":"支持多可用区实例","C":"单可用区和多可用区不能切换，购买时一定提前规划好","D":"支持多地域实例"},"answer":["A","B"],"explanation":"单可用区和多可用区可以切换；只支持多可用区，不支持多地域"},{"id":382,"question":"下列场景中可以使用 Web 应用防火墙 WAF 的是?","options":{"A":"防恶意 CC","B":"阻止木马上传","C":"防御 DDoS 攻击","D":"提供针对网站最新漏洞的虚拟补丁"},"answer":["A","B","D"],"explanation":"防御 DDoS 攻击一般是抗 DDoS，高防产品"},{"id":383,"question":"阿里云弹性伸缩服务 ESS 一般要与阿里云其他服务结合，才能为用户提供服务。可以为用户提供高可用 伸缩服务的是?","options":{"A":"云服务器 ECS","B":"负载均衡 SLB","C":"对象存储 OSS","D":"内容分发 CDN"},"answer":["A","B"],"explanation":"对象存储 OSS、内容分发 CDN 是可选项，并不一定要，云服务器 ECS、负载均衡 SLB 是必须要的"},{"id":384,"question":"阿里云负载均衡 SLB 将数据转发给后端服务器 ECS 时,采用的连接地址是?","options":{"A":"云服务器 ECS 的 VPC 私网地址","B":"云服务器 ECS 的固定公网 IP","C":"云服务器 ECS 所绑定的 EIP","D":"负载均衡 SLB 的公网 IP"},"answer":["A"],"explanation":"阿里云负载均衡 SLB 将数据转发给后端服务器 ECS 时,采用的连接地址是云服务器 ECS 的 VPC 私网地 址"},{"id":385,"question":"阿里云负载均衡 SLB 中可以将同一个客户端的请求转发至同一台后端服务器，使用的技术是?","options":{"A":"调度算法","B":"健康检查","C":"会话保持","D":"高可用"},"answer":["C"],"explanation":"会话保持可使得来自同一 IP 的请求被转发到同一台后端服务器上。默认情况下，负载均衡会将每个 请求分别路由到不同后端服务器实例负载。"},{"id":386,"question":"可以将用户自建 IDC 接入到阿里云中构建混合云架构的是?","options":{"A":"NAT 网关","B":"弹性公网 EIP","C":"VPN 网关","D":"固定公网 IP"},"answer":["C"],"explanation":"可以将用户自建 IDC 接入到阿里云中构建混合云架构的是 VPN 网关"},{"id":387,"question":"下列阿里云场景中,推荐采用单 VPC 进行部署的是?","options":{"A":"生产环境和测试环境并存","B":"两地容灾","C":"ECS 和 RDS 部署在同地域不同可用区","D":"国内和海外业务"},"answer":["C"],"explanation":"ECS 和 RDS 必须处于同一个 VPC，所以推荐使用单 VPC 进行部署。"},{"id":388,"question":"云安全中心是阿里云推出一个针对阿里云产品安全的产品。下列云安全中心不能防御的是？","options":{"A":"可疑进程","B":"DDoS 攻击","C":"异常连接","D":"数据库入侵"},"answer":["D"],"explanation":"云安全中心不负责数据库，所以不能防御的是数据库入侵。"},{"id":389,"question":"用户户在阿里云中选购云硬盘和云服务器实例时，需要考虑云盘性能 I/O 能力和实例规格族对应的存储 I/O 能力。下列关于实例规格族和云盘性能 I/O 能力的说法中，描述正确的是（）。","options":{"A":"云盘性能总和超过了 ECS 实例规格族的 IO 性能,可以考虑升级实例规格族以提升整体性能","B":"云盘性能总和没有超过 ECS 实例规格族对应的 I/O 能力,以实例规格族为准","C":"不允许出现云盘性能总和超过 ECS 实例规格族的 I/O 能力的情况","D":"云盘性能总和超过 ECS 实例规格族对应 I/O 能力,以云盘的性能为准"},"answer":["A"],"explanation":"云盘性能总和没有超过 ECS 实例规格族对应的 I/O 能力,是以云盘性能为准；可以出现云盘性能总和 超过 ECS 实例规格族的 I/O 能力的情况；云盘性能总和超过 ECS 实例规格族对应 I/O 能力,以该实例规格对 应的存储 I/O 能力为准"},{"id":390,"question":"下列场景中不能采用阿里云云服务器 ECS 的是?","options":{"A":"企业官网","B":"高并发网站","C":"多播访问测试","D":"大数据实时分析"},"answer":["C"],"explanation":"企业官网，高并发网站和大数据实时分析都可以采用 ECS.但是多播访问测试不可以使用 ECS，因为 ECS 云服务器不支持组播、多播协议"},{"id":391,"question":"在对象存储 OSS 中上传对象文件 Object 时,可以设置对象文件的读写权限,下面权限中要求访问文件时 需要身份验证的是?","options":{"A":"公共读写","B":"公共读","C":"私有","D":"非公开"},"answer":["C"],"explanation":"私有：对文件的所有访问操作需要进行身份验证。 公共读：可以对文件进行匿名读，对文件写操作 需要进行身份验证。 公共读写：所有人都可以对文件进行读写操作。"},{"id":392,"question":"在阿里云对象存储 OSS 中,上传对象文件 Object 的时必须首先创建的是?","options":{"A":"文件夹","B":"存储空间","C":"文件系统","D":"访问点"},"answer":["B"],"explanation":"在阿里云对象存储 OSS 中,上传对象文件 Object 的时必须首先创建存储空间"},{"id":393,"question":"下列数据中适合使用阿里云 PolarDB 进行存放的是?","options":{"A":"公司雇员信息","B":"员工的销售清单","C":"公司宣传图片","D":"网游的账号信息"},"answer":["A","B","D"],"explanation":"阿里云 PolarDB 是 RDS 下一代超高吞吐性能的云原生关系型数据库，不适合存放图片。"},{"id":394,"question":"下列关于阿里云内容分发网络 CDN 计费的说法中,正确的是?","options":{"A":"支持包年包月计费方式","B":"支持按带宽峰值计费","C":"支持按流量计费","D":"计费方式选择后不能修改"},"answer":["B","C"],"explanation":"CDN 的计费方式有按流量计费和按带宽峰值计费这两种计费模式。计费方式选择后可以修改。 https://help.aliyun.com/zh/cdn/product-overview/billing-overview?spm=a2c4g.11186623.0.i3"},{"id":395,"question":"下面关于阿里云负载均衡 SLB 和后端服务器的描述中,正确的是?","options":{"A":"负载均衡 SLB 中的后端服务器可以部署在不同地域","B":"负载均衡 SLB 中的后端服务器可以部署在多个可用区","C":"负载均衡 SLB 中的后端服务器必须是相同可用区","D":"负载均衡 SLB 后端服务器可以同时存在多个不同版本的操作系统"},"answer":["B","D"],"explanation":"负载均衡 SLB 支持跨可用区挂载后端 ECS，只要 ECS 和传统型负载均衡 SLB 实例在同一个地域即可"},{"id":396,"question":"下面关于阿里云云服务器 ECS 中块存储的系统盘和数据盘的说法中，正确的是?","options":{"A":"云服务器 ECS 可以不添加系统盘","B":"云服务器 ECS 可以不添加数据盘","C":"系统盘的生命周期和 ECS 相同","D":"可以单独创建系统盘"},"answer":["B"],"explanation":"ECS 必须要有系统盘；系统盘可以不随 ECS 一起释放 ；不能单独创建系统盘"},{"id":397,"question":"阿里云弹性伸缩服务 ESS 可以根据业务的变化进行调整,那么下面关于弹性伸缩服务 ESS 的说法中,错误 的是？","options":{"A":"需要提前预测业务的变化来定义规则，以应对需求突增","B":"无需人工干预,可以自动创建和释放云服务器 ECS 实例","C":"可以同时多种多种伸缩模式","D":"智能调度云计算资源，应对各种复杂场景"},"answer":["A"],"explanation":"弹性伸缩会根据需求“恰到好处”地分配资源，⽆需您提前预测需求变化，实时应对需求突增。"},{"id":398,"question":"阿里云中弹性伸缩 ESS 可以和云服务器 ECS、云数据库 RDS、负载均衡 SLB 等结合使用,下面说法中正确 的是?","options":{"A":"必须结合负载均衡 SLB 才能使用","B":"必须结合云服务器 ECS 才能使用","C":"必须结合云数据库 RDS 才能使用","D":"必须结合负载均衡 SLB 和云服务器 ECS 才能使用"},"answer":["B"],"explanation":"弹性伸缩必须要结合云服务器 ECS 才能使用"},{"id":399,"question":"用户购买阿里云 PolarDB MySQL 数据库服务后,在自己公司中访问 PolarDB 数据库。希望实现读写分 离，可以连接的地址是?","options":{"A":"主地址公网 IP","B":"主地址私网 IP","C":"集群公网 IP","D":"集群私网 IP"},"answer":["C"],"explanation":"能够实现读写分离的是集群公网 IP"},{"id":400,"question":"阿里云 SLB 负载均衡可以通过哪些方式访问和管理","options":{"A":"管理控制台","B":"API","C":"SDK","D":"支持离线操作"},"answer":["A","B","C"],"explanation":"阿里云 SLB 负载均衡支持管理控制台，API 和 SDK 访问。"},{"id":401,"question":"下面关于阿里云中对象存储 OSS 的说法中,正确的是?","options":{"A":"对象存储 OSS 是一个树状索引结构","B":"对象存储 OSS 中保存的 Object 可以修改","C":"OSS 可以存放非结构数据比","D":"对象存储 OSS 支持海量用户的并发访问"},"answer":["C","D"],"explanation":"OSS 是一个 Key-Value 对形式的结构；OSS 中保存的 Object 不可以修改"},{"id":402,"question":"阿里云云数据库 RDS 提供内网和外网连接。下面关于内网连接的说法中,正确的是?","options":{"A":"云外的主机可以通过内网连接和管理云数据库 RDS","B":"内网连接的安全性和稳定性高于外网连接","C":"同地域的云服务器 ECS 可以使用内网 IP 连接云数据库 RDS","D":"不同地域的云服务器 ECS 和云数据库 RDS 可以使用内网互通"},"answer":["B","C"],"explanation":"云外主机只能通过外网连接和管理 RDS ；不同地域的云服务器 ECS 和云数据库 RDS 不可以使用内网互 通。"},{"id":403,"question":"下列阿里云产品中属于 NoSQL 系列的是（）。","options":{"A":"PolarDB MySQL","B":"RDS MySQL","C":"RDS SQL Server","D":"Hbase"},"answer":["D"],"explanation":"云数据库 HBase 版是面向大数据领域的一站式 NoSQL 服务。 PolarDB MySQL、RDS MySQL、RDS SQL Server 都是关系型数据库 参考链接：https://help.aliyun.com/document_detail/111148.html"},{"id":404,"question":"阿里云 Web 应用防火墙 WAF 支持多种接入方式，下面关于接入方式的描述中，不正确的是（）。","options":{"A":"支持 HTTP 接入","B":"支持 HTTPS 接入","C":"支持 HTTPS 跳转源站 HTTP","D":"不支持自定义端口"},"answer":["D"],"explanation":"根据接入方式不同，具体说明如下： CNAME 接入： WAF 只支持接入通过指定端口提供 HTTP/HTTPS 服 务的域名。 透明接入： WAF 对接入端口没有限制，您可以将 80~65535 范围内任意端口的 Web 业务，通过透 明接入方式接入 WAF 进行防护。 参考链接： https://help.aliyun.com/document_detail/42204.htm?spm=a2c4g.11186623.0.0.1c3d13480Htl4l#sectio n-1kb-tmq-etu"},{"id":405,"question":"阿里云弹性伸缩服务 ESS 可以根据用户的业务需求和策略，自动调整计算资源。以下场景中可以用弹性 伸缩来实现的是？","options":{"A":"业务需求增加，自动提升云服务器 ECS 配置","B":"云服务器 ECS 发生故障，自动创建新的云服务器 ECS 接管","C":"业务带宽需求增大，增加云服务器 ECS 带宽","D":"业务需求下降时，自动减少云服务器 ECS 的数量以节省成本"},"answer":["B","D"],"explanation":"根据业务需求和策略的变化，使用弹性伸缩（Auto Scaling）可以自动调整云服务器 ECS 的数量。 在业务需求增长时，弹性伸缩自动增加 ECS 实例，来保证计算能力。 在业务需求下降时，弹性伸缩自动减 少 ECS 实例，来节约成本。"},{"id":406,"question":"阿里云 Web 应用防火墙 WAF 可以帮助用户应对 Web 应用攻击，确保 Web 安全。WAF 支持 Web 服务器的网 络协议是（）。","options":{"A":"SSH","B":"HTTP","C":"FTP","D":"HTTPS","E":"SFTP"},"answer":["B","D"],"explanation":"支持对网站的 HTTP、HTTPS（高级版、企业版、旗舰版、独享版支持）流量进行安全防护。 参考链 接：https://help.aliyun.com/document_detail/28517.html"},{"id":407,"question":"PolarDB 是阿里云自研的关系型数据库系统，支持多种数据库引擎，其中（）是不兼容的数据库语法。","options":{"A":"MySQL","B":"Oracle","C":"Postgre SQL","D":"SQL Server"},"answer":["D"],"explanation":"PolarDB 兼容多款流行的关系型数据库引擎，完全兼容 MySQL 和 PostgreSQL，高度兼容 Oracle 语 法，代码/应用无需修改或只需少量修改。 参考链接： https://help.aliyun.com/document_detail/58768.html"},{"id":408,"question":"阿里云对象存储 OSS 中存储空间 Bucket，可以针对不同用户限制不同访问权限，下面属于私有权限可以 操作的是？","options":{"A":"所有人都可以读 Bucket 中数据","B":"所有人都可以写 Bucket 中数据","C":"匿名访问者可以读","D":"Bucket 拥有者可以写"},"answer":["D"],"explanation":"私有：只有 Bucket 的拥有者可以对该 Bucket 内的文件进行读写操作，其他人无法访问该 Bucket 内 的文件。参考链接：https://help.aliyun.com/document_detail/31843.html"},{"id":409,"question":"阿里云对象存储 OSS 中的对象文件，可以通过获取 URL 的方式供用户下载，获取 URL 后，使用的协议和 端口分别是（）、（）","options":{"A":"HTTPS","B":"FTP","C":"443","D":"21"},"answer":["A","C"],"explanation":"阿里云对象存储 OSS 中的对象文件，可以通过获取 URL 的方式供用户下载，获取 URL 后，使用的协议 是 HTTPS，端口是 443。HTTPS 是一种网络协议，它的全称是超文本传输安全协议，是 HTTP 的安全版，可以 保证数据的安全传输。443 是 HTTPS 默认的端口。"},{"id":410,"question":"下列关于弹性伸缩 ESS 的说法中，正确的是？","options":{"A":"可以自动提升云服务器 ECS 的带宽","B":"要求部署的云服务器 ECS 实例中服务是无状态的","C":"一般会与负载均衡 SLB 结合使用","D":"可以调整云服务器 ECS 的 vCPU 和内存"},"answer":["B","C"],"explanation":"弹性伸缩（Auto Scaling）是根据业务需求和策略自动调整计算能力（即实例数量）的服务。您可以 指定实例的类型，即 ECS 实例或 ECI 实例。在业务需求增长时，弹性伸缩自动增加指定类型的实例，来保证 计算能力；在业务需求下降时，弹性伸缩自动减少指定类型的实例，来节约成本。弹性伸缩不仅适合业务量 不断波动的应用程序，同时也适合业务量稳定的应用程序。 部署在伸缩组内 ECS 实例或 ECI 实例上的应用 必须是无状态并且可横向扩展的。 伸缩组内 ECS 实例或 ECI 实例可能会被自动释放，因此不适合保存会话 记录、应用数据、日志等信息 。一般会结合负载均衡实用 https://help.aliyun.com/document_detail/25863.html?spm=a2c4g.25859.0.0.44801ee6HQgRP4 参考链 接：https://help.aliyun.com/document_detail/25857.html"},{"id":411,"question":"下列哪种云计算架构中，用户可以只需关心自己的业务，不需要关心底层架构？","options":{"A":"IaaS","B":"PaaS","C":"SaaS","D":"DaaS"},"answer":["C"],"explanation":"云计算架构主要有 IaaS（基础设施即服务）、PaaS（平台即服务）、SaaS（软件即服务）和 DaaS （数据即服务）。其中，SaaS 模型为用户提供了一种只需关心自己的业务，不需要关心底层架构的解决方 案。用户可以直接使用云服务商提供的软件，无需关心软件的安装、运行环境、维护等问题，因此正确答案 是 SaaS。"},{"id":412,"question":"日常的应用中，我们会使用多种方式来存储数据，以下哪个不是数据存储的介质？","options":{"A":"激光笔","B":"硬盘","C":"磁带","D":"U 盘"},"answer":["A"],"explanation":"在日常的应用中，我们会使用硬盘、磁带、U 盘等多种方式来存储数据，这些都是数据存储的介质。 而激光笔并不是一种数据存储介质，它主要用于演示或者指示等，不能用于数据存储。"},{"id":413,"question":"Workbench 是阿里云用户连接云服务器 ECS 的常用工具，Workbench 支持功能中不包括的是？","options":{"A":"WebSSH","B":"GuestOS 文件管理","C":"WebRDP","D":"Ftp 文件管理"},"answer":["D"],"explanation":"https://help.aliyun.com/document_detail/147650.html"},{"id":414,"question":"阿里云云服务器 ECS 需要添加至安全组，进行安全访问控制。每台云服务器 ECS 最多可以加入多少个安 全组？","options":{"A":"0","B":"1","C":"5","D":"不限"},"answer":["C"],"explanation":"“一台 ECS 实例可以加入的安全组数量：5，如需提高上限，请提交工单，可以增加到 10 个或者 16 个安全组。"},{"id":415,"question":"用户购买了阿里云云服务器 ECS 后，自行搭建了 MySQL 数据库系统。随着使用时间的增加，服务器上用 户上传的视频图片类数据增长非常迅速。客户所在地遍布全国，不同地区的用户访问速度也不相同。为了解 决这个问题，可以使用的阿里云产品组合是？","options":{"A":"OSS+RDS","B":"RDS+CDN","C":"RDS+MTS","D":"OSS+CDN"},"answer":["D"],"explanation":"阿里云的 OSS（对象存储服务）可以用于存储大量的非结构化数据，如图片、视频等，而 CDN（内容 分发网络）可以将数据缓存到离用户最近的节点，提高用户访问速度，因此，OSS+CDN 是解决这个问题的最 佳组合。RDS 是阿里云的关系型数据库服务，主要用于存储结构化数据，而 MTS 是阿里云的媒体处理服务， 主要用于视频转码、编辑等，与题目中的问题关系不大。"},{"id":416,"question":"抢占式实例是阿里云云服务器 ECS 的一种计费方式。下列关于这种计费方式的说法，正确的是（）。","options":{"A":"实例的市场价低于用户出价，并且库存充足，用户将会创建实例以出价进行计费","B":"抢占式实例不支持变配","C":"用户创建的抢占式实例一旦市场价超过用户出价，实例将会被立刻释放","D":"用户成功创建抢占式实例后，该实例不会自动释放，除非管理员手动释放"},"answer":["B"],"explanation":"解析：价格随市场供需变化而浮动，可低至按量付费的 1 折。 随时可以释放实例，但系统也可能因 为市场价格变化或实例规格库存不足而自动释放实例。 抢占式实例不支持变更实例规格。 https://help.aliyun.com/zh/ecs/product-overview/instance- types?spm=a2c4g.11186623.0.i2#concept-1937440"},{"id":417,"question":"对于 IP：140.205.32.13，计算它的十进制数字表达方式，它的值应该是","options":{"A":"2362253325","B":"1362253335","C":"1362253325","D":"2632253335"},"answer":["A"],"explanation":"140256^3+205256^2+32*256+13 =2348 810 240 + 13 434 880 + 8192 +13 =2362253325"},{"id":418,"question":"为了在 WordPress 网站增加微博元素，提升网站的互动性，可以通过什么方式来实现？","options":{"A":"CNZZ 数据专家服务","B":"博客挂件工具","C":"Smartideo 插件","D":"WordPress 网站自带功能"},"answer":["B"],"explanation":"在 WordPress 网站中，如果想要增加微博元素，提升网站的互动性，可以通过使用博客挂件工具来实 现。博客挂件工具可以帮助我们在网站上添加各种功能，包括微博元素，从而提升网站的互动性。而 CNZZ 数据专家服务、Smartideo 插件和 WordPress 网站自带功能并不能直接实现这一功能。"},{"id":419,"question":"云计算是商业计算模式，下面关于阿里云云计算的特点描述正确的有？","options":{"A":"按需分配资源","B":"具有高可靠性","C":"由阿里负责所有安全，用户无需关系","D":"支持多租户，租户资源是默认共通"},"answer":["A","B"],"explanation":""},{"id":420,"question":"云计算服务与自建 IDC 相比，具有很大的便利性。下面关于云计算的便利性说法中，正确的是？","options":{"A":"用户按需获得计算，不需要按照峰值设计","B":"用户需要维护硬件和软件资源","C":"云中有完备的数据备份策略，用户可以直接使用","D":"安全工作不再需要用户关心"},"answer":["A","C"],"explanation":""},{"id":421,"question":"下列关于阿里云内容分发网络 CDN 中设置加速域名的说法中，正确的是？","options":{"A":"可以使用泛域名","B":"可以使用中文域名","C":"必须合法且符合 CDN 业务规范","D":"可以重复添加，按照不同加速情况做不同加速配置"},"answer":["A","C"],"explanation":"“支持泛域名加速，不支持中文域名加速 加速域名不允许重复添加 加速内容必须合法且符合 CDN 业 务规范 https://help.aliyun.com/document_detail/122181.html"},{"id":422,"question":"购买阿里云云服务器 ECS 后，需要用户来进行维护的部分有？","options":{"A":"电力系统","B":"应用软件的升级","C":"数据的备份","D":"网络设备的检查"},"answer":["B","C"],"explanation":"阿里云云服务器 ECS 是一种虚拟化的服务器，用户购买后，阿里云会负责硬件、电力系统和网络设备 的维护，而用户需要负责的是自己的应用软件的升级和数据的备份。因此，正确选项是应用软件的升级和数 据的备份。"},{"id":423,"question":"高性能科学计算等应用对主机的计算能力有非常高的要求，下列阿里云 ECS 实例规格中可以满足的是？","options":{"A":"ecs.r6e.xlarge","B":"ecs.r6e.8xlarge","C":"ecs.c6e.large","D":"ecs.c6e.2xlarge"},"answer":["C","D"],"explanation":"“内存平衡增强型实例规格族 r6e 计算平衡增强型实例规格族 c6e”"},{"id":424,"question":"小丽是一名大学生，刚注册成为阿里云的用户，正在尝试创建一台 ECS，在创建订单时，以下哪些指标 会影响到 ECS 提供服务的性能？","options":{"A":"带宽的大小","B":"CPU 与内存的大小","C":"磁盘的性能","D":"网络的类型（是经典网络还是专有网络）"},"answer":["A","B","C"],"explanation":"ECS 的网络的类型对对 ECS 的性能没有影响。"},{"id":425,"question":"阿里云云服务器 ECS 中的云硬盘可以扩容增大存储空间。在执行扩容操作时，要求云服务器 ECS 实例的 状态是？","options":{"A":"运行中（Running）","B":"停止中（Stopping）","C":"已停止（Stopped）","D":"启动中（Starting）"},"answer":["A","C"],"explanation":"在阿里云云服务器 ECS 中，云硬盘扩容可以在云服务器 ECS 实例的“运行中”和“已停止”两种状态 下进行。在“停止中”和“启动中”状态下，由于系统资源正在进行调整，无法进行硬盘扩容操作。"},{"id":426,"question":"注册域名时必须要提供的信息包括什么？（正确答案的数量 3 个）","options":{"A":"注册年限","B":"域名","C":"域名的用途","D":"域名所指向的服务器 IP","E":"域名所有人信息"},"answer":["A","B","E"],"explanation":"注册域名时，必须要提供的信息包括注册年限、域名以及域名所有人信息。注册年限是指你想要拥有 这个域名的时间长度。域名是你想要注册的网站名称。域名所有人信息包括所有人的姓名、地址、电话等信 息，这些信息是为了在有争议时能够确定域名的所有权。而域名的用途和域名所指向的服务器 IP 并不是在 注册时必须提供的信息，这些信息可以在域名注册后再进行设置。"},{"id":427,"question":"通过内容分发网络 CDN 为服务提供访问加速时，会发生回源的情况是？","options":{"A":"CDN 节点没有缓存到访问资源","B":"CDN 节点中缓存的资源已经过期","C":"回源源站不支持 IP 回源","D":"回源的源站必须是阿里云内部，内网可以互通"},"answer":["A","B"],"explanation":"内容分发网络 CDN 通过将源站的内容分发到各个节点，使用户可以就近获取所需内容，提高访问速度 和效率。当 CDN 节点没有缓存到访问资源或者 CDN 节点中缓存的资源已经过期时，会发生回源的情况，即 CDN 节点会向源站请求最新的内容。而回源源站是否支持 IP 回源，以及回源的源站是否必须是阿里云内部， 内网可以互通，这两个选项与题干中的“回源的情况”无关，所以不是正确选项。"},{"id":428,"question":"以下哪种存储最适合应用于阿里云弹性裸金属服务器？","options":{"A":"本地盘","B":"SSD 云盘","C":"高效云盘","D":"ESSD 云盘"},"answer":["D"],"explanation":"阿里云弹性裸金属服务器是一种高性能、高稳定性的服务器，对存储的性能和稳定性要求较高。ESSD 云盘是阿里云的一种企业级 SSD，具有超高的 I/O 性能和稳定性，最适合应用于阿里云弹性裸金属服务器。"},{"id":429,"question":"云计算有多种部署模式，其中需要用户拥有自己的机房和硬件设施的部署模式有哪些？","options":{"A":"专有云","B":"公有云","C":"混合云","D":"行业云"},"answer":["A","C","D"],"explanation":""},{"id":430,"question":"以下哪些攻击属于 DDoS 的方式。（答案 2 个）","options":{"A":"wed shell","B":"SQL 注入","C":"ACK-flood","D":"DNS-flood"},"answer":["C","D"],"explanation":"分布式拒绝服务攻击（DDoS）是一种常见的网络攻击方式，主要是通过大量合法请求占用网络资源， 使得正常用户无法访问。在选项中，ACK-flood 和 DNS-flood 都是 DDoS 攻击的方式，而 wed shell 和 SQL 注 入则属于其他类型的攻击方式。因此，正确答案是 ACK-flood 和 DNS-flood。"},{"id":431,"question":"以下哪些旁路信道可以被攻击者利用发起攻击（ ）。","options":{"A":"代码运行时间;","B":"芯片运行功耗;","C":"设备产生的电磁辐射;","D":"设备产生的声波;"},"answer":["A","B","C","D"],"explanation":""},{"id":432,"question":"常见的硬件故障注入攻击方式有（ ）。","options":{"A":"基于激光的故障注入攻击;","B":"基于电磁的故障注入攻击;","C":"基于处理器电压的故障注入攻击;","D":"基于处理器频率的故障注入攻击;"},"answer":["A","B","C","D"],"explanation":""},{"id":433,"question":"硬件木马的检测方法有（ ）。","options":{"A":"基于逻辑测试检测硬件木马;","B":"基于芯片的旁路信道参数检测硬件木马;","C":"基于逆向工程检测硬件木马;","D":"基于恶意代码扫描检测硬件木马;"},"answer":["A","B","C"],"explanation":""},{"id":434,"question":"物理不可克隆函数（Physical Unclonable Function, PUF）按照实现方法可分为（ ）。","options":{"A":"非电子 PUF;","B":"模拟电路 PUF;","C":"数字电路 PUF;","D":"软件 PUF;"},"answer":["A","B","C"],"explanation":""},{"id":435,"question":"隔离技术一般可分为（ ）。","options":{"A":"软件隔离技术;","B":"硬件隔离技术;","C":"系统级隔离技术;","D":"代码隔离技术;"},"answer":["A","B","C"],"explanation":""},{"id":436,"question":"下列哪些内存区段具备可执行权限（ ）。","options":{"A":"堆区（Heap）","B":"栈区（Stack）","C":"文本段（Text Segment）","D":"BSS 段（BSS Segment）"},"answer":["C"],"explanation":"本题考查内存段的权限。"},{"id":437,"question":"莫里斯蠕虫病毒是第一个蠕虫病毒，它具体利用了哪种类型的漏洞（ ）。","options":{"A":"堆区溢出","B":"微处理器架构侧信道","C":"栈区溢出","D":"网络协议漏洞"},"answer":["C"],"explanation":"莫里斯蠕虫病毒采用 gets 函数构造栈溢出。"},{"id":438,"question":"下列内存区段增长方是向低地址方向的有（ ）。","options":{"A":"文本段","B":"数据段","C":"堆区","D":"栈区"},"answer":["D"],"explanation":"本题考查内存段的布局特征。"},{"id":439,"question":"使操作系统下受害进程产生攻击者期望的异常行为的攻击效果被称为（ ）。","options":{"A":"进程的控制流劫持","B":"权限提升","C":"数据窃取","D":"拒绝服务"},"answer":["A"],"explanation":"本题考查控制流劫持的定义。"},{"id":440,"question":"在函数调用的过程当中，EBP 寄存器被用于保存（ ）。","options":{"A":"主调函数的栈帧基地址","B":"被调函数的栈帧基地址","C":"返回地址","D":"局部变量起始地址"},"answer":["A"],"explanation":"本题考查函数调用历程。"},{"id":441,"question":"在函数调用历程当中，EAX 寄存被用于保存（ ）。","options":{"A":"函数返回地址","B":"主调函数的栈帧基地址","C":"被调函数的栈帧基地址","D":"函数返回值"},"answer":["D"],"explanation":"本题考查函数调用历程。"},{"id":442,"question":"著名的 OpenSSL 心脏滴血漏洞属于哪一类堆区漏洞（ ）。","options":{"A":"Heap-Overread","B":"Heap-Overflow","C":"Double-Free","D":"Use-After-Free"},"answer":["A"],"explanation":"心脏滴血漏洞通过越界读取窃取信息。"},{"id":443,"quest ,"explanation":"本题考查 ASLR 的原理。"},{"id":455,"question":"TCP/IP 协议栈安全的研究范畴不包括（ ）？","options":{"A":"协议栈的安全漏洞","B":"侧信道","C":"协议栈不当实现","D":"掉电、硬盘损坏等随机故障"},"answer":["D"],"explanation":""},{"id":456,"question":"以太网网卡的默认 MTU 大小为（ ）字节。","options":{"A":"1000","B":"1500","C":"2000","D":"3000"},"answer":["B"],"explanation":""},{"id":457,"question":"ping flooding 是一种基于（ ）协议的 DDoS 攻击，攻击者伪装成受害主机，广播发送大量的 ping 请 求，然后短时间内受害主机就会收到大量的回复，消耗主机资源，主机资源耗尽后就会瘫痪或者无法提供其 他服务。","options":{"A":"IP","B":"TCP","C":"UDP","D":"ICMP"},"answer":["D"],"explanation":""},{"id":458,"question":"TCP 源端口的范围是[0，（ ）]。","options":{"A":"1023","B":"4095","C":"32767","D":"65535"},"answer":["D"],"explanation":""},{"id":459,"question":"常见的 Web 威胁不包括（ ）？","options":{"A":"跨站脚本攻击 XSS","B":"SQL 注入","C":"跨站请求伪造","D":"ARP 污染"},"answer":["D"],"explanation":""},{"id":460,"question":"购买了 Web 应用防火墙 WAF 后，需要将域名解析至 WAF 上，此时需要修改 DNS 的记录类型是？","options":{"A":"A","B":"MX","C":"PTR","D":"CNAME"},"answer":["D"],"explanation":"添加网站域名后，您必须使用 WAF 的 CNAME 地址（或 IP 地址）修改域名的 DNS 解析设置，将网站的 Web 请求解析到 WAF 进行安全防护"},{"id":461,"question":"关于阿里云块存储分区格式的说法，下列描述正确的是（）。","options":{"A":"超过 2T 的云盘使用 MBR 也可以管理，只是效率不如 GPT","B":"GPT 也可以管理少于 2T 的云盘空间","C":"MBR 和 GPT 分区格式可以互相随意转换","D":"GPT 磁盘中有明确的主分区的划分"},"answer":["B"],"explanation":"GPT：能够识别大于 2 TiB 的分区，创建分区数量无限制。同样可以管理小于 2TB 的分区。MBR：只能 识别小于或等于 2 TiB 的分区，最多创建 4 个分区。"},{"id":462,"question":"阿里云云数据库 RDS MySQL 包括产品系列是？","options":{"A":"基础版","B":"高可用版","C":"三节点版","D":"集群版","E":"双活版"},"answer":["A","B","D"],"explanation":"云数据库 RDS 的实例包括基础版、高可用版、集群版。 参考链接： https://help.aliyun.com/document_detail/55665.html"},{"id":463,"question":"用户可以选择阿里云云数据库 RDS 或者自行构建数据库系统，下面说法中错误的是？","options":{"A":"云数据库 RDS 可以灵活的根据业务进行调整，减少用户初期投入","B":"云数据库 RDS 的所有数据管理和维护工作由阿里云完成","C":"云数据库 RDS 提供多种规格供用户选择","D":"用户自建的数据库需要自行部署可靠性和容灾，成本较高"},"answer":["B"],"explanation":"RDS 数据管理和维护应是由用户来维护"},{"id":464,"question":"单台阿里云云服务器 ECS 最多可以添加数据盘的数量是？","options":{"A":"1","B":"5","C":"16","D":"不限"},"answer":["C"],"explanation":"单台 ECS 最大添加数据盘的数量为 16 块"},{"id":465,"question":"在阿里云专有网络 VPC 中，实现资源访问控制的是？","options":{"A":"交换机","B":"路由器","C":"网络 ACL","D":"网段"},"answer":["C"],"explanation":"在阿里云上，可以通过安全组、网络 ACL、路由策略或网络专线来控制虚拟网络的访问权限"},{"id":466,"question":"下面关于负载均衡 SLB 中后端服务器的说法，不正确的是？","options":{"A":"后端服务器的配置可以不同","B":"后端服务器操作系统可以不同","C":"后端服务器可以没有公网 IP","D":"后端服务器可以属于不同地域"},"answer":["D"],"explanation":"SLB 后端服务器必须在同一地域下"},{"id":467,"question":"在阿里云弹性伸缩服务 ESS 中，自动创建的云服务器 CS 的计费方式是？","options":{"A":"按量付费","B":"包年包月","C":"按量付费和包年包月由用户自行选择","D":"资源包计费"},"answer":["A"],"explanation":"弹性伸缩扩容活动中自动创建的 ECS 实例支持按量付费和抢占式实例计费方式"},{"id":468,"question":"下列应用协议中，可以在阿里云负载均衡 SLB 中直接部署的是？","options":{"A":"SMTP","B":"HTTP","C":"HTTPS","D":"SSH"},"answer":["B","C"],"explanation":"负载均衡基础架构是采用集群部署，提供四层（TCP 协议和 UDP 协议）和七层（HTTP 和 HTTPS 协议） 的负载均衡，可实现会话同步，以消除服务器单点故障，提升冗余，保证服务的稳定性"},{"id":469,"question":"不适合存放在对象存储 OSS 中的是下列哪种数据类型？","options":{"A":"高清图片","B":"备份文件","C":"视频文件","D":"关系型数据"},"answer":["D"],"explanation":"阿里云对象存储 OSS（Object Storage Service）为您提供基于网络的数据存取服务。使用 OSS，您 可以通过网络随时存储和调用包括文本、图片、音视频在内的各类数据文件。 关系型数据使用 RDS 数据库 进行保存 https://help.aliyun.com/document_detail/31883.html"},{"id":470,"question":"下面关于阿里云对象存储 OSS 的说法中，正确的是？","options":{"A":"适合存放结构化数据","B":"用户上传文件至对象存储 OSS 中不会收取流量费用","C":"对象存储 OSS 中数据只能为阿里云中云服务器 ECS 提供访问","D":"用户可以将 MySQL 数据迁移至对象存储 OSS"},"answer":["B"],"explanation":"OSS 使用时上传没有费用 阿里云对象存储 OSS（Object Storage Service）是一款海量、安全、低成 本、高可靠的云存储服务，可提供 99.9999999999%（12 个 9）的数据持久性，99.995%的数据可用性。多种 存储类型供选择，全面优化存储成本。"},{"id":471,"question":"阿里云通过负载均衡 SLB 提高服务的可用性，其中七层负载均衡流量转发的实现方式是？","options":{"A":"Nginx","B":"Tomcat","C":"LVS","D":"Tengine"},"answer":["D"],"explanation":"四层为 LVS，七层为 Tengine https://help.aliyun.com/document_detail/85940.html#section- jcv-ghn-vdb"},{"id":472,"question":"不同的阿里云专有网络 VPC 默认是不能互通的。实现不同 VPC 的互通，可以使用的阿里云产品有","options":{"A":"NAT 网关","B":"智能接入网关","C":"VPN 网关","D":"弹性公网 IP"},"answer":["C"],"explanation":"智能接入网关实现的是线下 IDC 到 VPC 的连接通道。vpn 可以实现不同 VPC 之间的连接 https://help.aliyun.com/document_detail/53597.html"},{"id":473,"question":"阿里云负载均衡 SLB 由三部分组成，下列不包括的是（）。","options":{"A":"负载均衡实例","B":"生命周期","C":"监听","D":"后端服务器"},"answer":["B"],"explanation":"负载均衡 SLB 组成有三部分：实例、监听、后端服务器。 参考链接： https://help.aliyun.com/document_detail/27539.html"},{"id":474,"question":"为了节省成本，对于医疗影像需要长时间保存的数据可以选择对象存储 OSS 中的存储类型是？","options":{"A":"标准存储","B":"高频访问","C":"低频访问","D":"归档存储"},"answer":["D"],"explanation":"归档存储适用于数据长期保存的业务场景，例如档案数据、医疗影像、科学资料、影视素材等。 参 考链接：https://help.aliyun.com/document_detail/51374.html"},{"id":475,"question":"按量付费 ECS 实例在启用节省停机模式后，并停止实例，其中可能不会被回收并继续收费的资源是 （）。","options":{"A":"vCPU","B":"内存","C":"固定公网 IP 地址","D":"系统盘"},"answer":["D"],"explanation":"不支持节省停机模式的 ECS 资源（即，资源会保留并继续收费，收费项与按量计费一致）包括但不限 于：系统盘、实例上挂载的数据盘、弹性公网 IP（EIP）和 EIP 带宽、镜像、快照 参考链接： https://help.aliyun.com/document_detail/63353.htm?spm=a2c4g.11186623.0.0.39127312knDxJc#concep t-js1-1fd-5db"},{"id":476,"question":"用户在阿里云中开通对象存储 OSS 后，默认的计费方式是？","options":{"A":"按量付费","B":"包年包月","C":"带宽计费","D":"不计费"},"answer":["A"],"explanation":"OSS 默认使用按量付费，按量付费是一种先使用后付费的计费方式。 https://help.aliyun.com/document_detail/450471.html?spm=a2c4g.11186623.0.0.4b7f7312oVL23T"},{"id":477,"question":"选择阿里云块存储时，需要关注性能指标。下面需要管理员关注的块存储性能指标是？","options":{"A":"IOPS","B":"吞吐量","C":"访问时延","D":"接口"},"answer":["A","B","C"],"explanation":"块存储关注的性能指标有：IOPS、吞吐量、访问时延、容量 参考链接： https://help.aliyun.com/document_detail/25382.htm?spm=a2c4g.11186623.0.0.354a53a68l1Wrz#concep t-ytm-vwj-ydb"},{"id":478,"question":"在阿里云对象存储 OSS 中，用户想使用图形化工具上传和下载对象文件 Object，可以使用的工具是？","options":{"A":"ossbrowser","B":"ossutil","C":"osscmd","D":"ossfs"},"answer":["A"],"explanation":"ossbrowser 是阿里云官方提供的 OSS 图形化管理工具，提供类似 Windows 资源管理器的功能。使用 ossbrowser，您可以快速完成存储空间（Bucket）和文件（Object）的相关操作。 https://help.aliyun.com/document_detail/61872.html"},{"id":479,"question":"公司的业务没有明显的变化规律，偶尔会爆发大量的访问请求，采用阿里云弹性伸缩服务 ESS 时，最适 合的伸缩模式是？","options":{"A":"定时模式","B":"动态模式","C":"固定数量模式","D":"健康模式"},"answer":["B"],"explanation":"无规律的业务量波动，可以利用弹性伸缩的报警任务，由阿里云自动根据 CPU 使用率等衡量指标进行 弹性伸缩"},{"id":480,"question":"弹性伸缩 ESS 中设定最小实例数为 5 台，最大实例数为 10 台，当前实例数量为 8 台，当执行伸缩规则 减少 5 台 ECS 的时候，ESS 将会释放的 ECS 数量是？","options":{"A":"1","B":"2","C":"3","D":"5"},"answer":["C"],"explanation":"AS 中设定最小实例数后，伸缩组中的 ECS 数量不会低于最小实例数。"},{"id":481,"question":"阿里云云数据库 RDS MySQL 支持多种产品系列，其中不支持的是（）。","options":{"A":"基础版","B":"高可用版","C":"集群版","D":"三节点企业版"},"answer":["D"],"explanation":"云数据库 RDS 的实例包括基础版、高可用版、集群版。 参考链接： https://help.aliyun.com/document_detail/55665.html"},{"id":482,"question":"创建阿里云专有网络 VPC 后，不属于 VPC 可用区资源的是（）。","options":{"A":"云服务器 ECS","B":"云数据库 RDS","C":"弹性伸缩服务 ESS","D":"负载均衡 SLB"},"answer":["C"],"explanation":"阿里云专有网络 VPC 的可用区资源主要包括云服务器 ECS、云数据库 RDS 和负载均衡 SLB，而弹性伸 缩服务 ESS 并不属于 VPC 可用区资源。因此，正确答案是弹性伸缩服务 ESS。"},{"id":483,"question":"用户在工作中有大量的备份文件需要存储，考虑经济原因可以采用哪种阿里云中的存储服务？","options":{"A":"本地 SSD 盘","B":"普通云盘","C":"对象存储 OSS","D":"云数据库 RDS"},"answer":["C"],"explanation":"对于长期备份数据，不需要经常读取时可采用 OSS 对象存储来保存。 提供高持久性、较低存储成本 的对象存储服务。 参考链接：https://help.aliyun.com/document_detail/51374.html"},{"id":484,"question":"下面关于专有网络 VPC 互通的说法中，错误的是？","options":{"A":"不同 VPC 默认不允许通信，需要借助于其他组件或服务才可实现","B":"不同地域的 VPC 默认不能互通","C":"相同地域的 VPC 默认可以直接互通","D":"不同账号的 VPC 也可以实现互通"},"answer":["C"],"explanation":""},{"id":485,"question":"如果想要修改已创建的存储空间 Bucket 名称，可以采取的做法是？","options":{"A":"设置为私有后，由创建者直接重命名","B":"设置为公共读写后，可以直接重命名","C":"直接重命名","D":"创建新的 Bucket，然后复制对象文件至新 Bucket，再删除旧的 Bucket"},"answer":["D"],"explanation":"Bucket 名称创建后默认不允许修改"},{"id":486,"question":"在阿里云云服务器 ECS 的使用过程中，增加一块云盘以存放数据文件。如果使用 MBR 格式管理该云盘分 区，此云盘最多可以创建主分区的数量是？","options":{"A":"1","B":"4","C":"16","D":"不限"},"answer":["B"],"explanation":"MBR：只能识别小于或等于 2 TiB 的分区，最多创建 4 个主分区。"},{"id":487,"question":"在阿里云 Web 应用防火墙 WAF 使用中，需要添加域名。下面关于添加域名的说法，错误的是？","options":{"A":"域名一键接入仅支持阿里云中关联的域名","B":"域名一键接入可以自动添加网站信息，域名 DNS 解析需要管理员手动修改","C":"手动添加域名可以由管理员手动配置网站域名以及服务器地址等信息","D":"手动添加域名，要求管理员手动修改 DNS 域名解析"},"answer":["B"],"explanation":"您可在 ALB 等云产品任意区域的实例（包括内网实例）一键开启 WAF 安全防护，无需修改 DNS、配置 证书/端口/回源算法等复杂的接入转发配置"},{"id":488,"question":"下面关于弹性伸缩 ESS 的说法中，错误的是？","options":{"A":"可以释放云服务器 ECS 节约成本","B":"可以保持云服务器 ECS 的数量以保证服务可用性","C":"可以在业务不繁忙时段降低云服务器 ECS 带宽以节省成本","D":"可以搭配负载均衡 SLB 提供高可用"},"answer":["C"],"explanation":"弹性伸缩可以对服务器数量进行增加或减少，不能对带宽进行控制 弹性伸缩具有自动化、降成本、 高可用、灵活智能以及易审计等优势。 弹性伸缩按需取用，自动释放，提高资源的利用率，有效降低成 本。 参考链接：https://help.aliyun.com/document_detail/25859.html"},{"id":489,"question":"在 Linux 操作系统的云服务器 ECS 中增加一块数据盘后，如果只想查看当前 ECS 主机中硬盘分区的信 息，可以使用的命令是？","options":{"A":"fdisk","B":"fidsk -u","C":"fdisk -a","D":"fdisk -l"},"answer":["D"],"explanation":"查看实例上的磁盘分区信息： fdisk -l"},{"id":490,"question":"实现阿里云中不同 VPC 的互通，可以使用的是？","options":{"A":"云企业网","B":"VPN 网关","C":"内容分发网络 CDN","D":"负载均衡 SLB"},"answer":["A","B"],"explanation":"CD 不是网络连通的产品"},{"id":491,"question":"下面（）场景中适合使用阿里云快照。","options":{"A":"容灾备份","B":"环境复制","C":"数据开发","D":"硬件配置调整"},"answer":["A","B"],"explanation":"推荐您在以下场景中使用快照。 容灾备份：为云盘创建快照，再使用快照创建云盘获取基础数据， 实现同城容灾和异地容灾。 环境复制：使用系统盘快照创建自定义镜像，再使用自定义镜像创建 ECS 实 例，实现环境复制。 提高容错率：          出现操作失误时，能及时回滚数据，降低操作风险， 实现版本回退。 定期创建快照，避免因操作失误或外部攻击等原因导致数据丢失。例如，团队成员不慎在 云盘上存储了错误的数据、ECS 实例被误释放、应用错误导致了数据错误、或者骇客利用应用漏洞恶意删除 业务数据等。        执行重要操作前创建一份快照，常见的重要运维操作包括更换操作系统、应 用软件升级或业务数据迁移等。 参考链接：https://help.aliyun.com/document_detail/25391.html"},{"id":492,"question":"阿里云对象存储 OSS 对比用户自建的对象存储，下面的说法中正确的是？","options":{"A":"多用户资源隔离","B":"免费提供 DDoS 攻击防护","C":"需要自购流量清洗和黑洞设备","D":"扩容比较困难"},"answer":["A","B"],"explanation":"OSS 提供企业级多层次安全防护和防 DDoS 攻击，自动黑洞清洗。 OSS 实行多用户资源隔离机制,支持 异地容灾机制不限制存储空间大小。您可以根据所需存储量无限扩展存储空间，解决了传统硬件存储扩容问 题。 参考链接：https://help.aliyun.com/document_detail/31818.html"},{"id":493,"question":"阿里云弹性伸缩服务 ESS 可以搭配阿里云多个云产品进行使用。下面关于弹性伸缩服务 ESS 搭配阿里云 产品的说法中，正确的是？","options":{"A":"弹性伸缩服务 ESS 可以单独增加或减少云服务器 ECS 实例数","B":"弹性伸缩服务 ESS 可以自动增加包年包月形式的云服务器 ECS","C":"弹性伸缩服务 ESS 可以结合负载均衡 SLB 进行部署","D":"弹性伸缩服务 ESS 可以结合云数据库 RDS 进行部署"},"answer":["C","D"],"explanation":"增加或减少服务器实例不只是包年包月，可以使按量付费，也可使抢占式实例。 参考链接 “https://help.aliyun.com/document_detail/25859.html”"},{"id":494,"question":"阿里云负载均衡 SLB 不能实现的功能是？","options":{"A":"消除单点故障","B":"多可用区容灾","C":"多地域容灾","D":"提高服务可用性"},"answer":["C"],"explanation":"负载均衡 SLB（Server Load Balancer）是一种对流量进行按需分发的服务，通过将流量分发到不同 的后端服务器来扩展应用系统的吞吐能力，并且可以消除系统中的单点故障，提升应用系统的可用性。 参 考链接：https://help.aliyun.com/document_detail/196874.html"},{"id":495,"question":"下列数据类型中（）适合存放在 RDS 关系型数据库。","options":{"A":"图片","B":"工资表","C":"音乐","D":"视频"},"answer":["B"],"explanation":"关系型数据适合在 RDS 数据库中存放，音视频、图片适合在 OSS 非结构化存储中存放。 参考链接： https://help.aliyun.com/document_detail/31817.html"},{"id":496,"question":"用户创建一台 Windows 系统的阿里云云服务器 ECS 后，如果想管理该云服务器 ECS 实例中新增的云盘可 以使用的分区管理工具是？","options":{"A":"设备管理器","B":"网络连接","C":"磁盘管理","D":"计算机管理"},"answer":["C"],"explanation":"参考链接：https://help.aliyun.com/document_detail/25418.html"},{"id":497,"question":"弹性伸缩服务 ESS 需要搭配阿里云其他服务才能正常工作，其中可以实现服务可用性的是？","options":{"A":"云服务器 ECS","B":"云数据库 RDS","C":"负载均衡 SLB","D":"对象存储 OSS"},"answer":["A"],"explanation":"弹性伸缩（Auto Scaling）是根据业务需求和策略自动调整计算能力（即实例数量）的服务。您可以 指定实例的类型，即 ECS 实例或 ECI 实例。 参考链接： https://help.aliyun.com/document_detail/25857.html"},{"id":498,"question":"购买阿里云云数据库 RDS MySQL 后，使用过程中无法连接到该数据库，导致该问题的原因可能是（）。","options":{"A":"云数据库 RDS 的白名单没有增加客户端访向 IP","B":"云数据库 RDS 数据库为了安全考虑不允许云外用户连接","C":"云服务器 ECS 和云数据库 RDS 地域不同，使用内网连接","D":"云服务器 ECS 和 RDS 地域不同，使用外网连接"},"answer":["A","C"],"explanation":"RDS 要将访问 IP 添加至白名单 通过内网访问时，要求 ECS 和 RDS 同属一个账号、位于同一地域、并 添加 ECS IP 到 RDS 白名单。 参考链接： https://help.aliyun.com/document_detail/41843.html?spm=5176.21213303.J_6704733920.7.745853c9cF zH6t&scm=20140722.S_help%40%40%E6%96%87%E6%A1%A3%40%4041843.S_hot%2Bos0.ID_41843- RL_rds%E6%95%B0%E6%8D%AE%E5%BA%93-LOC_main-OR_ser-V_2-P0_0"},{"id":499,"question":"下列属于阿里云弹性伸缩服务 ESS 适用的场景主要有（）。","options":{"A":"弹性扩张","B":"弹性收缩","C":"弹性自愈","D":"弹性访问"},"answer":["A","B","C"],"explanation":"扩容、缩容和弹性自愈（即健康检查）场景 参考链接： https://help.aliyun.com/document_detail/25879.html"},{"id":500,"question":"阿里云云安全中心是阿里云为了提高云安全推出的产品。下面关于云安全中心的说法描述正确的有 （）。","options":{"A":"支持病毒云查杀","B":"阿里云云服务器 ECS 无需任何配置默认支持云安全中心管理","C":"云安全中心仅支持阿里云中服务器","D":"可以对主机入侵事件进行回溯"},"answer":["A","D"],"explanation":"云安全中心防护服务器依赖于云安全中心 Agent 插件，您必须在服务器操作系统上安装云安全中心 Agent 插件，云安全中心才能为您的服务器提供安全防护。 如果您的服务器为非阿里云服务器（包括第三方 云服务器、IDC 服务器），或您的阿里云 ECS 服务器所在地域不在支持一键安装 Agent 的地域范围内，您必 须手动安装 Agent。 参考链接：https://help.aliyun.com/document_detail/68597.html"},{"id":501,"question":"关于阿里云中地域（Region）和可用区（Zone）的说法，下列描述正确的是（）。","options":{"A":"同 Region 下 Zone 之间是可以通过阿里云内网进行互通，没有故障隔离","B":"不同 Region 之间可以通过阿里云内网进行互通，业务为了更高的可用性可以部署在多个 Region 中","C":"只有相同的 Zone 才可以实现内网互通，同一个业务不要跨 Zone 进行部署","D":"同 Region 下不同 Zone 代表同一个地域下不同机房，可以内网实现互通也可以做到故障隔离"},"answer":["D"],"explanation":"在同一地域内，可用区与可用区之间内网互通。各可用区之间可以实现故障隔离，即如果一个可用区 出现故障，则不会影响其他可用区的正常运行。 参考链接： https://help.aliyun.com/document_detail/40654.htm?spm=a2c4g.11186623.0.0.654c29ec0eP2db#concep t-2459516"},{"id":502,"question":"阿里云负载均衡 SLB 支持多种协议监听。下列属于负载均衡 SLB 监听协议类型有（）。","options":{"A":"TCP","B":"HTTP","C":"FTP","D":"SMTP","E":"HTTPS"},"answer":["A","B","E"],"explanation":"ABD SLB 提供四层（TCP 协议和 UDP 协议）和七层（HTTP 和 HTTPS 协议）的负载均衡参考链接： https://help.aliyun.com/document_detail/27544.html"},{"id":503,"question":"使用阿里云对象存储 OSS 管理文件时，可以获取文件的当前地址创建对外访问的链接，这个分享链接使 用的协议是？","options":{"A":"TCP","B":"UDP","C":"HTTP","D":"ICMP"},"answer":["C"],"explanation":"默认使用 HTTPS 协议生成文件 URL。如需使用 HTTP 协议生成文件 URL，请关闭使用 HTTPS 开关。 参 考链接：https://help.aliyun.com/document_detail/200369.html"},{"id":504,"question":"弹性伸缩服务 ESS 创建成功后，不能修改的属性是？","options":{"A":"伸缩组的名称","B":"负载均衡实例","C":"虚拟交换机","D":"地域"},"answer":["D"],"explanation":"弹性伸缩创建后不能修改是地域"},{"id":505,"question":"下列关于阿里云 PolarDB 的说法描述错误的是（）。","options":{"A":"PolarDB 是关系型云数据库","B":"PolarDB 数据库引擎和数据存放在同一个节点，可以有效降低 I/O 延时","C":"PolarDB 采用集群架构，一个 Write 节点（主节点）和多个 Reader 节点（读节点）","D":"PolarDB 支持配置的升降级和故障恢复"},"answer":["B"],"explanation":"PolarDB 是阿里巴巴自研的新一代云原生关系型数据库，PolarDB 采用存储和计算分离的架构，所有 计算节点共享一份数据，提供分钟级的配置升降级、秒级的故障恢复、全局数据一致性和免费的数据备份容 灾服务。 参考链接：https://help.aliyun.com/document_detail/58764.html"},{"id":506,"question":"云服务器 ECS 属于云计算 SaaS、PaaS、IaaS 哪一层级的服务？","options":{"A":"SaaS","B":"PaaS","C":"IaaS","D":"Daas"},"answer":["C"],"explanation":"云服务器 ECS(ElasticComputeService)是阿里云提供的性能卓越、稳定可靠、弹性扩展的 IaaS(InfrastructureasaService)级别云计算服务。"},{"id":507,"question":"使用数据传输服务 DTS，不能将下列哪种类型的数据库实例迁移到阿里云云数据库 RDS MySQL 版实例 中？","options":{"A":"本地 IDC 自建数据库","B":"本地数据仓库实例","C":"RDS 实例","D":"ECS 自建数据库"},"answer":["B"],"explanation":"使用数据传输服务 DTS，不能将本地数据仓库实例类型的数据库实例迁移到阿里云云数据库 RDS MySQL 版实例中。"},{"id":508,"question":"下列关于阿里云 ECS 相关概念描述错误的是（）。","options":{"A":"安全组：虚拟防火墙，隔离不需要的访问源","B":"镜像：为云服务器 ECS 实例提供操作系统、初始化应用数据、预装的软件","C":"磁盘：用于存储数据，根据存储量选择磁盘容量，可以随时扩写","D":"地域与可用区：用户所在的位置"},"answer":["D"],"explanation":"地域与可用区：服务器所在的位置。"},{"id":509,"question":"我们常说的互联网数据中心的英文简写是什么？","options":{"A":"DC","B":"IDC","C":"SaaS","D":"Cloud"},"answer":["B"],"explanation":"数据中心，英文缩写叫 IDC，也就是 Internet Data Center（互联网数据中心）。 之所以不直接称 之为“DC”，主要是为了避免和直流电（Direct Current）混淆。而且，现在的数据中心普遍都接入互联 网，以互联网业务为主，所以，叫“IDC”也更准确。"},{"id":510,"question":"选项中哪一个不属于云计算提供的服务资源？","options":{"A":"网络","B":"存储","C":"服务器","D":"安全","E":"应用"},"answer":["D"],"explanation":"云计算是一种按使用量付费的一种服务模式，而不是单纯的指某项具体的技术应用或标准，这种模式 提供可用的、便捷的、按需访问网络上的资源（资源包括网络，服务器，存储，应用软件，服务）。只需投 入很少的管理工作，或与服务供应商进行很少的交互，就可以让这些资源能够被快速提供。"},{"id":511,"question":"随着技术的发展，云计算将会向第四种模式发展，第四种服务模式将是什么？","options":{"A":"SaaS","B":"PaaS","C":"IaaS","D":"S2S"},"answer":["D"],"explanation":"云计算的服务模式目前主要有三种：基础架构即服务（IaaS）、平台即服务（PaaS）和软件即服务 （SaaS），这三种是目前主流的云计算服务模式，未来，随着技术的发展，云计算将会向第四种模式发展： S2S（服务到服务）。"},{"id":512,"question":"云计算典型的分类不包括？","options":{"A":"云上云","B":"混合云","C":"私有云","D":"公有云"},"answer":["A"],"explanation":"云计算一般包括公有云、私有云和混合云三种分类。"},{"id":513,"question":"阿里云提供的性能卓越、稳定可靠、弹性扩展的 IaaS（Infrastructure as a Service）级别云计算服 务是阿里云什么产品？","options":{"A":"OSS","B":"ECS","C":"CDN","D":"ACK"},"answer":["B"],"explanation":"阿里云 ECS（Elastic Compute Service）是阿里云提供的性能卓越、稳定可靠、弹性扩展的 IaaS （Infrastructure as a Service）级别云计算服务。免去了采购 IT 硬件的前期准备，让用户像使用水、 电、天然气等公共资源一样便捷、高效地使用服务器，实现计算资源的即开即用和弹性伸缩。"},{"id":514,"question":"云计算可以被视为网格计算和（）的融合。","options":{"A":"虚拟化","B":"分布式","C":"动态存储","D":"弹性计算"},"answer":["A"],"explanation":"云计算可以被视为网格计算和虚拟化的融合：即利用网格分布式计算处理能力，将 IT 资源构筑成一 个资源池，再加上成熟的服务器虚拟化、存储虚拟化技术，是用户可以实时的监控和调配资源。"},{"id":515,"question":"云计算的目标是以低成本的方式提供高可靠、（）、规模可伸缩的个性化服务。","options":{"A":"低成本","B":"高效率","C":"高可用","D":"高安全"},"answer":["C"],"explanation":"云计算的目标是以低成本的方式提供高可靠、高可用、规模可伸缩的个性化服务，为了达到这个目 标，需要数据中心管理、虚拟化、海量数据处理、资源管理与调度、QoS 保证、安全与隐私保护等关键技 术。"},{"id":516,"question":"虚拟化是指计算元件在虚拟的而不是真实的基础上运行，下列选项中不能被虚拟化是（）？","options":{"A":"服务器","B":"桌面","C":"存储","D":"网络","E":"管理","F":"应用"},"answer":["E"],"explanation":"服务器虚拟化是将虚拟化技术应用于服务器，将一台服务器虚拟成若干虚拟服务器,在该服务器上可 以支持多个操作系统同时运行。 桌面虚拟化是将计算机终端系统进行虚拟化，以达到桌面使用的安全性和 灵活性。可以通过任何设备，在任何地点，任何时间通过网络访问属于我们个人的桌面系统。 存储虚拟化 是对存储硬件资源进行抽象化表现。 网络虚拟化网络虚拟化就是在一个物理网络上模拟出多个逻辑网络 来。 应用虚拟化是把应用对低层的系统和硬件的依赖抽象出来，可以解决版本不兼容的问题。"},{"id":517,"question":"下列哪个选项不属于虚拟化主流产品？","options":{"A":"Vmware","B":"Citrix","C":"Redhat","D":"HDFS"},"answer":["D"],"explanation":"在所有虚拟化主流产品中，位居领导者象限的分别是 VMWare 和 Microsoft，其他还有 Redhat、 Citrix、华为、oracle 等。"},{"id":518,"question":"（）位于云计算三层架构层次最底端。主要提供计算资源、存储资源、网络资源当成服务提供给用户， 使得用户能够按需获取 IT 基础设施？","options":{"A":"DaaS","B":"IaaS","C":"PaaS","D":"SaaS"},"answer":["B"],"explanation":"基础设施即服务（IaaS）位于云计算三层架构层次最底端。主要提供计算资源、存储资源、网络资源 当成服务提供给用户，使得用户能够按需获取 IT 基础设施。"},{"id":519,"question":"（）位于云计算三层服务架构中的顶端？","options":{"A":"DaaS","B":"IaaS","C":"PaaS","D":"SaaS"},"answer":["D"],"explanation":"软件即服务（SaaS） 位于云计算三层服务架构中的顶端。主要是将软件服务通过网络（主要是互联 网）提供给用户，用户只需要通过浏览器或其他符合要求的设备接入使用即可。"},{"id":520,"question":"第四代神龙架构已经实现完成设备虚拟化、网络存储转发和随路加解密的硬件全加速，百万级节点、 ______ SLA，“0”损耗，安全隔离，飞天+CIPU 体系成型。","options":{"A":"0.98975","B":"0.99975","C":"0.99985","D":"0.99995"},"answer":["B"],"explanation":"现在第四代神龙架构已经实现完成设备虚拟化、网络存储转发和随路加解密的硬件全加速，百万级节 点、99.975% SLA，“0”损耗，安全隔离，飞天+CIPU 体系成型。"},{"id":521,"question":"选项中不属于神龙计算平台的核心组件是？","options":{"A":"神龙资源管控系统","B":"神龙资源调度系统","C":"神龙异常调度系统","D":"神龙 Hypervisor","E":"CIPU","F":"ECS 服务器"},"answer":["F"],"explanation":"神龙计算平台的核心组件：神龙资源管控系统：分布式系统形态，以计算资源生命周期管理为中心的 算力控制自服务；神龙资源调度系统：分布式系统形态，负责计算资源的库存弹性以及算力最佳服务器 placement 的调度决策；神龙异常调度系统：分布式系统形态，用于计算资源链路异常的监控、预测、规避 和批量处理；神龙 Hypervisor：系统软件形态，解决计算资源和实例的虚拟化及其可运维、可调度性的相关 问题，包括 Baremetal & Nearmetal 两种内核能力；CIPU：芯片&硬件形态，前身是 MOC 卡或神龙软硬一体 架构，经过 4 代硬件芯片体系迭代，在同时卸载加速了神龙计算、盘古存储、洛神网络和安全内核的端系统 数据链路后，进化为整个飞天操作系统的云数据中心专用硬件底座。"},{"id":522,"question":"洛神网络平台负载均衡的可用性能够达到多少值？","options":{"A":"0.98975","B":"0.99975","C":"0.99985","D":"0.99995"},"answer":["D"],"explanation":"阿里云公布最新的弹性计算服务等级协议 SLA，单实例的可用性从 99.95%提升至 99.975%，多可用区 多实例可用性从 99.99%提升至 99.995%，均为全球最高水准。"},{"id":523,"question":"下列选项中不属于计算虚拟化的是（）？","options":{"A":"CPU 虚拟化","B":"内存虚拟化","C":"I/O 虚拟化","D":"存储虚拟化"},"answer":["D"],"explanation":"计算虚拟化主要包括 CPU 虚拟化、内存虚拟化、I/O 虚拟化。"},{"id":524,"question":"在 Openstack 的发展过程中出现了很多版本，下列哪一项不是 Openstack 的版本？","options":{"A":"train","B":"yoga","C":"pike","D":"neutron"},"answer":["D"],"explanation":"neutron 是网络组件"},{"id":525,"question":"下列关于对象存储 OSS 的描述正确的是？","options":{"A":"创建对象存储后，可以修改所在地域。","B":"如需所有人访问 OSS 对象存储时，需将权限设置为私有","C":"通过 OSS 对象存储控制台上传文件时最大不能超过 5G。","D":"当 ECS 和对象存储在同一地域下时默认内网互通。"},"answer":["C","D"],"explanation":"对象存储 OSS 在创建后地域无法更改，需所有人都能访问时权限应设置为公共读。 对象存储 OSS 控 制台支持上传大小不超过 5 GB 的文件"},{"id":526,"question":"下列有关创建云原生数据库 PolarDB 的说法正确的是？","options":{"A":"PolarDB 数据库兼容多个数据库版本，比如支持 SQLServer 版。","B":"在 PolarDB 创建时，可以创建多个高权限账户，实现对数据库的管理。","C":"创建 PolarDB 后，如需让 ECS 访问，需将 IP 添加到白名单中。","D":"创建 PolarDB Mysql 后访问的端口为 9090"},"answer":["C"],"explanation":"PolarDB 不支持 SQLServer 版。在创建账户时只能创建一个高权限账户。访问时的端口为 3306"},{"id":527,"question":"专有网络是以下（）级别的资源?","options":{"A":"地域","B":"可用区","C":"全球多地域","D":"跨地域"},"answer":["A"],"explanation":"专有网络创建需要在某地域下创建。"},{"id":528,"question":"专有网络是基于（）技术来实现的","options":{"A":"vlan 技术","B":"三层交换技术","C":"隧道技术","D":"路由限制"},"answer":["C"],"explanation":"是基于目前主流的隧道技术，专有网络是相互隔离的。每个 VPC 都有一个独立的隧道号，一个隧道号 对应着一个虚拟化网络。不同 VPC 之间隧道号不同，因此不同 VPC 之间无法进行通信，天然地进行了隔离。"},{"id":529,"question":"以下选项中属于 Nginx 的负载均衡策略的是","options":{"A":"round robin","B":"random","C":"dh","D":"weight"},"answer":["A","B","D"],"explanation":"Nginx 的负载均衡策略 round robin(轮询) random(随机) weight(权重) fair(按响应时长，三方插件) url_hash(url 的 hash 值) ip_hash(ip 的 hash 值) least_conn(最少连接数)"},{"id":530,"question":"HTTP 状态码 2XX 代表的是（）","options":{"A":"消息","B":"成功","C":"失败","D":"警告"},"answer":["B"],"explanation":"HTTP 常见状态码分类：（1）1xx：消息 （2）2xx：成功 （3）3xx：重定向 （4） 4xx：客户端错误 （5） 5xx：服务器错误"},{"id":531,"question":"阿里云 CDN 带宽输出能力能达到多少？","options":{"A":"200Tbps","B":"180Tbps","C":"150 Tbps","D":"100Tbps"},"answer":["B"],"explanation":"阿里云 CDN 全网带宽输出能力达 180 Tbps https://www.alibabacloud.com/help/zh/alibaba-cloud- cdn/latest/competitive-advantages-of-alibaba-cloud-cdn"},{"id":532,"question":"“KVM 支持实时迁移，在宿主机之间转移正在运行的客户机而不中断服务。”以上文字描述的是 KVM 的 哪个功能特性？","options":{"A":"内存管理","B":"实时迁移","C":"存储和客户机镜像格式","D":"性能"},"answer":["B"],"explanation":"KVM 支持实时迁移，在宿主机之间转移正在运行的客户机而不中断服务。主要是描述的 KVM 实时迁移 的能力。"},{"id":533,"question":"下列关于 ECS 地域和可用区的描述不正确的是？","options":{"A":"一个地域下有多个可用区","B":"在创建专有网络后地域不可更改","C":"同一可用区内互访网络延迟更小","D":"在阿里云下，跨地域访问通过 VPC 中的路由就可以实现互通"},"answer":["D"],"explanation":"跨地域默认无法直接通信，需要借助于云企业网等跨地域互联手段才能实现通信。"},{"id":534,"question":"容器解决了什么问题","options":{"A":"环境一致性","B":"项目打包","C":"微服务","D":"重资产"},"answer":["A","B","C"],"explanation":"容器技术的出现消除了传统的软件部署当中环境一致性、项目打包、项目部署等问题。"},{"id":535,"question":"Docker 的三个基本概念分别是：镜像（Image）、容器（Container）和（）","options":{"A":"网络","B":"仓库","C":"数据卷","D":"Linux 内核"},"answer":["B"],"explanation":"Docker 包括三个基本概念：镜像（Image）、容器（Container）、仓库（Repository）"},{"id":536,"question":"Docker 和传统虚拟化方式的区别包括（）。","options":{"A":"更快速的交付和部署","B":"更高效的虚拟化","C":"更轻松的迁移和扩展","D":"更简单的管理"},"answer":["A","B","C","D"],"explanation":"传统虚拟机技术是虚拟出一套硬件后，在其上运行一个完整操作系统，在该系统上再运行所需应用进 程；而容器内的应用进程直接运行于宿主的内核，容器内没有自己的内核，而且也没有进行硬件虚拟。因此 容器要比传统虚拟机更为轻便"},{"id":537,"question":"（）命令可以启动并运行整个 WordPress 应用程序","options":{"A":"docker-compose run","B":"docker-compose up","C":"docker-compose ok","D":"docker up"},"answer":["B"],"explanation":"运行命令 docker compose up 启动并运行整个 WordPress 应用程序"},{"id":538,"question":"阿里云 ACK 产品形态哪个形态适用于批量任务、突发扩容，以及 CI/CD 测试场景。","options":{"A":"专有版 Kubernetes","B":"托管版 Kubernetes","C":"Serverless Kubernetes","D":"自建版 Kubernetes"},"answer":["C"],"explanation":"阿里云 ACK 产品形态 Serverless Kubernetes 适用于批量任务、突发扩容，以及 CI/CD 测试场景。"},{"id":539,"question":"云计算面临诸多的风险与挑战，包括（）风险。","options":{"A":"物理服务器","B":"用户数据保护","C":"数据跨境","D":"数据删除"},"answer":["B","C","D"],"explanation":"云计算在快速发展的同时，也面临诸多的风险与挑战，其中包括用户数据保护、数据跨境、电子取 证、数据删除、云服务合同风险。"},{"id":540,"question":"阿里云提供了_________的基础安全服务保障用户基础安全。","options":{"A":"网络安全","B":"容器安全","C":"主机安全","D":"数据安全"},"answer":["A","B","C"],"explanation":"阿里云为用户基础安全提供了网络安全、容器安全、主机安全三部分基础安全服务。"},{"id":541,"question":"云安全中心依托（），通过机器学习和数据建模发现潜在的入侵和攻击威胁，建立以云安全中心为核心 的威胁检测体系。","options":{"A":"大数据安全分析平台","B":"计算机","C":"用户资源","D":"云主机"},"answer":["A"],"explanation":"云安全中心依托大数据安全分析平台，通过机器学习和数据建模发现潜在的入侵和攻击威胁，建立以 云安全中心为核心的威胁检测体系。"},{"id":542,"question":"云安全中心（态势感知）作为云上安全管理平台，有哪些优点。","options":{"A":"持续监测","B":"深度防御","C":"全面分析","D":"快速响应"},"answer":["A","B","C","D"],"explanation":"云安全中心（态势感知）是一款集持续监测、深度防御、全面分析、快速响应能力于一体的云上安全 管理平台。"},{"id":543,"question":"监控系统软件有很多种，但不包含下列选项中哪一项？","options":{"A":"zabbix","B":"Prometheus","C":"nginx","D":"nagios"},"answer":["C"],"explanation":"nginx 是一款 web 服务器软件，也可以实现负载均衡的功能，但是不能作为监控服务器软件来使用。"},{"id":544,"question":"基于弹性伸缩的特点，可以解决并适用于哪些企业场景？","options":{"A":"业务量不断波动","B":"业务量稳定","C":"线上业务","D":"线下业务"},"answer":["A","B"],"explanation":"弹性伸缩（Auto Scaling）是根据业务需求和策略自动调整计算能力（即实例数量）的服务。可以指 定实例的类型，即 ECS 实例或 ECI 实例。 在业务需求增长时，弹性伸缩自动增加指定类型的实例，来保证 计算能力；在业务需求下降时，弹性伸缩自动减少指定类型的实例，来节约成本。 弹性伸缩不仅适合业务 量不断波动的应用程序，同时也适合业务量稳定的应用程序。 https://help.aliyun.com/document_detail/25857.html?spm=a2c4g.11186623.0.i48"},{"id":545,"question":"容器是一个（）集合，它将系统的其他资源隔离开来，具有自己独立的资源视图。","options":{"A":"进程","B":"任务","C":"数据","D":"计算"},"answer":["A"],"explanation":"容器就是一个进程集合，它将系统的其他资源隔离开来，具有自己独立的资源视图。"},{"id":546,"question":"容器的核心技术主要包括（）？","options":{"A":"Namespace","B":"Cgroup","C":"rootfs","D":"容器引擎"},"answer":["A","B","C","D"],"explanation":"容器的核心技术主要包括：Namespace、Cgroup、rootfs、容器引擎 。"},{"id":547,"question":"容器技术的出现解决了传统的软件部署当中环境一致性、______、项目部署等问题。","options":{"A":"项目计划","B":"项目执行","C":"项目打包","D":"项目验证"},"answer":["C"],"explanation":"容器技术的出现消除了传统的软件部署当中环境一致性、项目打包、项目部署等问题。"},{"id":548,"question":"使用 Google 公司推出的 ______ 开发实现了 Docker。","options":{"A":"Android","B":"Carbon","C":"Go 语言","D":"Python"},"answer":["C"],"explanation":"Docker 使用 Google 公司推出的 Go 语言进行开发实现，基于 Linux 内核的 cgroup，namespace， 以及 OverlayFS 类的 Union FS 等技术，对进程进行封装隔离。"},{"id":549,"question":"下列 Docker 的实践建议中最佳的是什么？","options":{"A":"一个容器只运行一个进程","B":"一个容器不能运行一个进程","C":"一个容器尽量运行多个进程","D":"一个容器不能运行多个进程"},"answer":["A"],"explanation":"Docker 的最佳实践建议：一个容器只运行一个进程，而实际的应用会由多个组件构成，要运行多个组 件就需要运行多个容器，这就需要对这多个容器进行编排。"},{"id":550,"question":"阿里云 ACK 的产品形态不包括下列哪一项？","options":{"A":"专有版 Kubernetes","B":"Serverless Kubernetes","C":"托管版 Kubernetes","D":"共享版 Kubernetes"},"answer":["D"],"explanation":"阿里云 ACK 产品形态主要有专有版 Kubernetes、托管版 Kubernetes、Serverless Kubernetes。"},{"id":551,"question":"云存储能够节约______。","options":{"A":"网络带宽","B":"存储空间","C":"成本支出","D":"流量压力"},"answer":["B"],"explanation":"云存储泛指通过集群应用、网格技术或分布式文件系统等功能，网络中大量各种不同类型的存储设备 通过应用软件集合起来协同工作，共同对外提供数据存储和业务访问功能的一个系统，保证数据的安全性， 并节约存储空间。"},{"id":552,"question":"阿里云文件存储 NAS（Apsara File Storage NAS）是面向阿里云 ECS 实例、容器服务等计算节点的文件 存储服务，支持______协议。","options":{"A":"NFS","B":"SMB","C":"NFS、SMB","D":"SAMBA、SMB"},"answer":["C"],"explanation":"阿里云文件存储 NAS（Apsara File Storage NAS）是面向阿里云 ECS 实例、容器服务等计算节点的文 件存储服务。它是一种可共享访问、弹性扩展、高可靠以及高性能 的分布式文件系统。支持 NFS 及 SMB 协 议，在不同操作系统之间实现数据共享访问能力。"},{"id":553,"question":"阿里云对象存储 OSS（Object Storage Service）可提供（）的数据持久性，99.995%的数据可用性。","options":{"A":"99.9999999%（9 个 9）","B":"99.99999999%（10 个 9）","C":"99.999999999%（11 个 9）","D":"99.9999999999%（12 个 9）"},"answer":["D"],"explanation":"阿里云对象存储 OSS（Object Storage Service）是一款海量、安全、低成本、高可靠的云存储服 务，可提供 99.9999999999%（12 个 9）的数据持久性，99.995%的数据可用性。"},{"id":554,"question":"阿里巴巴自研的新一代云原生关系型数据库，在存储计算分离架构下，利用了软硬件结合的优势，为用 户提供具备极致弹性、高性能、海量存储、安全可靠的数据库服务，这是什么数据库？","options":{"A":"RDS MySQL","B":"RDS","C":"PolarDB","D":"Redis"},"answer":["C"],"explanation":"PolarDB 是阿里巴巴自研的新一代云原生关系型数据库，在存储计算分离架构下，利用了软硬件结合 的优势，为用户提供具备极致弹性、高性能、海量存储、安全可靠的数据库服务。PolarDB 100%兼容 MySQL 5.6/5.7/8.0，PostgreSQL 11，高度兼容 Oracle。"},{"id":555,"question":"下面不属于 VPC 的组件包括？","options":{"A":"交换机","B":"网关","C":"协议","D":"控制器"},"answer":["C"],"explanation":"VPC 包含交换机、网关和控制器三个重要的组件。交换机和网关组成了数据通路的关键路径，控制器 使用自研协议下发转发表到网关和交换机，完成了配置通路的关键路径。配置通路和数据通路互相分离。 VPC 中的交换机是分布式的节点，网关和控制器都是集群部署且多机房互备，所有链路上都具备冗余容灾， 提升了 VPC 的整体可用性。"},{"id":556,"question":"随着云计算的普及，企业逐渐将数据中心的业务应用迁移上云。过去以 IDC 为中心的______，正在演进 到以云为中心的______。","options":{"A":"网状网络拓扑结构，星形网络结构","B":"总线型网络拓扑结构，环形网络拓扑结构","C":"星形网络结构，混合云网络结构","D":"树型网络拓扑结构，混合网络型拓扑结构"},"answer":["C"],"explanation":"随着云计算的普及，企业逐渐将数据中心的业务应用迁移上云。过去以 IDC 为中心的星形网络结构， 正在演进到以云为中心的混合云网络结构，云下和云上之间的网络连接成为关键。"},{"id":557,"question":"目前 CDN 部分节点已支持通过（）进行访问。","options":{"A":"IPv4","B":"IPv6","C":"IPv8","D":"IPv9"},"answer":["B"],"explanation":"目前 CDN 部分节点已支持通过 IPv6 访问。"},{"id":558,"question":"云计算平台集中管理众多服务器、提供服务，“云”是指这类共享的______。","options":{"A":"存储资源池","B":"网络资源池","C":"计算资源池","D":"访问资源池"},"answer":["C"],"explanation":"云计算平台是一种与信息科技、手机软件、互联网有关的服务项目。云计算平台集中管理众多服务 器、提供服务，这类共享的计算资源池被称作“云”。"},{"id":559,"question":"云平台自身安全一般包括（）内容？","options":{"A":"数据安全","B":"应用系统安全","C":"服务安全","D":"存储安全","E":"迁移安全","F":"用户信息安全"},"answer":["A","B","C","F"],"explanation":"云平台自身的安全风险，主要针对云环境本身存在的安全隐患，如数据安全、应用系统安全、服务安 全、用户信息安全等。"},{"id":560,"question":"和传统互联网一样，虚拟化也受到了下列哪些攻击的威胁？","options":{"A":"VLAN 跳跃攻击","B":"CAM/MAC 泛洪攻击","C":"ARP 欺骗","D":"生成树攻击","E":"DoS 攻击","F":"MAC 地址欺骗"},"answer":["A","B","C","D","E","F"],"explanation":"和传统互联网一样，虚拟化也受到了 VLAN 跳跃攻击、CAM/MAC 泛洪攻击、ARP 欺骗、生成树攻击、 DoS 攻击、MAC 地址欺骗等攻击的威胁。"},{"id":561,"question":"云计算的出现，打破了地域的概念。用户______自己的数据存贮在什么地方，以及可能由哪些服务器来 处理。","options":{"A":"知道","B":"不知道","C":"可选择","D":"不能选择"},"answer":["B"],"explanation":"云计算的出现，打破了地域的概念。用户不知道自己的数据存贮在什么地方，以及可能由哪些服务器 来处理。"},{"id":562,"question":"云计算安全建设的原则应当是以传统安全建设的角度考虑，充分考虑客户和云服务供应商的安全需求， 以适应云计算的安全防护需求，下面哪一项不是云计算安全性建设的原则内容？","options":{"A":"整体性原则","B":"性能与安全并存原则","C":"纵深防护原则","D":"技术与管理并重原则","E":"最小特权原则"},"answer":["B"],"explanat
