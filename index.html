<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>阿里云刷题</title>
<style>:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--muted:#73777e;--line:#e5e7eb;--good:#16794b;--bad:#c43d3d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:92px}.top{position:sticky;top:0;z-index:10;background:#f5f6f8ee;backdrop-filter:blur(12px);padding:12px 14px;border-bottom:1px solid var(--line)}.row,.cloud,.tabs{display:flex;align-items:center;gap:8px}.grow{flex:1}.title{font-size:18px;font-weight:750}.stats,.status,.hint,.small{font-size:12px;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px}.progress{height:5px;background:#e0e3e7;border-radius:9px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:#111827}.tabs,.cloud{padding:10px 14px 0;flex-wrap:wrap}.chip,.mini,.jump,input{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 11px;font-size:13px}.chip{border-radius:99px}.chip.active{background:#111827;color:#fff}.jump{width:80px}.status{flex:1;min-width:180px}.status.ok{color:var(--good)}.status.err{color:var(--bad)}.auth{display:none;margin:9px 14px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:14px}.auth.show{display:block}.authgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.auth input{width:100%;font-size:14px}.authactions{display:flex;gap:8px;margin-top:8px}.hint{margin-top:7px}.card{margin:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.meta{display:flex;justify-content:space-between;margin-bottom:12px}.badge{font-size:12px;background:#eef1f4;padding:5px 8px;border-radius:8px}.q{font-size:18px;line-height:1.7;font-weight:650;white-space:pre-wrap}.option{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin-top:10px;font-size:16px;line-height:1.5}.letter{flex:0 0 26px;height:26px;border:1px solid #cfd4da;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}.option.selected{background:#f4f6f8}.option.selected .letter{background:#111827;color:#fff}.option.good{background:#edf8f2;border-color:#8cc9aa}.option.bad{background:#fff1f1;border-color:#e3a1a1}.option.good .letter{background:var(--good);color:#fff}.option.bad .letter{background:var(--bad);color:#fff}.answer{display:none;border-top:1px solid var(--line);padding-top:14px;margin-top:15px;line-height:1.7}.answer.show{display:block}.exp{font-size:14px;color:#4f555c;margin-top:8px;white-space:pre-wrap}.empty{padding:60px 20px;text-align:center;color:var(--muted)}.toolbar{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}.toolbarin{max-width:692px;margin:auto;display:grid;grid-template-columns:52px 1fr 1fr 52px;gap:9px}.btn{border:0;border-radius:13px;padding:13px 10px;font-weight:700;background:#111827;color:#fff;font-size:15px}.secondary{background:#eef1f4;color:#222}@media(max-width:520px){.authgrid{grid-template-columns:1fr}}</style></head>
<body><div class="app"><div class="top"><div class="row"><div class="grow"><div class="title">阿里云刷题</div><div class="stats"><span id="done">已答 0</span><span id="correct">正确 0</span><span id="wrongN">当前错题 0</span><span id="wrong1N">错1次 0</span><span id="wrong2N">错2次 0</span><span id="wrong3N">错3+次 0</span><span id="favN">收藏 0</span><span id="cursorText">进度 --</span></div></div><input id="jump" class="jump" inputmode="numeric" placeholder="跳到题号"></div><div class="progress"><i id="bar"></i></div></div>
<div class="tabs"><button class="chip active" data-mode="all">顺序刷题</button><button class="chip" data-mode="wrong">当前错题</button><button class="chip" data-mode="wrong1">错1次</button><button class="chip" data-mode="wrong2">错2次</button><button class="chip" data-mode="wrong3">错3+次</button><button class="chip" data-mode="fav">收藏</button></div>
<div class="cloud"><span id="cloudStatus" class="status">正在检查登录状态…</span><button id="syncBtn" class="mini" hidden>重新读取云端</button><button id="loginToggle" class="mini">登录 / 注册</button><button id="logoutBtn" class="mini" hidden>退出</button></div>
<div id="auth" class="auth"><div class="authgrid"><input id="email" type="email" autocomplete="email" placeholder="邮箱"><input id="password" type="password" autocomplete="current-password" placeholder="密码（至少6位）"></div><div class="authactions"><button id="signin" class="mini">登录</button><button id="signup" class="mini">注册</button><button id="cancelAuth" class="mini">取消</button></div><div class="hint">登录后以云端进度为准。答题、错题次数和收藏都会自动同步。</div></div>
<main id="main"><div class="empty">正在加载题库…</div></main></div>
<div class="toolbar"><div class="toolbarin"><button id="prev" class="btn secondary">‹</button><button id="fav" class="btn secondary">☆ 收藏</button><button id="submit" class="btn">提交答案</button><button id="next" class="btn secondary">›</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const QSRC='https://raw.githubusercontent.com/kjoe111/aliyun-quiz/a93e8897da814d97e3401f9e304183f46044a17f/index.html';
const SBURL='https://abeohnmkmtxlhcryxbax.supabase.co',SBKEY='sb_publishable_CHezIU3i81XsoULMhoH7Tw_Yl_8mhBN';
const KEY='aliyun_quiz_single_v1',OLDKEY='aliyun_quiz_mobile_v1';
const MODES=['all','wrong','wrong1','wrong2','wrong3','fav'];
const DEF={cursor:1,mode:'all',answers:{},wrong:{},errorCounts:{},fav:{},favUpdatedAt:{}};
let QUESTIONS=[],state=structuredClone(DEF),sb=null,user=null,selected=[],revealed=false,shownId=null,shownMap=null,viewId=null,saveChain=Promise.resolve();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function deriveCursor(s){if(Number(s?.cursor)>=1)return Math.min(750,Number(s.cursor));if(Number(s?.positions?.all)>=0)return Math.min(750,Number(s.positions.all)+1);const a=s?.answers||{};let i=1;while(i<=750&&a[i])i++;return Math.min(750,i)}
function norm(x){x=x&&typeof x==='object'?x:{};const s={...structuredClone(DEF),...x};s.answers=s.answers||{};s.wrong=s.wrong||{};s.errorCounts=s.errorCounts||{};s.fav=s.fav||{};s.favUpdatedAt=s.favUpdatedAt||{};Object.keys(s.wrong).forEach(id=>{if(!s.errorCounts[id])s.errorCounts[id]=1});s.mode=MODES.includes(s.mode)?s.mode:'all';s.cursor=deriveCursor(s);return s}
function localLoad(){try{const n=JSON.parse(localStorage.getItem(KEY)||'null');if(n){state=norm(n);return}const old=JSON.parse(localStorage.getItem(OLDKEY)||'null');if(old)state=norm({...old,cursor:deriveCursor(old),mode:'all'})}catch(e){}}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
async function loadQuestions(){const r=await fetch(QSRC,{cache:'force-cache'});if(!r.ok)throw Error('题库下载失败');const t=await r.text(),a=t.indexOf('const QUESTIONS='),b=t.indexOf('\nconst KEY=',a);QUESTIONS=JSON.parse(t.slice(a+16,b).replace(/;\s*$/,''));if(QUESTIONS.length!==750)throw Error('题库数量异常')}
function status(t,c=''){$('cloudStatus').textContent=t;$('cloudStatus').className='status '+c}
function currentList(){if(state.mode==='wrong')return QUESTIONS.filter(q=>state.wrong[q.id]);if(state.mode==='wrong1')return QUESTIONS.filter(q=>(+state.errorCounts[q.id]||0)===1);if(state.mode==='wrong2')return QUESTIONS.filter(q=>(+state.errorCounts[q.id]||0)===2);if(state.mode==='wrong3')return QUESTIONS.filter(q=>(+state.errorCounts[q.id]||0)>=3);if(state.mode==='fav')return QUESTIONS.filter(q=>state.fav[q.id]===true);return QUESTIONS}
function currentIndex(){const l=currentList();if(!l.length)return 0;const target=Number(viewId)||state.cursor;const exact=l.findIndex(q=>q.id===target);if(exact>=0)return exact;const after=l.findIndex(q=>q.id>=target);return after>=0?after:l.length-1}
function currentQ(){const l=currentList();return l[currentIndex()]||null}
function shuffle(q){const arr=Object.keys(q.options);for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr.map((orig,i)=>({display:'ABCDEFGH'[i]||String(i+1),orig,text:q.options[orig]}))}
function correctDisplay(q){return shownMap.filter(x=>q.answer.includes(x.orig)).map(x=>x.display)}
function stats(){const vals=Object.values(state.answers),ec=Object.values(state.errorCounts).map(Number);$('done').textContent='已答 '+vals.length;$('correct').textContent='正确 '+vals.filter(x=>x?.correct).length;$('wrongN').textContent='当前错题 '+Object.keys(state.wrong).length;$('wrong1N').textContent='错1次 '+ec.filter(n=>n===1).length;$('wrong2N').textContent='错2次 '+ec.filter(n=>n===2).length;$('wrong3N').textContent='错3+次 '+ec.filter(n=>n>=3).length;$('favN').textContent='收藏 '+Object.keys(state.fav).filter(id=>state.fav[id]===true).length;$('cursorText').textContent='续做第 '+state.cursor+' 题'}
function render(forceShuffle=false){const l=currentList(),m=$('main');document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));if(!l.length){m.innerHTML='<div class="empty">这里还没有题目。</div>';$('fav').textContent='☆ 收藏';stats();return}const idx=currentIndex(),q=l[idx];viewId=q.id;if(forceShuffle||shownId!==q.id||!shownMap){shownId=q.id;shownMap=shuffle(q)}selected=[];revealed=false;m.innerHTML=`<section class="card"><div class="meta"><span class="badge">${q.answer.length>1?'多选题':'单选题'}</span><span class="small">第 ${q.id} 题 · ${idx+1}/${l.length}</span></div><div class="q">${esc(q.question)}</div>${shownMap.map(x=>`<button class="option" data-k="${x.display}"><span class="letter">${x.display}</span><span>${esc(x.text)}</span></button>`).join('')}<div id="answer" class="answer"><b>正确答案：${correctDisplay(q).join('、')}</b><div class="exp">${q.explanation?esc(q.explanation):'原资料未提供解析。'}</div></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b.dataset.k));$('fav').textContent=state.fav[q.id]===true?'★ 已收藏':'☆ 收藏';$('submit').textContent='提交答案';$('bar').style.width=(q.id/750*100)+'%';stats();window.scrollTo({top:0,behavior:'smooth'})}
function choose(k){if(revealed)return;const q=currentQ();selected=q.answer.length===1?[k]:(selected.includes(k)?selected.filter(x=>x!==k):[...selected,k]);paint(q)}
function paint(q){const good=correctDisplay(q);document.querySelectorAll('.option').forEach(b=>{const k=b.dataset.k;b.classList.remove('selected','good','bad');if(selected.includes(k))b.classList.add('selected');if(revealed){if(good.includes(k))b.classList.add('good');else if(selected.includes(k))b.classList.add('bad')}});$('answer')?.classList.toggle('show',revealed)}
function same(a,b){a=[...a].sort();b=[...b].sort();return a.length===b.length&&a.every((x,i)=>x===b[i])}
function cloudPayload(){return{cursor:state.cursor,mode:'all',answers:state.answers,wrong:state.wrong,errorCounts:state.errorCounts,fav:state.fav,favUpdatedAt:state.favUpdatedAt}}
function queueCloudSave(){if(!user)return Promise.resolve(false);const snapshot=JSON.parse(JSON.stringify(cloudPayload()));saveChain=saveChain.catch(()=>{}).then(async()=>{status('正在同步第 '+snapshot.cursor+' 题…');const {error}=await sb.from('quiz_progress').upsert({user_id:user.id,state:snapshot,device_id:'single-device',nav_mode:'all',nav_index:snapshot.cursor-1,nav_question_id:snapshot.cursor,nav_device_id:'single-device'},{onConflict:'user_id'});if(error){status('同步失败：'+error.message,'err');throw error}status('已同步 · 下次从第 '+snapshot.cursor+' 题继续','ok');return true});return saveChain}
async function pullCloud(){if(!user)return;status('正在确认云端进度…');const {data,error}=await sb.from('quiz_progress').select('state').eq('user_id',user.id).maybeSingle();if(error){status('读取失败：'+error.message,'err');return}if(data?.state){state=norm({...data.state,cursor:Number(data.state.cursor)||deriveCursor(data.state),mode:'all'});viewId=state.cursor;localSave();shownId=null;render(true);status('云端确认：从第 '+state.cursor+' 题继续','ok')}else{localSave();await queueCloudSave()}}
async function submit(){const q=currentQ();if(!q)return;if(revealed){viewId=state.mode==='all'?state.cursor:viewId;shownId=null;render(true);return}if(!selected.length){alert('请先选择答案');return}const good=correctDisplay(q),ok=same(selected,good),orig=selected.map(k=>shownMap.find(x=>x.display===k)?.orig).filter(Boolean);state.answers[q.id]={selected:orig,correct:ok,updatedAt:Date.now()};if(ok)delete state.wrong[q.id];else{state.wrong[q.id]=true;state.errorCounts[q.id]=(+state.errorCounts[q.id]||0)+1}if(state.mode==='all')state.cursor=Math.min(750,q.id+1);localSave();revealed=true;paint(q);stats();$('submit').textContent='下一题';queueCloudSave()}
function go(d){const l=currentList();if(!l.length)return;const i=currentIndex(),ni=Math.max(0,Math.min(l.length-1,i+d)),q=l[ni];viewId=q.id;shownId=null;render(true)}
function toggleFav(){const q=currentQ();if(!q)return;const wasFav=state.fav[q.id]===true;if(wasFav)delete state.fav[q.id];else state.fav[q.id]=true;state.favUpdatedAt[q.id]=Date.now();localSave();queueCloudSave();if(state.mode==='fav'&&wasFav){const remaining=currentList();shownId=null;if(!remaining.length){viewId=null;render(true);return}const next=remaining.find(x=>x.id>q.id)||remaining[remaining.length-1];viewId=next.id;render(true);return}$('fav').textContent=state.fav[q.id]===true?'★ 已收藏':'☆ 收藏';stats()}
async function initAuth(){sb=supabase.createClient(SBURL,SBKEY);const {data}=await sb.auth.getSession();user=data.session?.user||null;authUI();if(user)await pullCloud();else status('未登录 · 当前仅保存本机');sb.auth.onAuthStateChange((event,session)=>{const next=session?.user||null;if(next?.id===user?.id)return;user=next;authUI();if(user)setTimeout(pullCloud,0)})}
function authUI(){$('syncBtn').hidden=!user;$('logoutBtn').hidden=!user;$('loginToggle').hidden=!!user;$('auth').classList.remove('show');if(user)status('已登录，正在确认云端…');else status('未登录 · 当前仅保存本机')}
$('loginToggle').onclick=()=>{$('auth').classList.add('show')};$('cancelAuth').onclick=()=>$('auth').classList.remove('show');$('signin').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;status('正在登录…');const {error}=await sb.auth.signInWithPassword({email,password});if(error)status('登录失败：'+error.message,'err')};$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://kjoe111.github.io/aliyun-quiz/'}});status(error?'注册失败：'+error.message:'注册成功，请按邮件提示确认',error?'err':'ok')};$('logoutBtn').onclick=()=>sb.auth.signOut();$('syncBtn').onclick=pullCloud;
$('submit').onclick=submit;$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);$('fav').onclick=toggleFav;$('jump').onchange=()=>{const n=Math.max(1,Math.min(750,parseInt($('jump').value)||state.cursor));state.mode='all';viewId=n;shownId=null;render(true);$('jump').value=''};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;viewId=state.cursor;shownId=null;render(true)});
(async()=>{try{localLoad();viewId=state.cursor;await loadQuestions();render(true);await initAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')}catch(e){$('main').innerHTML='<div class="empty">'+esc(e.message)+'</div>';status(e.message,'err')}})();
</script></body></html>
